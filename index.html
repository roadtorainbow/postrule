<!DOCTYPE html>
<html lang="zh-Hant" data-font-scale="large">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>法規與公文檢索系統</title>
    <style>
        /* =========================================================
           1. 純原生 CSS 設計系統（零外部框架依賴、防破版、高對比）
           ========================================================= */
        :root {
            --bg-page: #f4f6f9;
            --bg-card: #ffffff;
            --bg-subtle: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --border-light: #e2e8f0;
            --brand-primary: #1e40af;
            --brand-hover: #1e3a8a;
            --brand-soft: #eff6ff;
            --brand-border: #bfdbfe;
            --danger-color: #dc2626;
            --danger-soft: #fef2f2;
            --danger-border: #fecaca;
            --success-color: #059669;
            --success-soft: #ecfdf5;
            --success-border: #a7f3d0;
            --amber-star: #f59e0b;
            --folder-color: #d97706;
            --folder-soft: #fffbeb;
            --folder-border: #fde68a;
            --radius-lg: 14px;
            --radius-md: 10px;
            --radius-sm: 8px;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
            --shadow-float: 0 10px 25px -5px rgba(15, 23, 42, 0.28), 0 8px 10px -6px rgba(15, 23, 42, 0.16);

            /* 動態閱讀字級變數（預設放大 20px） */
            --reader-font-size: 20px;
            --reader-line-height: 1.8;
            --list-title-size: 17px;
        }

        html[data-font-scale="normal"] {
            --reader-font-size: 16px;
            --reader-line-height: 1.7;
            --list-title-size: 15px;
        }

        html[data-font-scale="large"] {
            --reader-font-size: 20px;
            --reader-line-height: 1.8;
            --list-title-size: 17px;
        }

        html[data-font-scale="xlarge"] {
            --reader-font-size: 24px;
            --reader-line-height: 1.9;
            --list-title-size: 19px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            overflow-x: hidden;
        }

        button, input, textarea, select {
            font-family: inherit;
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
        }

        .hidden {
            display: none !important;
        }

        /* =========================================================
           2. 極簡單排頂部導覽列
           ========================================================= */
        .app-header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 0;
            z-index: 60;
            box-shadow: var(--shadow-sm);
        }

        .header-inner {
            max-width: 920px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding: 8px 12px;
        }

        .brand-btn {
            font-size: 17px;
            font-weight: 800;
            color: var(--text-primary);
            white-space: nowrap;
            flex-shrink: 0;
            padding: 4px 2px;
        }

        .brand-btn:hover {
            color: var(--brand-primary);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .font-pill-group {
            display: inline-flex;
            align-items: center;
            background-color: var(--bg-subtle);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            padding: 2px;
            gap: 2px;
            flex-shrink: 0;
        }

        .font-pill-btn {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 5px 7px;
            border-radius: 8px;
            white-space: nowrap;
            transition: background-color 0.15s, color 0.15s;
        }

        .font-pill-btn.active {
            background-color: var(--brand-primary);
            color: #ffffff;
            font-weight: 700;
        }

        /* 純圖示按鈕（34x34px） */
        .icon-btn {
            position: relative;
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            color: var(--text-primary);
            flex-shrink: 0;
            overflow: hidden;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .icon-btn:hover {
            background-color: var(--bg-subtle);
            border-color: #94a3b8;
        }

        .icon-btn.primary {
            background-color: var(--brand-primary);
            border-color: var(--brand-primary);
            color: #ffffff;
        }

        .icon-btn.primary:hover {
            background-color: var(--brand-hover);
        }

        .icon-btn.brand-outline {
            color: var(--brand-primary);
            border-color: var(--brand-border);
            background-color: var(--brand-soft);
        }

        .icon-btn.danger-outline {
            color: var(--danger-color);
            border-color: var(--danger-border);
            background-color: var(--danger-soft);
        }

        .icon-btn.success-solid {
            background-color: var(--success-color);
            border-color: var(--success-color);
            color: #ffffff;
        }

        /* 原生透明全覆蓋檔案輸入框（手機 WebView 100% 可直接喚起選檔） */
        .native-file-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 5;
            font-size: 0;
        }

        /* =========================================================
           3. 主容器（底部預留 150px 安全空間避開懸浮球與系統列）
           ========================================================= */
        .main-container {
            max-width: 920px;
            margin: 0 auto;
            padding: 12px 12px 150px 12px;
        }

        /* 解析進度條 */
        .progress-panel {
            background-color: var(--brand-soft);
            border: 1px solid var(--brand-border);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: var(--shadow-sm);
        }

        .progress-text {
            font-size: 13px;
            font-weight: 700;
            color: var(--brand-primary);
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background-color: #dbeafe;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: var(--brand-primary);
            transition: width 0.2s ease;
        }

        /* =========================================================
           4. 封面資料夾總覽（極簡無首頁搜尋橫條，直接呈現資料夾）
           ========================================================= */
        .section-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .cover-actions-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .add-folder-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 36px;
            padding: 0 11px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .add-folder-btn:hover {
            background-color: var(--bg-subtle);
            border-color: #94a3b8;
        }

        .batch-upload-label {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 36px;
            padding: 0 12px;
            background-color: var(--brand-primary);
            color: #ffffff;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
            overflow: hidden;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .batch-upload-label:hover {
            background-color: var(--brand-hover);
        }

        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 8px;
        }

        .folder-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 12px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .folder-card:hover {
            border-color: #93c5fd;
        }

        .folder-card-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .folder-icon-badge {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background-color: var(--folder-soft);
            border: 1px solid var(--folder-border);
            color: var(--folder-color);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .folder-icon-badge.official {
            background-color: var(--brand-soft);
            border-color: var(--brand-border);
            color: var(--brand-primary);
        }

        .folder-icon-badge.default-cat {
            background-color: var(--bg-subtle);
            border-color: var(--border-color);
            color: var(--text-secondary);
        }

        .folder-info {
            min-width: 0;
            flex: 1;
        }

        .folder-name {
            font-size: var(--list-title-size);
            font-weight: 700;
            color: var(--text-primary);
            word-break: break-word;
            line-height: 1.35;
        }

        .folder-count {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* 加大手機觸控區域至 36x36px 並增加間距避免誤觸資料夾本體 */
        .folder-card-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .folder-mini-btn {
            position: relative;
            width: 36px;
            height: 36px;
            border-radius: 9px;
            color: #64748b;
            background-color: var(--bg-subtle);
            border: 1px solid var(--border-light);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .folder-mini-btn:hover {
            background-color: #e2e8f0;
            color: var(--text-primary);
        }

        .folder-mini-btn.upload-mini {
            color: var(--brand-primary);
            background-color: var(--brand-soft);
            border-color: var(--brand-border);
        }

        .folder-mini-btn.del:hover {
            background-color: var(--danger-soft);
            border-color: var(--danger-border);
            color: var(--danger-color);
        }

        /* =========================================================
           5. 資料夾內清單與跨資料夾搜尋結果
           ========================================================= */
        .folder-toolbar-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 10px 12px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .folder-toolbar-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex: 1;
        }

        .folder-heading-wrap {
            min-width: 0;
            flex: 1;
        }

        .folder-heading {
            font-size: calc(var(--list-title-size) + 1px);
            font-weight: 800;
            color: var(--text-primary);
            word-break: break-word;
            line-height: 1.3;
        }

        .folder-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .clear-filter-pill {
            font-size: 12px;
            font-weight: 700;
            color: var(--brand-primary);
            background-color: var(--brand-soft);
            border: 1px solid var(--brand-border);
            padding: 4px 10px;
            border-radius: 8px;
            white-space: nowrap;
        }

        .doc-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .doc-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 12px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .doc-card:hover {
            border-color: #93c5fd;
        }

        .doc-card-star {
            font-size: 22px;
            line-height: 1;
            color: #cbd5e1;
            padding: 2px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .doc-card-star.starred {
            color: var(--amber-star);
        }

        .doc-card-body {
            flex: 1;
            min-width: 0;
        }

        .doc-card-title {
            font-size: var(--list-title-size);
            font-weight: 700;
            color: var(--text-primary);
            word-break: break-word;
            line-height: 1.4;
        }

        .doc-card-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        .folder-move-select {
            height: 26px;
            max-width: 165px;
            padding: 0 6px;
            border-radius: 6px;
            border: 1px solid var(--folder-border);
            background-color: var(--folder-soft);
            color: var(--folder-color);
            font-size: 12px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        .folder-move-select.reader-select {
            height: 34px;
            max-width: 145px;
            font-size: 12px;
            border-radius: var(--radius-sm);
        }

        .badge-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 6px;
        }

        .badge-ocr {
            background-color: var(--brand-soft);
            color: var(--brand-primary);
            border: 1px solid var(--brand-border);
        }

        .badge-updated {
            background-color: var(--success-soft);
            color: var(--success-color);
            border: 1px solid var(--success-border);
        }

        .doc-card-snippet {
            margin-top: 8px;
            padding: 8px 10px;
            background-color: #f8fafc;
            border-left: 3px solid var(--brand-primary);
            border-radius: 0 8px 8px 0;
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.55;
            word-break: break-word;
        }

        .empty-state {
            background-color: var(--bg-card);
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-lg);
            padding: 32px 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 15px;
        }

        /* =========================================================
           6. 閱讀模式（純圖示單排工具列 + 垂直分離標題 + 條文區塊）
           ========================================================= */
        .reader-header-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 10px 12px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .reader-toolbar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            width: 100%;
            flex-wrap: wrap;
        }

        .reader-toolbar-right {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        .reader-star-btn {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            font-size: 20px;
            line-height: 1;
            color: #cbd5e1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .reader-star-btn.starred {
            color: var(--amber-star);
            background-color: #fffbeb;
            border-color: #fcd34d;
        }

        .reader-title-block {
            width: 100%;
            border-top: 1px solid var(--border-light);
            padding-top: 10px;
        }

        .reader-doc-title {
            font-size: calc(var(--list-title-size) + 2px);
            font-weight: 800;
            color: var(--text-primary);
            word-break: break-word;
            line-height: 1.4;
        }

        .reader-doc-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .page-section {
            margin-bottom: 14px;
        }

        .page-divider {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin: 0 0 6px 4px;
        }

        .article-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: var(--shadow-sm);
            position: relative;
        }

        .article-copy-btn {
            float: right;
            margin: 0 0 4px 8px;
            width: 28px;
            height: 28px;
            border-radius: 7px;
            border: 1px solid var(--border-light);
            background-color: var(--bg-subtle);
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .article-copy-btn:hover {
            color: var(--brand-primary);
            border-color: var(--brand-border);
            background-color: var(--brand-soft);
        }

        .article-copy-btn.copied {
            color: var(--success-color);
            border-color: var(--success-border);
            background-color: var(--success-soft);
        }

        .article-text {
            font-size: var(--reader-font-size);
            line-height: var(--reader-line-height);
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .inline-edit-textarea {
            width: 100%;
            min-height: 200px;
            padding: 10px;
            border: 1.5px solid var(--brand-primary);
            border-radius: var(--radius-sm);
            font-size: var(--reader-font-size);
            line-height: var(--reader-line-height);
            color: var(--text-primary);
            background-color: #ffffff;
            resize: vertical;
            outline: none;
        }

        .inline-edit-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 8px;
        }

        mark.hl-match {
            background-color: #fef08a;
            color: #0f172a;
            padding: 0 2px;
            border-radius: 3px;
        }

        mark.hl-match.active-match {
            background-color: #ea580c;
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 0 0 2px rgba(234, 88, 12, 0.35);
        }

        /* =========================================================
           7. 全站通用可自由拖曳懸浮球與懸浮搜尋窗（FAB & Popover）
           ========================================================= */
        .fab-circle-btn {
            position: fixed;
            right: 16px;
            bottom: 105px;
            z-index: 999;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--brand-primary);
            color: #ffffff;
            box-shadow: var(--shadow-float);
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
            cursor: grab;
        }

        .fab-circle-btn:active {
            cursor: grabbing;
            transform: scale(0.96);
        }

        .fab-circle-btn.star-active {
            background-color: #b45309;
        }

        .fab-badge {
            position: absolute;
            top: -4px;
            left: -4px;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border-radius: 10px;
            background-color: #ea580c;
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .fab-popover {
            position: fixed;
            z-index: 1000;
            width: 288px;
            max-width: calc(100vw - 24px);
            background-color: rgba(255, 255, 255, 0.98);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 8px 10px 10px 10px;
            box-shadow: var(--shadow-float);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .fab-drag-handle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 4px;
            border-bottom: 1px dashed var(--border-light);
            cursor: grab;
            touch-action: none;
            user-select: none;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
        }

        .fab-drag-handle:active {
            cursor: grabbing;
        }

        .fab-popover-top {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .fab-search-input-wrap {
            position: relative;
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
        }

        .fab-search-input {
            width: 100%;
            height: 36px;
            padding: 0 26px 0 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);

        /* =========================================================
           8. Toast 提示與自訂對話框
           ========================================================= */
        .toast-box {
            position: fixed;
            top: 58px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1100;
            background-color: #0f172a;
            color: #ffffff;
            padding: 8px 16px;

    <script>
        /* =========================================================
           1. 動態背景載入外部解析引擎（非阻塞，離線亦不影響任何按鈕運作）
           ========================================================= */
        let pdfLibReadyPromise = null;
        let tesseractReadyPromise = null;

        function loadExternalScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.async = true;
                s.onload = () => resolve(true);
                s.onerror = () => reject(new Error('無法載入外部腳本：' + src));
                document.head.appendChild(s);
            });
        }

        function ensurePdfJsLoaded() {
            if (window.pdfjsLib) return Promise.resolve(true);
            if (!pdfLibReadyPromise) {
                pdfLibReadyPromise = loadExternalScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js')
                    .then(() => {
                        if (window.pdfjsLib) {
                            pdfjsLib.GlobalWorkerOptions.workerSrc =
                                'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                            return true;
                        }
                        return false;
                    })
                    .catch(() => {
                        pdfLibReadyPromise = null;
                        return false;
                    });
            }
            return pdfLibReadyPromise;
        }

        function ensureTesseractLoaded() {
            if (window.Tesseract) return Promise.resolve(true);
            if (!tesseractReadyPromise) {
                tesseractReadyPromise = loadExternalScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js')
                    .then(() => Boolean(window.Tesseract))
                    .catch(() => {
                        tesseractReadyPromise = null;
                        return false;
                    });
            }
            return tesseractReadyPromise;
        }

        /* =========================================================
           2. 預設資料夾與初始範例（資料庫名稱 RegDocDB_v1）
           ========================================================= */
        const UNCATEGORIZED_FOLDER_ID = 'folder-uncategorized';

        const DEFAULT_FOLDERS = [
            { id: UNCATEGORIZED_FOLDER_ID, name: '未分類 / 一般法規', kind: 'default' },
            { id: 'folder-01', name: '01儲金業務作業規章', kind: 'normal' },
            { id: 'folder-02', name: '02劃撥業務作業規章', kind: 'normal' },
            { id: 'folder-03', name: '03匯兌業務作業規章', kind: 'normal' },
            { id: 'folder-04', name: '04代辦業務作業規章', kind: 'normal' },
            { id: 'folder-05', name: '05自動化業務作業規章', kind: 'normal' },
            { id: 'folder-official', name: '重要公文', kind: 'official' }
        ];

        const SAMPLE_DOCS = [
            {
                id: 'sample-doc-1',
                folderId: 'folder-01',
                title: '1-01郵政儲金匯兌法（範例）.txt',
                coreName: '郵政儲金匯兌法',
                isOcr: false,

        /* =========================================================
           3. IndexedDB 本機資料庫（RegDocDB_v1，僅於 IDB 不可用時降級 localStorage）
           ========================================================= */
        const DB_NAME = 'RegDocDB_v1';
        const DB_VERSION = 1;
        const STORE_DOCS = 'documents';
        const STORE_FOLDERS = 'folders';
        const STORE_PREFS = 'preferences';
        let idbAvailable = true;

        function openDB() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) {
                    idbAvailable = false;
                    return reject(new Error('IndexedDB unavailable'));
                }
                try {
                    const req = indexedDB.open(DB_NAME, DB_VERSION);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(STORE_DOCS)) {
                            db.createObjectStore(STORE_DOCS, { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains(STORE_FOLDERS)) {
                            db.createObjectStore(STORE_FOLDERS, { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains(STORE_PREFS)) {
                            db.createObjectStore(STORE_PREFS, { keyPath: 'key' });
                        }
                    };
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => {
                        idbAvailable = false;
                        reject(req.error);
                    };
                } catch (err) {
                    idbAvailable = false;
                    reject(err);
                }
            });
        }

        function syncFallbackStorage() {
            if (idbAvailable) return;
            try {
                localStorage.setItem('regdocdb_v1_folders', JSON.stringify(folders));
                localStorage.setItem('regdocdb_v1_documents', JSON.stringify(documents));
            } catch (e) {
                if (!quotaWarned) {
                    quotaWarned = true;
                    showToast('本機暫存空間已滿，請立即匯出 JSON 備份以防遺失', 'error');
                }
            }
        }

        async function dbGetAll(storeName) {
            try {
                const db = await openDB();
                return await new Promise((resolve) => {
                    const tx = db.transaction(storeName, 'readonly');
                    const req = tx.objectStore(storeName).getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => resolve([]);
                });
            } catch (e) {
                try {
                    const key = storeName === STORE_FOLDERS ? 'regdocdb_v1_folders' : 'regdocdb_v1_documents';
                    const raw = localStorage.getItem(key);
                    return raw ? JSON.parse(raw) : [];
                } catch (err) {
                    return [];
                }
            }
        }

        async function dbPut(storeName, item) {
            if (!idbAvailable) {
                syncFallbackStorage();
                return;
            }
            try {
                const db = await openDB();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, 'readwrite');
                    tx.objectStore(storeName).put(item);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            } catch (e) {
                idbAvailable = false;
                syncFallbackStorage();
            }
        }

        async function dbDelete(storeName, key) {
            if (!idbAvailable) {
                syncFallbackStorage();
                return;
            }
            try {
                const db = await openDB();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, 'readwrite');
                    tx.objectStore(storeName).delete(key);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            } catch (e) {
                idbAvailable = false;
                syncFallbackStorage();
            }
        }

        async function savePreference(key, value) {
            try {
                localStorage.setItem('regdocdb_pref_' + key, JSON.stringify(value));
            } catch (e) {}
            if (!idbAvailable) return;
            try {
                const db = await openDB();
                await new Promise((resolve) => {
                    const tx = db.transaction(STORE_PREFS, 'readwrite');
                    tx.objectStore(STORE_PREFS).put({ key, value });
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => resolve();
                });
            } catch (e) {}
        }

        async function loadPreference(key, fallback) {
            try {
                const db = await openDB();
                const val = await new Promise((resolve) => {
                    const tx = db.transaction(STORE_PREFS, 'readonly');
                    const req = tx.objectStore(STORE_PREFS).get(key);
                    req.onsuccess = () => resolve(req.result ? req.result.value : null);
                    req.onerror = () => resolve(null);
                });
                if (val !== null && val !== undefined) return val;
            } catch (e) {}
            try {
                const raw = localStorage.getItem('regdocdb_pref_' + key);
                return raw !== null ? JSON.parse(raw) : fallback;
            } catch (e) {
                return fallback;
            }
        }

        /* =========================================================
           4. 輔助函式
           ========================================================= */
        function extractCoreName(filename) {
            let name = filename.replace(/\.(pdf|txt|md|jpg|jpeg|png|webp)$/i, '');
            name = name.replace(/^[\d]+[-_.\s]+[\d]*[-_.\s]*/, '');
            name = name.replace(/[-_（(](上傳內部資訊網|範例|修正|最新|\d{6,8}).*$/g, '');
            return name.trim() || filename.replace(/\.(pdf|txt|md|jpg|jpeg|png|webp)$/i, '').trim();
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function parseKeywords(q) {
            return Array.from(new Set(q.trim().split(/\s+/).filter(Boolean)));
        }

        function highlightKeywords(text, keywords) {
            const safe = escapeHtml(text);
            if (!keywords || keywords.length === 0) return safe;
            const escaped = keywords.map(k => escapeHtml(k).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
            const regex = new RegExp(`(${escaped.join('|')})`, 'gi');
            return safe.replace(regex, '<mark class="hl-match">$1</mark>');
        }

                    resolve(val);
                };

                const onCancel = () => cleanup(null);
                const onConfirm = () => {

                    if (!trimmed) {
                        showToast('請輸入資料夾名稱', 'error');
                        return;

                    cleanup(trimmed);

                const onKey = (e) => {

        async function copyToClipboard(text) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) {}
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch (e) {
                return false;
            }
        }

        /* =========================================================
           5. 圖片純取文字（丟棄原圖）與 PDF / TXT 解析引擎（離線優雅降級）
           ========================================================= */
        async function runTesseractOCR(imageSource, labelPrefix) {
            setProgress(true, `${labelPrefix} 準備繁中 OCR 辨識引擎...`, 12);
            const loaded = await ensureTesseractLoaded();
            if (!loaded || !window.Tesseract) {
                return '（目前為離線或受限網路環境，無法下載 OCR 模型；您可點擊上方「編輯」圖示手動輸入文字）';
            }
            try {
                const result = await Tesseract.recognize(imageSource, 'chi_tra+eng', {
                    logger: (m) => {
                        if (m.status === 'recognizing text') {
                            const pct = Math.round((m.progress || 0) * 100);
                            setProgress(true, `${labelPrefix} 擷取文字中 (${pct}%)...`, pct);
                        } else if (m.status) {
                            setProgress(true, `${labelPrefix} 載入繁中辨識模型中...`, 25);
                        }
                    }
                });
                const raw = (result && result.data && result.data.text) ? result.data.text : '';
                const cleaned = raw
                    .replace(/([\u4e00-\u9fa5])\s+([\u4e00-\u9fa5])/g, '$1$2')
                    .replace(/\n{3,}/g, '\n\n')
                    .trim();
                return cleaned || '（未辨識到清晰文字，可點擊閱讀頁上方的「編輯」圖示手動補充）';
            } catch (err) {
                console.error('OCR 錯誤:', err);
                return '（圖片文字辨識失敗，請確認網路連線或點擊上方「編輯」手動補充）';
            }
        }

        async function parseAnyFile(file, index, total) {
            const lower = file.name.toLowerCase();
            const prefix = `[${index + 1}/${total}] ${file.name}`;

            // A. 圖片檔：執行 OCR 後僅保留純文字，立即釋放圖片記憶體（不存原圖）
            if (file.type.startsWith('image/') || /\.(jpg|jpeg|png|webp)$/i.test(lower)) {
                const objectUrl = URL.createObjectURL(file);
                try {
                    const extractedText = await runTesseractOCR(objectUrl, prefix);
                    return {
                        isOcr: true,
                        pages: [{
                            pageNumber: 1,
                            text: extractedText
                        }]
                    };
                } finally {
                    URL.revokeObjectURL(objectUrl);
                }
            }

            // B. PDF 檔案
            if (lower.endsWith('.pdf')) {
                setProgress(true, `${prefix} 載入 PDF 解析引擎...`, 10);
                const pdfReady = await ensurePdfJsLoaded();
                if (!pdfReady || !window.pdfjsLib) {
                    return {
                        isOcr: false,
                        pages: [{
                            pageNumber: 1,
                            text: '（目前為離線或受限網路環境，無法載入 PDF 解析元件；建議連網後重新匯入或改傳 .txt 純文字檔）'
                        }]
                    };
                }

                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const pages = [];
                let usedOcr = false;

                for (let p = 1; p <= pdf.numPages; p++) {
                    setProgress(true, `${prefix} 讀取第 ${p}/${pdf.numPages} 頁...`, Math.round((p / pdf.numPages) * 85));
                    const page = await pdf.getPage(p);
                    const content = await page.getTextContent();

                    let lastY = null;
                    let lineText = '';
                    const lines = [];
                    for (const item of content.items) {
                        const y = item.transform ? item.transform[5] : null;
                        if (lastY !== null && y !== null && Math.abs(y - lastY) > 6) {
                            lines.push(lineText.trim());
                            lineText = item.str;
                        } else {
                            lineText += item.str;
                        }
                        lastY = y;
                    }
                    if (lineText.trim()) lines.push(lineText.trim());
                    let extracted = lines.join('\n').trim();

                    // 若此 PDF 頁為掃描圖片（幾乎無內嵌文字），自動轉圖進行 OCR 後丟棄畫布
                    if (extracted.length < 15) {
                        const ocrReady = await ensureTesseractLoaded();
                        if (ocrReady && window.Tesseract) {
                            usedOcr = true;
                            const viewport = page.getViewport({ scale: 1.7 });
                            const canvas = document.createElement('canvas');
                            canvas.width = viewport.width;
                            canvas.height = viewport.height;
                            const ctx = canvas.getContext('2d');
                            await page.render({ canvasContext: ctx, viewport }).promise;
                            extracted = await runTesseractOCR(canvas, `${prefix} 第${p}頁(掃描)`);
                            canvas.width = 0;
                            canvas.height = 0;
                        }
                    }

                    pages.push({
                        pageNumber: p,
                        text: extracted || '（此頁無文字內容）'
                    });
                }
                return { isOcr: usedOcr, pages };
            }

            // C. 純文字檔 (.txt / .md)
            setProgress(true, `${prefix} 讀取純文字內容...`, 60);
            const rawText = await file.text();
            return {
                isOcr: false,
                pages: [{
                    pageNumber: 1,
                    text: rawText.replace(/\r\n/g, '\n').trim() || '（無文字內容）'
                }]
            };
        }

        async function processBatchFiles(fileList, targetFolderId, forceOverwriteDocId = null) {
            const files = Array.from(fileList || []);
            if (files.length === 0) return;

            const folderId = targetFolderId || UNCATEGORIZED_FOLDER_ID;
            const todayStr = new Date().toLocaleDateString('zh-TW');
            let added = 0;
            let updated = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                try {
                    const parsed = await parseAnyFile(file, i, files.length);
                    const core = extractCoreName(file.name);

                    let existing = null;
                    if (forceOverwriteDocId) {
                        existing = documents.find(d => d.id === forceOverwriteDocId) || null;
                    } else {
                        existing = documents.find(d => extractCoreName(d.title) === core) || null;
                    }

                    if (existing) {
                        existing.title = file.name;
                        existing.coreName = core;
                        existing.isOcr = parsed.isOcr;
                        existing.pages = parsed.pages;
                        existing.updatedAt = todayStr;
                        existing.isRecentlyUpdated = true;
                        await dbPut(STORE_DOCS, existing);
                        updated++;
                    } else {
                        const newDoc = {
                            id: 'doc-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
                            folderId,
                            title: file.name,
                            coreName: core,
                            isOcr: parsed.isOcr,
                            starred: false,
                            updatedAt: todayStr,
                            isRecentlyUpdated: false,
                            pages: parsed.pages
                        };
                        documents.unshift(newDoc);
                        await dbPut(STORE_DOCS, newDoc);
                        added++;
                    }
                } catch (err) {
                    console.error('匯入錯誤:', file.name, err);
                    showToast(`匯入失敗：${file.name}`, 'error');
                }
            }

            setProgress(false);
            sortDocuments();
            renderCurrentView();

            if (forceOverwriteDocId && activeDocId === forceOverwriteDocId) {
                openReaderView(forceOverwriteDocId, readerQuery);
            }

            if (updated > 0 && added > 0) {
                showToast(`新增 ${added} 份、覆蓋更新 ${updated} 份（已保留星號）`, 'success');
            } else if (updated > 0) {
                showToast(`已覆蓋更新 ${updated} 份文件（星號已保留）`, 'success');
            } else if (added > 0) {
                showToast(`成功匯入 ${added} 份文件`, 'success');
            }
        }

        function sortDocuments() {
            documents.sort((a, b) => {
                if (a.starred !== b.starred) return a.starred ? -1 : 1;
                return a.title.localeCompare(b.title, 'zh-Hant');
            });
        }

        function renderCurrentView() {
            const hasSearch = globalQuery.trim().length > 0;

            if (activeDocId) {
                document.getElementById('homeFolderView').classList.add('hidden');

                document.getElementById('folderHeaderBar').classList.add('hidden');
                document.getElementById('searchResultBar').classList.remove('hidden');

                document.getElementById('folderHeaderBar').classList.remove('hidden');

                document.getElementById('activeFolderTitle').textContent = folder.name;
                renderFilteredDocList(folder.id);

        function renderFolderGrid() {

        function buildMatchSnippet(doc, keywords) {
            if (!keywords || keywords.length === 0) return '';
            const paragraphs = doc.pages.flatMap(p => p.text.split(/\n{2,}/));
            let bestText = '';
            let maxHits = 0;

            for (const para of paragraphs) {
                const lower = para.toLowerCase();
                let hits = 0;
                for (const kw of keywords) {
                    if (lower.includes(kw.toLowerCase())) hits++;
                }
                if (hits > maxHits) {
                    maxHits = hits;
                    bestText = para;
                }
            }

            const targetText = bestText || doc.pages.map(p => p.text).join('\n');
            const lowerTarget = targetText.toLowerCase();
            let firstIdx = -1;
            for (const kw of keywords) {
                const idx = lowerTarget.indexOf(kw.toLowerCase());
                if (idx !== -1 && (firstIdx === -1 || idx < firstIdx)) firstIdx = idx;
            }
            if (firstIdx === -1) return '';

            const start = Math.max(0, firstIdx - 28);
            const end = Math.min(targetText.length, firstIdx + 95);
            const slice = (start > 0 ? '...' : '') + targetText.slice(start, end) + (end < targetText.length ? '...' : '');
            return highlightKeywords(slice, keywords);
        }

        function getFilteredDocuments(folderIdOrNull) {
            const keywords = parseKeywords(globalQuery);
            return documents.filter(doc => {
                if (folderIdOrNull && doc.folderId !== folderIdOrNull) return false;
                if (filterStarOnly && !doc.starred) return false;
                if (keywords.length === 0) return true;
                const folderName = getFolderNameById(doc.folderId);
                const haystack = (folderName + '\n' + doc.title + '\n' + doc.pages.map(p => p.text).join('\n')).toLowerCase();
                return keywords.every(kw => haystack.includes(kw.toLowerCase()));
            });
        }

        function renderFilteredDocList(folderIdOrNull) {

            container.innerHTML = '';

            if (filtered.length === 0) {

        /* =========================================================
           8. 閱讀頁（自動依「第X條」或段落切分、迷你複製鈕、文內定位）
           ========================================================= */
        function splitIntoArticles(pageText) {
            const lines = pageText.split('\n');
            const blocks = [];
            let current = [];
            const headerRegex = /^\s*第\s*[一二三四五六七八九十百千0-9]+\s*條(?:之[一二三四五六七八九十0-9]+)?/;

            for (const line of lines) {
                if (headerRegex.test(line) && current.length > 0) {
                    const joined = current.join('\n').trim();
                    if (joined) blocks.push(joined);
                    current = [line];
                } else {
                    current.push(line);
                }
            }
            if (current.length > 0) {
                const joined = current.join('\n').trim();
                if (joined) blocks.push(joined);
            }
            return blocks.length > 0 ? blocks : [pageText];
        }

            const checkSvg = `<svg width="16" height="16" style="width:16px;height:16px;flex-shrink:0;" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`;

            for (const page of doc.pages) {

                pageSec.className = 'page-section';

                if (doc.pages.length > 1) {
                    const div = document.createElement('div');

                for (const blockText of articles) {
                    const card = document.createElement('article');

                        <button type="button" class="article-copy-btn" title="複製此段" aria-label="複製此段">${copySvg}</button>

            readerMatches = Array.from(container.querySelectorAll('mark.hl-match'));
            if (keywords.length > 0) {

                    document.getElementById('fabMatchCounter').textContent = '第 0 / 0 筆';
                }
            } else {
                currentMatchIdx = -1;
            }
            syncFabUIWithMode();
        }

        function highlightActiveMatch(index, shouldScroll = true) {
            if (readerMatches.length === 0) return;
            const total = readerMatches.length;
            currentMatchIdx = ((index % total) + total) % total;

            readerMatches.forEach((el, idx) => {
                el.classList.toggle('active-match', idx === currentMatchIdx);
            });

            document.getElementById('fabMatchCounter').textContent = `第 ${currentMatchIdx + 1} / ${total} 筆`;

            if (shouldScroll) {
                readerMatches[currentMatchIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        /* =========================================================
           9. 全站通用可自由拖曳懸浮球與懸浮搜尋窗（嚴格區分輕點 <=6px 與拖曳 >6px）
           ========================================================= */
        function clampPosition(x, y, elWidth, elHeight) {
            const margin = 8;
            const maxX = Math.max(margin, window.innerWidth - elWidth - margin);
            const maxY = Math.max(margin, window.innerHeight - elHeight - margin);
            return {
                x: Math.min(Math.max(margin, x), maxX),
                y: Math.min(Math.max(margin, y), maxY)
            };
        }

        function positionPopoverNearFab() {
            const fab = document.getElementById('fabCircleBtn');
            const pop = document.getElementById('fabPopover');
            if (pop.classList.contains('hidden')) return;

            const fabRect = fab.getBoundingClientRect();
            const popRect = pop.getBoundingClientRect();
            const popW = popRect.width || 288;
            const popH = popRect.height || 120;

            let targetX = fabRect.right - popW;
            if (targetX < 12) targetX = fabRect.left;

            let targetY = fabRect.top - popH - 10;
            if (targetY < 56) {
                targetY = fabRect.bottom + 10;
            }

            const clamped = clampPosition(targetX, targetY, popW, popH);
            pop.style.left = `${clamped.x}px`;
            pop.style.top = `${clamped.y}px`;
        }

        function toggleFabPopover(open) {
            const pop = document.getElementById('fabPopover');
            if (open) {
                syncFabUIWithMode();
                pop.classList.remove('hidden');
                positionPopoverNearFab();
                setTimeout(() => document.getElementById('fabSearchInput').focus(), 40);
            } else {
                pop.classList.add('hidden');
            }
        }

        function initDraggableFloatingControls() {
            const fab = document.getElementById('fabCircleBtn');
            const pop = document.getElementById('fabPopover');
            const popHandle = document.getElementById('fabDragHandle');

            // 還原上次儲存的懸浮球位置（預設為右下側 right:16px, bottom:105px）
            loadPreference('fab_pos', null).then((savedPos) => {
                if (savedPos && typeof savedPos.x === 'number' && typeof savedPos.y === 'number') {
                    const c = clampPosition(savedPos.x, savedPos.y, 48, 48);
                    fab.style.right = 'auto';
                    fab.style.bottom = 'auto';
                    fab.style.left = `${c.x}px`;
                    fab.style.top = `${c.y}px`;
                }
            });

            // 1. 懸浮球拖曳與輕點分離邏輯（絕不在 start 時呼叫 preventDefault，確保點擊100%暢通）
            let isPointerDown = false;
            let isDragging = false;
            let startX = 0;
            let startY = 0;
            let startLeft = 0;
            let startTop = 0;
            const DRAG_THRESHOLD = 6;

            const handlePointerStart = (clientX, clientY) => {
                const rect = fab.getBoundingClientRect();
                isPointerDown = true;
                isDragging = false;
                startX = clientX;
                startY = clientY;
                startLeft = rect.left;
                startTop = rect.top;
            };

            const handlePointerMove = (clientX, clientY, e) => {
                if (!isPointerDown) return;
                const dx = clientX - startX;
                const dy = clientY - startY;

                if (!isDragging && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)) {
                    isDragging = true;
                }

                if (isDragging) {
                    if (e && e.cancelable) e.preventDefault();
                    const c = clampPosition(startLeft + dx, startTop + dy, 48, 48);
                    fab.style.right = 'auto';
                    fab.style.bottom = 'auto';
                    fab.style.left = `${c.x}px`;
                    fab.style.top = `${c.y}px`;
                    if (!pop.classList.contains('hidden')) {
                        positionPopoverNearFab();
                    }
                }
            };

            const handlePointerEnd = () => {
                if (!isPointerDown) return;
                isPointerDown = false;
                if (isDragging) {
                    isDragging = false;
                    const rect = fab.getBoundingClientRect();
                    savePreference('fab_pos', { x: rect.left, y: rect.top });
                } else {
                    // 移動距離 <= 6px 判定為有效點擊：開關懸浮搜尋窗
                    const isHidden = pop.classList.contains('hidden');
                    toggleFabPopover(isHidden);
                }
            };

            fab.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    handlePointerStart(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (isPointerDown && e.touches.length === 1) {
                    handlePointerMove(e.touches[0].clientX, e.touches[0].clientY, e);
                }
            }, { passive: false });

            window.addEventListener('touchend', () => {
                if (isPointerDown) handlePointerEnd();
            });

            fab.addEventListener('mousedown', (e) => {
                if (e.button === 0) {
                    handlePointerStart(e.clientX, e.clientY);
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (isPointerDown) {
                    handlePointerMove(e.clientX, e.clientY, e);
                }
            });

            window.addEventListener('mouseup', () => {
                if (isPointerDown) handlePointerEnd();
            });

            // 2. 展開後的懸浮搜尋視窗拖曳手把
            let popDragging = false;
            let popStartX = 0;
            let popStartY = 0;
            let popOrigLeft = 0;
            let popOrigTop = 0;

            const onPopStart = (clientX, clientY) => {
                const rect = pop.getBoundingClientRect();
                popDragging = true;
                popStartX = clientX;
                popStartY = clientY;
                popOrigLeft = rect.left;
                popOrigTop = rect.top;
            };

            const onPopMove = (clientX, clientY, e) => {
                if (!popDragging) return;
                const dx = clientX - popStartX;
                const dy = clientY - popStartY;
                if (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD) {
                    if (e && e.cancelable) e.preventDefault();
                    const rect = pop.getBoundingClientRect();
                    const c = clampPosition(popOrigLeft + dx, popOrigTop + dy, rect.width, rect.height);
                    pop.style.left = `${c.x}px`;
                    pop.style.top = `${c.y}px`;
                }
            };

            popHandle.addEventListener('touchstart', (e) => {
                if (e.target.closest('#fabCloseBtn')) return;
                if (e.touches.length === 1) {
                    onPopStart(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (popDragging && e.touches.length === 1) {
                    onPopMove(e.touches[0].clientX, e.touches[0].clientY, e);
                }
            }, { passive: false });

            window.addEventListener('touchend', () => {
                popDragging = false;
            });

            popHandle.addEventListener('mousedown', (e) => {
                if (e.target.closest('#fabCloseBtn')) return;
                if (e.button === 0) {
                    onPopStart(e.clientX, e.clientY);
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (popDragging) {
                    onPopMove(e.clientX, e.clientY, e);
                }
            });

            window.addEventListener('mouseup', () => {
                popDragging = false;
            });

            // 視窗旋轉或尺寸改變時自動將懸浮球與浮窗貼齊安全範圍
            window.addEventListener('resize', () => {
                const rect = fab.getBoundingClientRect();
                const c = clampPosition(rect.left, rect.top, 48, 48);
                fab.style.right = 'auto';
                fab.style.bottom = 'auto';
                fab.style.left = `${c.x}px`;
                fab.style.top = `${c.y}px`;
                if (!pop.classList.contains('hidden')) {
                    positionPopoverNearFab();
                }
            });
        }

        function openReaderView(docId, initialQuery = '') {
            const doc = documents.find(d => d.id === docId);
            if (!doc) return;

            activeDocId = docId;
            isEditingDocText = false;
            readerQuery = initialQuery || '';

            document.getElementById('readerDocTitle').textContent = doc.title;
            document.getElementById('readerDocMetaText').textContent = `共 ${doc.pages.length} 頁・更新日期：${doc.updatedAt}`;
            document.getElementById('readerOcrBadge').classList.toggle('hidden', !doc.isOcr);
            document.getElementById('readerUpdatedBadge').classList.toggle('hidden', !doc.isRecentlyUpdated);
            updateReaderStarBtn(doc.starred);

            const folderSelect = document.getElementById('readerFolderSelect');
            folderSelect.innerHTML = buildFolderOptionsHtml(doc.folderId);

            renderCurrentView();
            renderReaderContent(doc, readerQuery);

            if (readerQuery.trim().length > 0) {
                toggleFabPopover(true);
            } else {
                toggleFabPopover(false);
            }

            if (readerMatches.length > 0) {
                highlightActiveMatch(0, true);
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function closeReaderView() {
            activeDocId = null;
            isEditingDocText = false;
            renderCurrentView();
            if (!document.getElementById('fabPopover').classList.contains('hidden')) {
                positionPopoverNearFab();
            }
        }

        /* =========================================================
           10. JSON 備份匯出與還原匯入（純文字超輕量化）
           ========================================================= */
        function exportJsonBackup() {
            const payload = {
                exportedAt: new Date().toISOString(),
                folders,
                documents
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const dateTag = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            a.href = url;
            a.download = `法規公文備份_${dateTag}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('已匯出純文字備份檔', 'success');
        }

        async function importJsonBackup(file) {
            if (!file) return;
            try {
                const text = await file.text();
                const parsed = JSON.parse(text);

                if (Array.isArray(parsed.folders)) {
                    for (const f of parsed.folders) {
                        if (f && f.id && f.name) {
                            if (!folders.some(existing => existing.id === f.id)) {
                                folders.push(f);
                            }
                            await dbPut(STORE_FOLDERS, f);
                        }
                    }
                }

                const docList = Array.isArray(parsed.documents)
                    ? parsed.documents
                    : (Array.isArray(parsed.regulations) ? parsed.regulations : []);

                let count = 0;
                for (const item of docList) {
                    if (item && item.title && Array.isArray(item.pages)) {
                        const targetFid = (item.folderId && folders.some(f => f.id === item.folderId))
                            ? item.folderId
                            : UNCATEGORIZED_FOLDER_ID;

                        const cleanPages = item.pages.map((p, idx) => ({
                            pageNumber: p.pageNumber || (idx + 1),
                            text: p.text || ''
                        }));

                        const doc = {
                            id: item.id || ('doc-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7)),
                            folderId: targetFid,
                            title: String(item.title),
                            coreName: item.coreName || extractCoreName(String(item.title)),
                            isOcr: Boolean(item.isOcr || item.docType === 'image'),
                            starred: Boolean(item.starred),
                            updatedAt: item.updatedAt || item.uploadedAt || new Date().toLocaleDateString('zh-TW'),
                            isRecentlyUpdated: Boolean(item.isRecentlyUpdated),
                            pages: cleanPages
                        };

                        const idx = documents.findIndex(d => d.id === doc.id);
                        if (idx !== -1) documents[idx] = doc;
                        else documents.push(doc);
                        await dbPut(STORE_DOCS, doc);
                        count++;
                    }
                }
                sortDocuments();
                renderCurrentView();
                showToast(`已成功還原 ${count} 份文件`, 'success');
            } catch (e) {
                showToast('備份檔案格式不正確', 'error');
            }
        }

        /* =========================================================
           11. 應用程式初始化與所有事件綁定（確保零阻塞、100% 接通）
           ========================================================= */
        async function initApp() {
            const savedFont = await loadPreference('font_scale', 'large');
            applyFontScale(savedFont);

            // 初始化資料夾（確保「未分類 / 一般法規」永遠存在於首位）
            const storedFolders = await dbGetAll(STORE_FOLDERS);
            if (storedFolders.length > 0) {
                folders = storedFolders;
                if (!folders.some(f => f.id === UNCATEGORIZED_FOLDER_ID)) {
                    const uncat = DEFAULT_FOLDERS[0];
                    folders.unshift(uncat);
                    await dbPut(STORE_FOLDERS, uncat);
                }
            } else {
                folders = [...DEFAULT_FOLDERS];
                for (const f of folders) {
                    await dbPut(STORE_FOLDERS, f);
                }
            }

            // 初始化文件庫（首次無資料時建立 1 份範例法規）
            const storedDocs = await dbGetAll(STORE_DOCS);
            if (storedDocs.length > 0) {
                documents = storedDocs.map(d => ({
                    ...d,
                    folderId: (d.folderId && folders.some(f => f.id === d.folderId)) ? d.folderId : UNCATEGORIZED_FOLDER_ID
                }));
            } else {
                documents = [...SAMPLE_DOCS];
                for (const d of documents) {
                    await dbPut(STORE_DOCS, d);
                }
            }
            sortDocuments();
            renderCurrentView();
            initDraggableFloatingControls();

            // 頂部標題點擊回到封面
            document.getElementById('brandHomeBtn').addEventListener('click', () => {
                activeDocId = null;
                activeFolderId = null;
                globalQuery = '';
                filterStarOnly = false;
                renderCurrentView();
            });

            // 搜尋結果列一鍵清除篩選
            document.getElementById('resetGlobalFilterBtn').addEventListener('click', () => {
                globalQuery = '';
                filterStarOnly = false;
                renderCurrentView();
                toggleFabPopover(false);
            });

            // 字級切換（標準 / 放大 / 特大）
            document.querySelectorAll('.font-pill-btn').forEach(btn => {
                btn.addEventListener('click', () => applyFontScale(btn.getAttribute('data-font-btn')));
            });

            // 匯出與匯入備份
            document.getElementById('exportBackupBtn').addEventListener('click', exportJsonBackup);
            document.getElementById('importBackupInput').addEventListener('change', async (e) => {
                if (e.target.files && e.target.files[0]) {
                    await importJsonBackup(e.target.files[0]);
                }
                e.target.value = '';
            });

            // 封面「+ 新增資料夾」按鈕
            document.getElementById('openNewFolderModalBtn').addEventListener('click', async () => {
                const name = await openFolderInputModal('新增資料夾', '請輸入新的分類資料夾名稱：');
                if (name) {
                    const newFolder = {
                        id: 'folder-' + Date.now(),
                        name,
                        kind: name.includes('公文') ? 'official' : 'normal'
                    };
                    folders.push(newFolder);
                    await dbPut(STORE_FOLDERS, newFolder);
                    renderCurrentView();
                    showToast(`已建立資料夾「${name}」`, 'success');
                }
            });

            // 封面「直接上傳」按鈕（自動歸入「未分類 / 一般法規」）
            document.getElementById('coverBatchFileInput').addEventListener('change', async (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    await processBatchFiles(e.target.files, UNCATEGORIZED_FOLDER_ID);
                    activeFolderId = UNCATEGORIZED_FOLDER_ID;
                    renderCurrentView();
                }
                e.target.value = '';
            });

            // 資料夾內返回封面與批次上傳
            document.getElementById('backToFoldersBtn').addEventListener('click', () => {
                activeFolderId = null;
                renderCurrentView();
            });

            document.getElementById('batchFileInput').addEventListener('change', async (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    await processBatchFiles(e.target.files, activeFolderId || UNCATEGORIZED_FOLDER_ID);
                }
                e.target.value = '';
            });

            // 閱讀模式純圖示單排工具列事件
            document.getElementById('backFromReaderBtn').addEventListener('click', closeReaderView);

            document.getElementById('readerFolderSelect').addEventListener('change', async (e) => {
                const doc = documents.find(d => d.id === activeDocId);
                if (!doc) return;
                doc.folderId = e.target.value;
                activeFolderId = doc.folderId;
                await dbPut(STORE_DOCS, doc);
                showToast(`已移動至「${getFolderNameById(doc.folderId)}」`, 'success');
            });

            document.getElementById('readerStarBtn').addEventListener('click', async () => {
                const doc = documents.find(d => d.id === activeDocId);
                if (!doc) return;
                doc.starred = !doc.starred;
                await dbPut(STORE_DOCS, doc);
                updateReaderStarBtn(doc.starred);
                showToast(doc.starred ? '已加入星號收藏 ★' : '已取消星號收藏');
            });

            document.getElementById('copyFullDocBtn').addEventListener('click', async () => {
                const doc = documents.find(d => d.id === activeDocId);
                if (!doc) return;
                const fullText = `${doc.title}\n\n` + doc.pages.map(p => p.text).join('\n\n');
                const ok = await copyToClipboard(fullText);
                if (ok) {
                    const btn = document.getElementById('copyFullDocBtn');
                    const icon = document.getElementById('copyFullDocIcon');
                    btn.classList.remove('primary');
                    btn.classList.add('success-solid');
                    icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>';
                    showToast('已複製全文', 'success');
                    setTimeout(() => {
                        btn.classList.remove('success-solid');
                        btn.classList.add('primary');
                        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>';
                    }, 1800);
                }
            });

            document.getElementById('toggleEditDocBtn').addEventListener('click', () => {
                const doc = documents.find(d => d.id === activeDocId);
                if (!doc) return;
                isEditingDocText = !isEditingDocText;
                renderReaderContent(doc, readerQuery);
            });

            document.getElementById('singleUpdateInput').addEventListener('change', async (e) => {
                const doc = documents.find(d => d.id === activeDocId);
                if (doc && e.target.files && e.target.files[0]) {
                    await processBatchFiles([e.target.files[0]], doc.folderId, doc.id);
                }
                e.target.value = '';
            });

            document.getElementById('readerDeleteBtn').addEventListener('click', async () => {
                const doc = documents.find(d => d.id === activeDocId);
                if (!doc) return;
                const ok = await showConfirmModal(
                    '整份刪除此法規',
                    `確定要刪除《${doc.title}》嗎？刪除後無法復原。`,
                    '確定刪除',
                    true
                );
                if (ok) {
                    await dbDelete(STORE_DOCS, doc.id);
                    documents = documents.filter(d => d.id !== doc.id);
                    showToast('已整份刪除此文件');
                    closeReaderView();
                }
            });

            // 全站懸浮搜尋視窗事件
            document.getElementById('fabCloseBtn').addEventListener('click', () => {
                toggleFabPopover(false);
            });

            const fabInput = document.getElementById('fabSearchInput');
            fabInput.addEventListener('input', () => {
                if (activeDocId) {
                    readerQuery = fabInput.value;
                    const doc = documents.find(d => d.id === activeDocId);
                    if (doc) {
                        renderReaderContent(doc, readerQuery);
                        if (readerMatches.length > 0) highlightActiveMatch(0, true);
                    }
                } else {
                    globalQuery = fabInput.value;
                    renderCurrentView();
                    positionPopoverNearFab();
                }
            });

            document.getElementById('fabClearBtn').addEventListener('click', () => {
                fabInput.value = '';
                if (activeDocId) {
                    readerQuery = '';
                    const doc = documents.find(d => d.id === activeDocId);
                    if (doc) renderReaderContent(doc, '');
                } else {
                    globalQuery = '';
                    renderCurrentView();
                    positionPopoverNearFab();
                }
                fabInput.focus();
            });

            document.getElementById('fabStarToggleBtn').addEventListener('click', async () => {
                if (activeDocId) {
                    const doc = documents.find(d => d.id === activeDocId);
                    if (!doc) return;
                    doc.starred = !doc.starred;
                    await dbPut(STORE_DOCS, doc);
                    updateReaderStarBtn(doc.starred);
                    showToast(doc.starred ? '已加入星號收藏 ★' : '已取消星號收藏');
                } else {
                    filterStarOnly = !filterStarOnly;
                    renderCurrentView();
                    positionPopoverNearFab();
                }
            });

            document.getElementById('fabPrevBtn').addEventListener('click', () => {
                highlightActiveMatch(currentMatchIdx - 1, true);
            });

            document.getElementById('fabNextBtn').addEventListener('click', () => {
                highlightActiveMatch(currentMatchIdx + 1, true);
            });

            // 背景預載外部 PDF/OCR 解析器（完全不阻塞畫面互動）
            ensurePdfJsLoaded();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
