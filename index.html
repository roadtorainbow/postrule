        /* ---------- 整份規章合併成連續文章（隱藏頁碼、每頁頁首頁尾雜訊、跨頁條文接回） ---------- */
        const HEAD_EXCLUDE_RE = /^(第\s*[一二三四五六七八九十百千0-9]+\s*[編章節款目條]|[一二三四五六七八九十]+、|（[一二三四五六七八九十0-9]+）|\([一二三四五六七八九十0-9]+\)|[0-9]+[、.．]|[①②③④⑤⑥⑦⑧⑨⑩]|附\s*則|總\s*則|說\s*明|主\s*旨|依\s*據|公告事項|辦\s*法)/;
        const PRINTED_RE = /^[-－—–]\s*(\d{1,4})\s*[-－—–]$/;
        const CONT_START_RE = /^(第|[一二三四五六七八九十]+、|（|\(|[0-9]+[、.．]|[①②③④⑤⑥⑦⑧⑨⑩])/;
        const docUnitsCache = new Map();

        function docSignature(doc) {
            let n = 0;
            for (const p of doc.pages) n += (p.text || '').length;
            return doc.id + '|' + doc.pages.length + '|' + n;
        }

        function buildDocUnits(doc) {
            const sig = docSignature(doc);
            if (docUnitsCache.has(sig)) return docUnitsCache.get(sig);

            const prepared = doc.pages.map(p => ({
                page: p,
                lines: normalizeExtractedText(p.text).replace(/\r\n/g, '\n').split('\n').map(l => l.trim()).filter(Boolean)
            }));

            const noise = new Set();
            const hasExact = doc.pages.some(p => p.exact);
            if (!hasExact && prepared.length >= 4) {
                const counts = new Map();
                for (const pp of prepared) {
                    const edge = new Set();
                    pp.lines.slice(0, 3).concat(pp.lines.slice(-3)).forEach(l => {
                        if (l.length >= 4 && !HEAD_EXCLUDE_RE.test(l) && !PRINTED_RE.test(l)) edge.add(l.replace(/\s+/g, ''));
                    });
                    edge.forEach(k => counts.set(k, (counts.get(k) || 0) + 1));
                }
                const th = Math.max(3, Math.ceil(prepared.length * 0.25));
                counts.forEach((c, k) => { if (c >= th) noise.add(k); });
            }

            const units = [];
            let pendPages = [];
            let pendPrinted = [];

            prepared.forEach((pp, i) => {
                const page = pp.page;
                pendPages.push(page.pageNumber || (i + 1));
                if (Array.isArray(page.printedList)) pendPrinted.push(...page.printedList);
                const edge = pp.lines.slice(0, 3).concat(pp.lines.slice(-3));
                for (const l of edge) {
                    const m = l.match(PRINTED_RE);
                    if (m) { pendPrinted.push(Number(m[1])); break; }
                }

                const kept = pp.lines.filter(l => !noise.has(l.replace(/\s+/g, '')) && !PRINTED_RE.test(l));
                const cleaned = kept.join('\n');
                if (!cleaned.trim()) return;

                const pu = parsePageUnits(cleaned);
                pu.forEach((u0, k) => {
                    const u = { ...u0, pages: [], printed: [] };
                    const prev = units[units.length - 1];

                    if (k === 0 && !page.exact && prev && u.type === 'clause' && prev.type === 'clause') {
                        let merged = false;
                        if (u.isToc && prev.isToc) {
                            prev.text += '\n' + u.text;
                            merged = true;
                        } else if (!u.isToc && !prev.isToc) {
                            const firstLine = u.text.split('\n')[0].trim();
                            if (!ARTICLE_HEADER_REGEX.test(firstLine)) {
                                const sep = endsSentence(prev.text.slice(prev.text.lastIndexOf('\n') + 1)) ? '\n' : '';
                                prev.text += sep + u.text;
                                merged = true;
                            }
                        }
                        if (merged) {
                            prev.pages.push(...pendPages);
                            prev.printed.push(...pendPrinted);
                            pendPages = [];
                            pendPrinted = [];
                            return;
                        }
                    }

                    u.pages = pendPages;
                    u.printed = pendPrinted;
                    pendPages = [];
                    pendPrinted = [];
                    units.push(u);
                });
            });

            if (units.length === 0) units.push({ type: 'clause', text: '', pages: [], printed: [] });
            if (docUnitsCache.size > 12) docUnitsCache.clear();
            docUnitsCache.set(sig, units);
            return units;
        }

        function docPageCount(doc) {
            return doc.pageCount || doc.pages.length;
        }

        function stripWs(s) {
            return String(s || '').replace(/\s+/g, '');
        }

        /* 點目錄條目 → 跳到對應位置 */
        function jumpFromToc(title, pageNo) {
            const container = document.getElementById('readerContentContainer');
            const key = stripWs(title);
            const targets = Array.from(container.querySelectorAll('[data-body="1"]'));
            let startIdx = targets.findIndex(el => (' ' + el.dataset.printed + ' ').includes(' ' + pageNo + ' '));
            if (startIdx === -1) {
                startIdx = targets.findIndex(el => (' ' + el.dataset.pages + ' ').includes(' ' + pageNo + ' '));
            }

            const matchTitle = (el) => {
                const t = stripWs(el.classList.contains('chapter-banner') ? el.textContent : (el.querySelector('.clause-article-heading') || {}).textContent);
                return t && (t === key || (key.startsWith(t) && t.length >= 3));
            };

            let found = null;
            if (startIdx !== -1) {
                for (let i = startIdx; i < Math.min(targets.length, startIdx + 40); i++) {
                    if (matchTitle(targets[i])) { found = targets[i]; break; }
                }
                if (!found) found = targets[startIdx];
            } else {
                found = targets.find(matchTitle) || null;
            }

            if (!found) {
                showToast('找不到對應位置');
                return;
            }
            found.scrollIntoView({ behavior: 'smooth', block: 'start' });
            found.classList.remove('jump-flash');
            void found.offsetWidth;
            found.classList.add('jump-flash');
        }

        function renderReaderContent(doc, searchStr) {
            const container = document.getElementById('readerContentContainer');
            container.innerHTML = '';
            const keywords = parseKeywords(searchStr);
            const units = buildDocUnits(doc);

            if (isEditingDocText) {
                const items = [];
                const wrap = document.createElement('div');
                wrap.className = 'page-section';
                units.forEach((u, idx) => {
                    const card = document.createElement('div');
                    card.className = 'article-card';
                    const ta = document.createElement('textarea');
                    ta.className = 'inline-edit-textarea';
                    ta.value = u.text;
                    ta.rows = Math.min(14, Math.max(2, u.text.split('\n').length + 1));
                    card.appendChild(ta);
                    wrap.appendChild(card);
                    items.push({ u, ta });
                });
                container.appendChild(wrap);

                const actionBar = document.createElement('div');
                actionBar.className = 'inline-edit-actions';
                actionBar.innerHTML = `
                    <button type="button" id="cancelEditDocBtn" class="modal-btn cancel">取消</button>
                    <button type="button" id="saveEditDocBtn" class="modal-btn confirm-primary">儲存修改</button>
                `;
                container.appendChild(actionBar);

                document.getElementById('cancelEditDocBtn').addEventListener('click', () => {
                    isEditingDocText = false;
                    renderReaderContent(doc, readerQuery);
                });

                document.getElementById('saveEditDocBtn').addEventListener('click', async () => {
                    const origCount = docPageCount(doc);
                    const newPages = [];
                    items.forEach(({ u, ta }) => {
                        const txt = ta.value.trim();
                        if (!txt) return;
                        newPages.push({
                            pageNumber: newPages.length + 1,
                            text: txt,
                            exact: true,
                            printedList: u.printed || [],
                            srcPages: u.pages || []
                        });
                    });
                    if (newPages.length === 0) {
                        showToast('內容不能全部清空', 'error');
                        return;
                    }
                    doc.pages = newPages;
                    doc.pageCount = origCount;
                    doc.updatedAt = new Date().toLocaleDateString('zh-TW');
                    doc.isRecentlyUpdated = true;
                    await dbPut(STORE_DOCS, doc);
                    sortDocuments();
                    isEditingDocText = false;
                    document.getElementById('readerDocMetaText').textContent = `共 ${docPageCount(doc)} 頁・更新日期：${doc.updatedAt}`;
                    document.getElementById('readerUpdatedBadge').classList.remove('hidden');
                    renderReaderContent(doc, readerQuery);
                    showToast('已儲存校正後的內文', 'success');
                });
                return;
            }

            const flow = document.createElement('div');
            flow.className = 'page-section';

            for (const u of units) {
                if (!u.text) continue;
                const dataAttrs = (el) => {
                    el.setAttribute('data-body', '1');
                    el.dataset.pages = (u.pages || []).join(' ');
                    el.dataset.printed = (u.printed || []).join(' ');
                };

                if (u.type === 'chapter') {
                    const banner = document.createElement('div');
                    banner.className = 'chapter-banner' + (u.level === 'minor' ? ' sub-section' : '');
                    banner.innerHTML = highlightKeywords(u.text, keywords);
                    dataAttrs(banner);
                    flow.appendChild(banner);
                    continue;
                }

                const blockText = u.text;
                const card = document.createElement('article');
                card.className = 'article-card';
                dataAttrs(card);
                card.innerHTML = `
                    <div class="article-card-actions">
                        <button type="button" class="article-mini-btn copy-btn" title="複製此段" aria-label="複製此段">${svgIcon('copy', 16)}</button>
                    </div>
                    <div class="clause-structured-body">${renderStructuredClauseHtml(blockText, keywords)}</div>
                `;

                const copyBtn = card.querySelector('.copy-btn');
                copyBtn.addEventListener('click', async () => {
                    const ok = await copyToClipboard(blockText);
                    if (ok) {
                        copyBtn.innerHTML = svgIcon('check', 16);
                        copyBtn.classList.add('copied');
                        showToast('已複製此段文字', 'success');
                        setTimeout(() => {
                            copyBtn.innerHTML = svgIcon('copy', 16);
                            copyBtn.classList.remove('copied');
                        }, 1600);
                    }
                });

                card.querySelectorAll('.toc-line[data-toc-page]').forEach(row => {
                    row.addEventListener('click', () => jumpFromToc(row.dataset.tocTitle, Number(row.dataset.tocPage)));
                });

                flow.appendChild(card);
            }
            container.appendChild(flow);

            readerMatches = Array.from(container.querySelectorAll('mark.hl-match'));
            if (keywords.length > 0) {
                if (readerMatches.length > 0) {
                    currentMatchIdx = 0;
                    highlightActiveMatch(0, false);
                } else {
                    currentMatchIdx = -1;
                    document.getElementById('dockMatchCounter').textContent = '0/0';
                }
            } else {
                currentMatchIdx = -1;
            }
            syncBottomDockWithMode();
        }

        function highlightActiveMatch(index, shouldScroll = true) {
            if (readerMatches.length === 0) return;
            const total = readerMatches.length;
            currentMatchIdx = ((index % total) + total) % total;

            readerMatches.forEach((el, idx) => {
                el.classList.toggle('active-match', idx === currentMatchIdx);
            });

            document.getElementById('dockMatchCounter').textContent = `${currentMatchIdx + 1}/${total}`;

            if (shouldScroll) {
                readerMatches[currentMatchIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function renderReaderPage(docId, initialQuery = '') {
            const doc = documents.find(d => d.id === docId);
            if (!doc) return;

            activeDocId = docId;
            isEditingDocText = false;
            readerQuery = initialQuery || '';

            document.getElementById('readerDocTitle').textContent = cleanDisplayTitle(doc.title);
            document.getElementById('readerDocMetaText').textContent = `共 ${docPageCount(doc)} 頁・更新日期：${doc.updatedAt}`;
            document.getElementById('readerOcrBadge').classList.toggle('hidden', !doc.isOcr);
            document.getElementById('readerUpdatedBadge').classList.toggle('hidden', !doc.isRecentlyUpdated);
            document.getElementById('readerMenuPanel').classList.add('hidden');
            document.getElementById('readerCategorySelect').innerHTML = buildCategoryOptionsHtml(doc);
            updateReaderStarBtn(doc);
            updateReaderCrumb(doc);

            renderCurrentView();
            renderReaderContent(doc, readerQuery);

            if (readerMatches.length > 0) {
                highlightActiveMatch(0, true);
            } else {
                window.scrollTo({ top: 0 });
            }
        }

        function openReaderView(docId, initialQuery = '') {
            activeDocId = docId;
            pushNavigationState();
            renderReaderPage(docId, initialQuery);
        }

        function closeReaderView() {
            if (window.history.state && window.history.state.activeDocId) {
                window.history.back();
            } else {
                activeDocId = null;
                isEditingDocText = false;
                renderCurrentView();
            }
        }

        /* =========================================================
           13. 備份檔匯出／匯入（格式向下相容）
           ========================================================= */
        function exportJsonBackup() {
            const payload = {
                exportedAt: new Date().toISOString(),
                version: 2,
                folders,
                documents
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const dateTag = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            a.href = url;
            a.download = `法規公文備份_${dateTag}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('已匯出備份檔', 'success');
        }

        async function importJsonBackup(file) {
            if (!file) return;
            try {
                const text = await file.text();
                const parsed = JSON.parse(text);

                if (Array.isArray(parsed.folders)) {
                    for (const f of parsed.folders) {
                        if (f && f.id && f.name && f.id !== UNCATEGORIZED_FOLDER_ID) {
                            const existing = folders.find(x => x.id === f.id);
                            if (!existing) {
                                const nf = normalizeFolder(f);
                                folders.push(nf);
                                await dbPut(STORE_FOLDERS, nf);
                            }
                        }
                    }
                }

                const docList = Array.isArray(parsed.documents)
                    ? parsed.documents
                    : (Array.isArray(parsed.regulations) ? parsed.regulations : []);

                let count = 0;
                for (const item of docList) {
                    if (item && item.title && Array.isArray(item.pages)) {
                        const cleanPages = item.pages.map((p, idx) => ({
                            pageNumber: p.pageNumber || (idx + 1),
                            text: p.text || '',
                            ...(p.exact ? { exact: true, printedList: p.printedList || [], srcPages: p.srcPages || [] } : {})
                        }));
                        const cleanedTitle = cleanDisplayTitle(String(item.title));
                        const doc = normalizeDoc({
                            id: item.id || ('doc-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7)),
                            folderId: item.folderId,
                            domain: item.domain,
                            title: cleanedTitle,
                            coreName: item.coreName || extractCoreName(cleanedTitle),
                            isOcr: Boolean(item.isOcr || item.docType === 'image'),
                            starred: item.starred,
                            updatedAt: item.updatedAt || item.uploadedAt || new Date().toLocaleDateString('zh-TW'),
                            isRecentlyUpdated: Boolean(item.isRecentlyUpdated),
                            ...(item.pageCount ? { pageCount: item.pageCount } : {}),
                            ...(typeof item.favOrder === 'number' ? { favOrder: item.favOrder } : {}),
                            pages: cleanPages
                        });

                        const idx = documents.findIndex(d => d.id === doc.id);
                        if (idx !== -1) documents[idx] = doc;
                        else documents.push(doc);
                        await dbPut(STORE_DOCS, doc);
                        count++;
                    }
                }
                sortDocuments();
                renderCurrentView();
                showToast(`已成功還原 ${count} 份文件`, 'success');
            } catch (e) {
                showToast('備份檔案格式不正確', 'error');
            }
        }

        /* =========================================================
           14. 還原點（整體法規一份，儲匯與郵務一起存）
           ========================================================= */
        const RESTORE_KEY = 'restore_point';

        async function dbClearStore(storeName) {
            if (!idbAvailable) return;
            const db = await openDB();
            await new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                tx.objectStore(storeName).clear();
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function getRestorePoint() {
            const snap = await loadPreference(RESTORE_KEY, null);
            if (snap && Array.isArray(snap.documents) && Array.isArray(snap.folders)) return snap;
            return null;
        }

        function formatSavedAt(iso) {
            try {
                return new Date(iso).toLocaleString('zh-TW', { hour12: false });
            } catch (e) {
                return String(iso || '');
            }
        }

        async function refreshRestoreInfo() {
            const snap = await getRestorePoint();
            document.getElementById('restoreInfo').textContent = snap
                ? `上次儲存：${formatSavedAt(snap.savedAt)}（${snap.documents.length} 份規章）`
                : '尚未儲存過還原點';
        }

        async function saveRestorePoint() {
            if (!idbAvailable) {
                showToast('這個瀏覽器無法儲存還原點，請改用匯出備份檔', 'error');
                return;
            }
            const prev = await getRestorePoint();
            if (prev) {
                const ok = await showConfirmModal(
                    '儲存還原點',
                    `會覆蓋上次儲存的還原點（${formatSavedAt(prev.savedAt)}）。`,
                    '覆蓋儲存',
                    false
                );
                if (!ok) return;
            }
            const snap = {
                savedAt: new Date().toISOString(),
                folders: JSON.parse(JSON.stringify(folders)),
                documents: JSON.parse(JSON.stringify(documents))
            };
            try {
                const db = await openDB();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_PREFS, 'readwrite');
                    tx.objectStore(STORE_PREFS).put({ key: RESTORE_KEY, value: snap });
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                    tx.onabort = () => reject(tx.error);
                });
                showToast(`已儲存還原點（${snap.documents.length} 份規章）`, 'success');
            } catch (e) {
                showToast('儲存還原點失敗（空間可能不足）', 'error');
            }
            await refreshRestoreInfo();
        }

        async function loadRestorePoint() {
            const snap = await getRestorePoint();
            if (!snap) {
                showToast('還沒有儲存過還原點');
                return;
            }
            const ok = await showConfirmModal(
                '還原到上次儲存',
                `還原到 ${formatSavedAt(snap.savedAt)}（${snap.documents.length} 份規章）。現在的內容會被取代，而且無法復原。`,
                '確定還原',
                true
            );
            if (!ok) return;

            setProgress(true, '還原中...', 30);
            try {
                await dbClearStore(STORE_DOCS);
                await dbClearStore(STORE_FOLDERS);
                folders = snap.folders
                    .filter(f => f && f.id && f.id !== UNCATEGORIZED_FOLDER_ID)
                    .map(normalizeFolder);
                documents = snap.documents.map(d => normalizeDoc(d));
                for (const f of folders) await dbPut(STORE_FOLDERS, f);
                for (const d of documents) await dbPut(STORE_DOCS, d);
                if (!idbAvailable) syncFallbackStorage();
            } catch (e) {
                setProgress(false);
                showToast('還原失敗', 'error');
                return;
            }
            setProgress(false);

            sortDocuments();
            activeDocId = null;
            activeFolderId = null;
            isFavPageActive = false;
            globalQuery = '';
            renderCurrentView();
            showToast('已還原到上次儲存的內容', 'success');
        }

        /* =========================================================
           15. 初始化與事件綁定
           ========================================================= */
        async function initApp() {
            hydrateIcons();
            await requestPersistentStorage();

            applyFontScale(await loadPreference('font_scale', 'large'));
            activeDomain = (await loadPreference('active_domain', 's')) === 'm' ? 'm' : 's';
            const migrated = await loadPreference('schema_v2', false);

            const storedFolders = await dbGetAll(STORE_FOLDERS);
            const storedDocs = await dbGetAll(STORE_DOCS);
            const isFresh = storedFolders.length === 0 && storedDocs.length === 0 && !migrated;

            if (isFresh) {
                folders = DEFAULT_FOLDERS.map(f => ({ ...f }));
                for (const f of folders) await dbPut(STORE_FOLDERS, f);
                documents = SAMPLE_DOCS.map(d => ({ ...d }));
                for (const d of documents) await dbPut(STORE_DOCS, d);
                await savePreference('schema_v2', true);
            } else {
                folders = storedFolders
                    .filter(f => f && f.id !== UNCATEGORIZED_FOLDER_ID)
                    .map(normalizeFolder);

                if (!migrated) {
                    await dbDelete(STORE_FOLDERS, UNCATEGORIZED_FOLDER_ID);
                    if (!folders.some(f => f.domain === 'm')) {
                        folders.push({ ...DEFAULT_FOLDERS[DEFAULT_FOLDERS.length - 1] });
                    }
                    for (const f of folders) await dbPut(STORE_FOLDERS, f);
                }

                documents = storedDocs.map(d => {
                    const nd = normalizeDoc({ ...d, title: cleanDisplayTitle(d.title) });
                    nd.coreName = extractCoreName(nd.title);
                    return nd;
                });

                if (!migrated) {
                    for (const d of documents) await dbPut(STORE_DOCS, d);
                    await savePreference('schema_v2', true);
                }
            }

            sortDocuments();
            initHistoryNavigation();
            renderCurrentView();
            refreshRestoreInfo();

            /* ----- 導覽 ----- */
            document.getElementById('brandHomeBtn').addEventListener('click', () => {
                activeDocId = null;
                activeFolderId = null;
                isFavPageActive = false;
                globalQuery = '';
                pushNavigationState();
                renderCurrentView();
                window.scrollTo({ top: 0 });
            });

            document.getElementById('favNavBtn').addEventListener('click', () => {
                if (isFavPageActive && !activeDocId) {
                    isFavPageActive = false;
                } else {
                    activeDocId = null;
                    activeFolderId = null;
                    isFavPageActive = true;
                    globalQuery = '';
                }
                pushNavigationState();
                renderCurrentView();
                window.scrollTo({ top: 0 });
            });

            document.getElementById('backFromFavBtn').addEventListener('click', () => {
                if (window.history.state && window.history.state.isFavPageActive) {
                    window.history.back();
                } else {
                    isFavPageActive = false;
                    renderCurrentView();
                }
            });

            document.getElementById('backFromFolderBtn').addEventListener('click', () => {
                if (window.history.state && window.history.state.activeFolderId) {
                    window.history.back();
                } else {
                    activeFolderId = null;
                    renderCurrentView();
                }
            });

            document.getElementById('resetSearchBtn').addEventListener('click', () => {
                globalQuery = '';
                renderCurrentView();
            });

            /* ----- 字級 ----- */
            document.querySelectorAll('.font-pill-btn').forEach(btn => {
                btn.addEventListener('click', () => applyFontScale(btn.getAttribute('data-font-btn')));
            });

            /* ----- 首頁選單：還原點、備份 ----- */
            const appMenuBtn = document.getElementById('appMenuBtn');
            const appMenuPanel = document.getElementById('appMenuPanel');
            const readerMenuBtn = document.getElementById('readerMenuBtn');
            const readerMenuPanel = document.getElementById('readerMenuPanel');
            const closeMenus = () => {
                appMenuPanel.classList.add('hidden');
                readerMenuPanel.classList.add('hidden');
            };

            appMenuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                readerMenuPanel.classList.add('hidden');
                appMenuPanel.classList.toggle('hidden');
                if (!appMenuPanel.classList.contains('hidden')) refreshRestoreInfo();
            });
            appMenuPanel.addEventListener('click', (e) => {
                e.stopPropagation();
                if (e.target.closest('.menu-item')) setTimeout(() => appMenuPanel.classList.add('hidden'), 250);
            });

            readerMenuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                appMenuPanel.classList.add('hidden');
                readerMenuPanel.classList.toggle('hidden');
            });
            readerMenuPanel.addEventListener('click', (e) => {
                e.stopPropagation();
                if (e.target.closest('.menu-item')) setTimeout(() => readerMenuPanel.classList.add('hidden'), 250);
            });
            document.addEventListener('click', closeMenus);

            document.getElementById('saveRestoreBtn').addEventListener('click', saveRestorePoint);
            document.getElementById('loadRestoreBtn').addEventListener('click', loadRestorePoint);
            document.getElementById('exportBackupBtn').addEventListener('click', exportJsonBackup);
            document.getElementById('importBackupInput').addEventListener('change', async (e) => {
                if (e.target.files && e.target.files[0]) {
                    await importJsonBackup(e.target.files[0]);
                }
                e.target.value = '';
            });

            /* ----- 首頁：資料夾與上傳 ----- */
            document.getElementById('newFolderBtn').addEventListener('click', async () => {
                const name = await openFolderInputModal('新增資料夾', `新增到「${DOMAIN_LABEL[activeDomain]}」：`);
                if (name) {
                    const newFolder = {
                        id: 'folder-' + Date.now(),
                        name,
                        kind: name.includes('公文') ? 'official' : 'normal',
                        domain: activeDomain
                    };
                    folders.push(newFolder);
                    await dbPut(STORE_FOLDERS, newFolder);
                    renderCurrentView();
                    showToast(`已建立資料夾「${name}」`, 'success');
                }
            });

            document.getElementById('homeUploadInput').addEventListener('change', async (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    await processBatchFiles(e.target.files, null, activeDomain);
                }
                e.target.value = '';
            });

            document.getElementById('folderUploadInput').addEventListener('change', async (e) => {
                if (e.target.files && e.target.files.length > 0 && activeFolderId) {
                    await processBatchFiles(e.target.files, activeFolderId, activeDomain);
                }
                e.target.value = '';
            });

            document.getElementById('deleteFolderBtn').addEventListener('click', async () => {
                const folder = getFolder(activeFolderId);
                if (!folder) return;
                const count = documents.filter(d => d.folderId === folder.id).length;
                const desc = count > 0
                    ? `確定要刪除資料夾「${folder.name}」嗎？裡面的 ${count} 份規章不會刪除，會變成「${DOMAIN_LABEL[folder.domain]}」的單一規章。`
                    : `確定要刪除空白資料夾「${folder.name}」嗎？`;
                const ok = await showConfirmModal('刪除資料夾', desc, '確定刪除', true);
                if (!ok) return;
                for (const d of documents) {
                    if (d.folderId === folder.id) {
                        d.folderId = null;
                        await dbPut(STORE_DOCS, d);
                    }
                }
                await dbDelete(STORE_FOLDERS, folder.id);
                folders = folders.filter(f => f.id !== folder.id);
                activeFolderId = null;
                if (window.history.state && window.history.state.activeFolderId) {
                    window.history.back();
                }
                renderCurrentView();
                showToast(count > 0 ? `已刪除資料夾，${count} 份規章變成單一規章` : `已刪除資料夾「${folder.name}」`);
            });

            /* ----- 閱讀頁 ----- */
            document.getElementById('backFromReaderBtn').addEventListener('click', closeReaderView);

            document.getElementById('readerStarBtn').addEventListener('click', async () => {
                const doc = documents.find(d => d.id === activeDocId);
                if (!doc) return;
                await toggleDocStar(doc);
                updateReaderStarBtn(doc);
            });

            document.getElementById('readerCategorySelect').addEventListener('change', async (e) => {
                const doc = documents.find(d => d.id === activeDocId);
                if (!doc) return;
                const parts = e.target.value.split('|');
                const dm = parts[0] === 'm' ? 'm' : 's';
                const fid = parts[1] || null;
                doc.domain = dm;
                doc.folderId = fid;
                await dbPut(STORE_DOCS, doc);
                updateReaderCrumb(doc);
                updateFavBadge();
                showToast(`已移到「${DOMAIN_LABEL[dm]}・${fid ? getFolderNameById(fid) : '單一規章'}」`, 'success');
            });

            document.getElementById('copyFullDocBtn').innerHTML = svgIcon('copy', 18);
            document.getElementById('copyFullDocBtn').addEventListener('click', async () => {
                const doc = documents.find(d => d.id === activeDocId);
                if (!doc) return;
                const fullText = `${cleanDisplayTitle(doc.title)}\n\n` + buildDocUnits(doc).map(u => u.text).join('\n\n');
                const ok = await copyToClipboard(fullText);
                if (ok) {
                    const btn = document.getElementById('copyFullDocBtn');
                    btn.innerHTML = svgIcon('check', 18);
                    btn.classList.add('active');
                    showToast('已複製全文', 'success');
                    setTimeout(() => {
                        btn.innerHTML = svgIcon('copy', 18);
                        btn.classList.remove('active');
                    }, 1800);
                }
            });

            document.getElementById('toggleEditDocBtn').addEventListener('click', () => {
                const doc = documents.find(d => d.id === activeDocId);
                if (!doc) return;
                isEditingDocText = !isEditingDocText;
                renderReaderContent(doc, readerQuery);
            });

            document.getElementById('singleUpdateInput').addEventListener('change', async (e) => {
                const doc = documents.find(d => d.id === activeDocId);
                if (doc && e.target.files && e.target.files[0]) {
                    await processBatchFiles([e.target.files[0]], doc.folderId, doc.domain, doc.id);
                }
                e.target.value = '';
            });

            document.getElementById('readerDeleteBtn').addEventListener('click', async () => {
                const doc = documents.find(d => d.id === activeDocId);
                if (!doc) return;
                const ok = await showConfirmModal(
                    '整份刪除此法規',
                    `確定要刪除《${cleanDisplayTitle(doc.title)}》嗎？刪除後無法復原（除非你先儲存過還原點）。`,
                    '確定刪除',
                    true
                );
                if (ok) {
                    await dbDelete(STORE_DOCS, doc.id);
                    documents = documents.filter(d => d.id !== doc.id);
                    showToast('已整份刪除此文件');
                    closeReaderView();
                }
            });

            /* ----- 底部搜尋列 ----- */
            const dockInput = document.getElementById('dockSearchInput');
            dockInput.addEventListener('input', () => {
                if (activeDocId) {
                    readerQuery = dockInput.value;
                    updateFabDot();
                    const doc = documents.find(d => d.id === activeDocId);
                    if (doc) {
                        renderReaderContent(doc, readerQuery);
                        if (readerMatches.length > 0) highlightActiveMatch(0, true);
                    }
                } else {
                    globalQuery = dockInput.value;
                    updateFabDot();
                    renderCurrentView();
                }
            });

            document.getElementById('dockClearBtn').addEventListener('click', () => {
                dockInput.value = '';
                if (activeDocId) {
                    readerQuery = '';
                    const doc = documents.find(d => d.id === activeDocId);
                    if (doc) renderReaderContent(doc, '');
                } else {
                    globalQuery = '';
                    renderCurrentView();
                }
                dockInput.focus();
            });

            document.getElementById('dockPrevBtn').addEventListener('click', () => highlightActiveMatch(currentMatchIdx - 1, true));
            document.getElementById('dockNextBtn').addEventListener('click', () => highlightActiveMatch(currentMatchIdx + 1, true));

            /* ----- 懸浮搜尋球：點一下展開搜尋框，可拖到任何位置 ----- */
            const dock = document.getElementById('bottomSearchDock');
            const fab = document.getElementById('searchFab');
            const FAB = 58;
            const MARGIN = 8;
            let fabPos = await loadPreference('fab_pos', null);
            if (!fabPos || typeof fabPos.fx !== 'number' || typeof fabPos.fy !== 'number') fabPos = null;

            const vpSize = () => {
                const vv = window.visualViewport;
                return { w: vv ? vv.width : window.innerWidth, h: vv ? vv.height : window.innerHeight, ox: vv ? vv.offsetLeft : 0, oy: vv ? vv.offsetTop : 0 };
            };

            const placeFab = () => {
                const v = vpSize();
                let left, top;
                if (!fabPos) {
                    left = v.w - FAB - 14;
                    top = v.h - FAB - 90;
                } else {
                    left = MARGIN + fabPos.fx * (v.w - FAB - MARGIN * 2);
                    top = MARGIN + fabPos.fy * (v.h - FAB - MARGIN * 2);
                }
                left = Math.min(Math.max(MARGIN, left), v.w - FAB - MARGIN);
                top = Math.min(Math.max(MARGIN, top), v.h - FAB - MARGIN);
                fab.style.left = (left + v.ox) + 'px';
                fab.style.top = (top + v.oy) + 'px';
            };

            let anchorTop = null;
            let lastOpenAt = 0;
            let pointerHandledAt = 0;

            const positionDock = () => {
                const v = vpSize();
                const h = dock.offsetHeight;
                const base = anchorTop === null ? (v.h - h - 10) : (anchorTop + FAB / 2 - h / 2);
                const top = Math.min(Math.max(8, base), v.h - h - 8);
                dock.style.top = (top + v.oy) + 'px';
                dock.style.bottom = 'auto';
                dock.classList.toggle('btn-right', !fabPos || fabPos.fx >= 0.5);
            };

            const openSearch = () => {
                const v = vpSize();
                anchorTop = parseFloat(fab.style.top) - v.oy;
                fab.classList.add('hidden');
                dock.classList.remove('hidden');
                positionDock();
                document.getElementById('dockSearchInput').focus();
                setTimeout(positionDock, 200);
                setTimeout(positionDock, 450);
            };

            const closeSearch = () => {
                document.getElementById('dockSearchInput').blur();
                dock.classList.add('hidden');
                fab.classList.remove('hidden');
                placeFab();
            };

            const relayout = () => {
                placeFab();
                if (!dock.classList.contains('hidden')) positionDock();
            };
            placeFab();
            window.addEventListener('resize', relayout);
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', relayout);
                window.visualViewport.addEventListener('scroll', relayout);
            }

            document.getElementById('dockCollapseBtn').addEventListener('click', () => {
                if (Date.now() - lastOpenAt < 700) return;
                closeSearch();
            });
            document.addEventListener('click', (e) => {
                if (dock.classList.contains('hidden')) return;
                if (Date.now() - lastOpenAt < 600) return;
                if (dock.contains(e.target) || fab.contains(e.target)) return;
                if (e.target.closest('.modal-overlay, #confirmModal, #folderInputModal')) return;
                closeSearch();
            });
            document.getElementById('dockSearchInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') e.target.blur();
            });

            fab.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                const startX = e.clientX, startY = e.clientY;
                let moved = false;
                const onMove = (ev) => {
                    if (!moved && Math.hypot(ev.clientX - startX, ev.clientY - startY) < 12) return;
                    moved = true;
                    const v = vpSize();
                    const left = ev.clientX - v.ox - FAB / 2;
                    const top = ev.clientY - v.oy - FAB / 2;
                    fabPos = {
                        fx: Math.min(1, Math.max(0, (left - MARGIN) / (v.w - FAB - MARGIN * 2))),
                        fy: Math.min(1, Math.max(0, (top - MARGIN) / (v.h - FAB - MARGIN * 2)))
                    };
                    placeFab();
                };
                const onEnd = () => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onEnd);
                    window.removeEventListener('pointercancel', onEnd);
                    pointerHandledAt = Date.now();
                    if (moved) {
                        savePreference('fab_pos', fabPos);
                    } else {
                        lastOpenAt = Date.now();
                        openSearch();
                    }
                };
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onEnd);
                window.addEventListener('pointercancel', onEnd);
            });

            /* 後備：萬一瀏覽器沒送出 pointer 事件，用一般點擊也能展開 */
            fab.addEventListener('click', () => {
                if (Date.now() - pointerHandledAt < 700) return;
                lastOpenAt = Date.now();
                openSearch();
            });

            ensurePdfJsLoaded();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
