<!DOCTYPE html>
<html lang="zh-Hant" data-font-scale="large">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>法規與公文檢索系統</title>
    <style>
        /* =========================================================
           1. 純原生 CSS 設計系統（零外部框架依賴、高對比、防破版）
           ========================================================= */
        :root {
            --bg-page: #f4f6f9;
            --bg-card: #ffffff;
            --bg-subtle: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --border-light: #e2e8f0;
            --brand-primary: #1e40af;
            --brand-hover: #1e3a8a;
            --brand-soft: #eff6ff;
            --brand-border: #bfdbfe;
            --danger-color: #dc2626;
            --danger-soft: #fef2f2;
            --danger-border: #fecaca;
            --success-color: #059669;
            --success-soft: #ecfdf5;
            --success-border: #a7f3d0;
            --amber-star: #f59e0b;
            --amber-soft: #fffbeb;
            --amber-border: #fde68a;
            --folder-color: #d97706;
            --radius-lg: 14px;
            --radius-md: 10px;
            --radius-sm: 8px;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
            --shadow-float: 0 10px 25px -5px rgba(15, 23, 42, 0.28), 0 8px 10px -6px rgba(15, 23, 42, 0.16);

            /* 動態閱讀字級變數 */
            --reader-font-size: 20px;
            --reader-line-height: 1.85;
            --list-title-size: 17px;
        }

        html[data-font-scale="normal"] {
            --reader-font-size: 16px;
            --reader-line-height: 1.75;
            --list-title-size: 15px;
        }

        html[data-font-scale="large"] {
            --reader-font-size: 20px;
            --reader-line-height: 1.85;
            --list-title-size: 17px;
        }

        html[data-font-scale="xlarge"] {
            --reader-font-size: 24px;
            --reader-line-height: 1.95;
            --list-title-size: 19px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            overflow-x: hidden;
        }

        button, input, textarea, select {
            font-family: inherit;
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
        }

        .hidden {
            display: none !important;
        }

        /* =========================================================
           2. 頂部導覽列
           ========================================================= */
        .app-header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 0;
            z-index: 60;
            box-shadow: var(--shadow-sm);
        }

        .header-inner {
            max-width: 920px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding: 8px 12px;
        }

        .brand-btn {
            font-size: 17px;
            font-weight: 800;
            color: var(--text-primary);
            white-space: nowrap;
            flex-shrink: 0;
            padding: 4px 2px;
        }

        .brand-btn:hover {
            color: var(--brand-primary);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .font-pill-group {
            display: inline-flex;
            align-items: center;
            background-color: var(--bg-subtle);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            padding: 2px;
            gap: 2px;
            flex-shrink: 0;
        }

        .font-pill-btn {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 5px 7px;
            border-radius: 8px;
            white-space: nowrap;
            transition: background-color 0.15s, color 0.15s;
        }

        .font-pill-btn.active {
            background-color: var(--brand-primary);
            color: #ffffff;
            font-weight: 700;
        }

        .icon-btn {
            position: relative;
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            color: var(--text-primary);
            flex-shrink: 0;
            overflow: hidden;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .icon-btn:hover {
            background-color: var(--bg-subtle);
            border-color: #94a3b8;
        }

        .icon-btn.primary {
            background-color: var(--brand-primary);
            border-color: var(--brand-primary);
            color: #ffffff;
        }

        .icon-btn.primary:hover {
            background-color: var(--brand-hover);
        }

        .icon-btn.brand-outline {
            color: var(--brand-primary);
            border-color: var(--brand-border);
            background-color: var(--brand-soft);
        }

        .icon-btn.danger-outline {
            color: var(--danger-color);
            border-color: var(--danger-border);
            background-color: var(--danger-soft);
        }

        .icon-btn.success-solid {
            background-color: var(--success-color);
            border-color: var(--success-color);
            color: #ffffff;
        }

        .icon-btn.star-nav-btn {
            color: #b45309;
            border-color: var(--amber-border);
            background-color: var(--amber-soft);
            font-size: 17px;
            font-weight: 700;
        }

        .icon-btn.star-nav-btn.active {
            background-color: var(--amber-star);
            border-color: var(--amber-star);
            color: #ffffff;
        }

        .native-file-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 5;
            font-size: 0;
        }

        /* =========================================================
           3. 主容器（底部預留安全空間避開懸浮球與系統列）
           ========================================================= */
        .main-container {
            max-width: 920px;
            margin: 0 auto;
            padding: 12px 12px 160px 12px;
        }

        .progress-panel {
            background-color: var(--brand-soft);
            border: 1px solid var(--brand-border);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: var(--shadow-sm);
        }

        .progress-text {
            font-size: 13px;
            font-weight: 700;
            color: var(--brand-primary);
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background-color: #dbeafe;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: var(--brand-primary);
            transition: width 0.2s ease;
        }

        /* =========================================================
           4. 封面資料夾總覽 & 重要法條收藏入口卡
           ========================================================= */
        .section-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .cover-actions-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .star-collection-banner {
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            border: 1px solid #fcd34d;
            border-radius: var(--radius-lg);
            padding: 13px 14px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
            transition: border-color 0.15s, transform 0.1s;
        }

        .star-collection-banner:active {
            transform: scale(0.99);
        }

        .star-banner-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .star-banner-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background-color: var(--amber-star);
            color: #ffffff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .star-banner-title {
            font-size: var(--list-title-size);
            font-weight: 800;
            color: #92400e;
        }

        .star-banner-sub {
            font-size: 12px;
            color: #b45309;
            margin-top: 1px;
        }

        .star-banner-count {
            background-color: #ffffff;
            border: 1px solid #fcd34d;
            color: #b45309;
            font-size: 13px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .batch-upload-label {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 36px;
            padding: 0 12px;
            background-color: var(--brand-primary);
            color: #ffffff;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
            overflow: hidden;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .batch-upload-label:hover {
            background-color: var(--brand-hover);
        }

        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 8px;
        }

        .folder-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 12px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .folder-card:hover {
            border-color: #93c5fd;
        }

        .folder-card-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .folder-icon-badge {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background-color: var(--amber-soft);
            border: 1px solid var(--amber-border);
            color: var(--folder-color);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .folder-icon-badge.official {
            background-color: var(--brand-soft);
            border-color: var(--brand-border);
            color: var(--brand-primary);
        }

        .folder-icon-badge.default-cat {
            background-color: var(--bg-subtle);
            border-color: var(--border-color);
            color: var(--text-secondary);
        }

        .folder-info {
            min-width: 0;
            flex: 1;
        }

        .folder-name {
            font-size: var(--list-title-size);
            font-weight: 700;
            color: var(--text-primary);
            word-break: break-word;
            line-height: 1.35;
        }

        .folder-count {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .folder-del-btn {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            color: #94a3b8;
            background-color: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .folder-del-btn:hover {
            background-color: var(--danger-soft);
            color: var(--danger-color);
        }

        /* =========================================================
           5. 資料夾內清單、跨資料夾搜尋結果 & 重要法條收藏分頁
           ========================================================= */
        .folder-toolbar-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 10px 12px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .folder-toolbar-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex: 1;
        }

        .folder-heading-wrap {
            min-width: 0;
            flex: 1;
        }

        .folder-heading {
            font-size: calc(var(--list-title-size) + 1px);
            font-weight: 800;
            color: var(--text-primary);
            word-break: break-word;
            line-height: 1.3;
        }

        .folder-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .clear-filter-pill {
            font-size: 12px;
            font-weight: 700;
            color: var(--brand-primary);
            background-color: var(--brand-soft);
            border: 1px solid var(--brand-border);
            padding: 5px 10px;
            border-radius: 8px;
            white-space: nowrap;
        }

        .doc-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .doc-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 12px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .doc-card:hover {
            border-color: #93c5fd;
        }

        .doc-card-body {
            flex: 1;
            min-width: 0;
        }

        .doc-card-title {
            font-size: var(--list-title-size);
            font-weight: 700;
            color: var(--text-primary);
            word-break: break-word;
            line-height: 1.4;
        }

        .doc-card-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        .folder-move-select {
            height: 26px;
            max-width: 165px;
            padding: 0 6px;
            border-radius: 6px;
            border: 1px solid var(--amber-border);
            background-color: var(--amber-soft);
            color: var(--folder-color);
            font-size: 12px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        .folder-move-select.reader-select {
            height: 34px;
            max-width: 150px;
            font-size: 12px;
            border-radius: var(--radius-sm);
        }

        .badge-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 6px;
        }

        .badge-ocr {
            background-color: var(--brand-soft);
            color: var(--brand-primary);
            border: 1px solid var(--brand-border);
        }

        .badge-updated {
            background-color: var(--success-soft);
            color: var(--success-color);
            border: 1px solid var(--success-border);
        }

        .badge-star-count {
            background-color: var(--amber-soft);
            color: #b45309;
            border: 1px solid var(--amber-border);
        }

        .doc-card-snippet {
            margin-top: 8px;
            padding: 8px 10px;
            background-color: #f8fafc;
            border-left: 3px solid var(--brand-primary);
            border-radius: 0 8px 8px 0;
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            word-break: break-word;
        }

        /* 重要法條收藏分頁內的單條卡片 */
        .starred-clause-card {
            background-color: var(--bg-card);
            border: 1px solid #fde68a;
            border-radius: var(--radius-lg);
            padding: 13px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .starred-clause-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 6px;
        }

        .starred-clause-source {
            font-size: 13px;
            font-weight: 700;
            color: var(--brand-primary);
            cursor: pointer;
            word-break: break-word;
            line-height: 1.35;
        }

        .starred-clause-source:hover {
            text-decoration: underline;
        }

        .starred-clause-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .starred-clause-text {
            font-size: var(--reader-font-size);
            line-height: var(--reader-line-height);
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
            cursor: pointer;
        }

        .empty-state {
            background-color: var(--bg-card);
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-lg);
            padding: 32px 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
        }

        /* =========================================================
           6. 閱讀模式（純圖示工具列 + 單條星號與複製）
           ========================================================= */
        .reader-header-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 10px 12px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .reader-toolbar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            width: 100%;
            flex-wrap: wrap;
        }

        .reader-toolbar-right {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        .reader-title-block {
            width: 100%;
            border-top: 1px solid var(--border-light);
            padding-top: 10px;
        }

        .reader-doc-title {
            font-size: calc(var(--list-title-size) + 2px);
            font-weight: 800;
            color: var(--text-primary);
            word-break: break-word;
            line-height: 1.4;
        }

        .reader-doc-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .page-section {
            margin-bottom: 14px;
        }

        .page-divider {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin: 0 0 6px 4px;
        }

        .article-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: var(--shadow-sm);
            position: relative;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .article-card.clause-starred {
            border-color: #fcd34d;
            background-color: #fffdf5;
        }

        .article-card.clause-jump-highlight {
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.35);
            border-color: var(--brand-primary);
        }

        .article-card-actions {
            float: right;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin: 0 0 4px 10px;
        }

        .article-mini-btn {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            border: 1px solid var(--border-light);
            background-color: var(--bg-subtle);
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            line-height: 1;
        }

        .article-mini-btn:hover {
            color: var(--brand-primary);
            border-color: var(--brand-border);
            background-color: var(--brand-soft);
        }

        .article-mini-btn.star-btn.starred {
            color: var(--amber-star);
            background-color: var(--amber-soft);
            border-color: #fcd34d;
        }

        .article-mini-btn.copied {
            color: var(--success-color);
            border-color: var(--success-border);
            background-color: var(--success-soft);
        }

        .article-text {
            font-size: var(--reader-font-size);
            line-height: var(--reader-line-height);
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .inline-edit-textarea {
            width: 100%;
            min-height: 200px;
            padding: 10px;
            border: 1.5px solid var(--brand-primary);
            border-radius: var(--radius-sm);
            font-size: var(--reader-font-size);
            line-height: var(--reader-line-height);
            color: var(--text-primary);
            background-color: #ffffff;
            resize: vertical;
            outline: none;
        }

        .inline-edit-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 8px;
        }

        mark.hl-match {
            background-color: #fef08a;
            color: #0f172a;
            padding: 0 2px;
            border-radius: 3px;
        }

        mark.hl-match.active-match {
            background-color: #ea580c;
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 0 0 2px rgba(234, 88, 12, 0.35);
        }

        /* =========================================================
           7. 全站通用可自由拖曳懸浮球與懸浮搜尋窗（FAB & Popover）
           ========================================================= */
        .fab-circle-btn {
            position: fixed;
            right: 16px;
            bottom: 105px;
            z-index: 999;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--brand-primary);
            color: #ffffff;
            box-shadow: var(--shadow-float);
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }

        .fab-circle-btn:active {
            transform: scale(0.95);
        }

        .fab-badge {
            position: absolute;
            top: -4px;
            left: -4px;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border-radius: 10px;

        .modal-backdrop {

    <script>
        /* =========================================================
           1. 動態背景載入外部解析引擎（非阻塞，離線亦不影響任何按鈕運作）
           ========================================================= */
        let pdfLibReadyPromise = null;
        let tesseractReadyPromise = null;

        function loadExternalScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.async = true;
                s.onload = () => resolve(true);
                s.onerror = () => reject(new Error('無法載入外部腳本：' + src));
                document.head.appendChild(s);
            });
        }

        function ensurePdfJsLoaded() {
            if (window.pdfjsLib) return Promise.resolve(true);
            if (!pdfLibReadyPromise) {
