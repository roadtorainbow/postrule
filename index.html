<!DOCTYPE html>
<html lang="zh-Hant" data-font-scale="large">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>法規與公文檢索系統</title>
    <style>
        /* =========================================================
           1. 純原生 CSS 設計系統（零外部框架依賴、高對比、防破版）
           ========================================================= */
        :root {
            --bg-page: #f4f6f9;
            --bg-card: #ffffff;
            --bg-subtle: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --border-light: #e2e8f0;
            --brand-primary: #1e40af;
            --brand-hover: #1e3a8a;
            --brand-soft: #eff6ff;
            --brand-border: #bfdbfe;
            --danger-color: #dc2626;
            --danger-soft: #fef2f2;
            --danger-border: #fecaca;
            --success-color: #059669;
            --success-soft: #ecfdf5;
            --success-border: #a7f3d0;
            --amber-star: #f59e0b;
            --amber-soft: #fffbeb;
            --amber-border: #fde68a;
            --folder-color: #d97706;
            --radius-lg: 14px;
            --radius-md: 10px;
            --radius-sm: 8px;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
            --shadow-float: 0 10px 25px -5px rgba(15, 23, 42, 0.28), 0 8px 10px -6px rgba(15, 23, 42, 0.16);

            /* 動態閱讀字級變數 */
            --reader-font-size: 20px;
            --reader-line-height: 1.85;
            --list-title-size: 17px;
        }

        html[data-font-scale="normal"] {
            --reader-font-size: 16px;
            --reader-line-height: 1.75;
            --list-title-size: 15px;
        }

        html[data-font-scale="large"] {
            --reader-font-size: 20px;
            --reader-line-height: 1.85;
            --list-title-size: 17px;
        }

        html[data-font-scale="xlarge"] {
            --reader-font-size: 24px;
            --reader-line-height: 1.95;
            --list-title-size: 19px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            overflow-x: hidden;
        }

        button, input, textarea, select {
            font-family: inherit;
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
        }

        .hidden {
            display: none !important;
        }

        /* =========================================================
           2. 頂部導覽列
           ========================================================= */
        .app-header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 0;
            z-index: 60;
            box-shadow: var(--shadow-sm);
        }

        .header-inner {
            max-width: 920px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding: 8px 12px;
        }

        .brand-btn {
            font-size: 17px;
            font-weight: 800;
            color: var(--text-primary);
            white-space: nowrap;
            flex-shrink: 0;
            padding: 4px 2px;
        }

        .brand-btn:hover {
            color: var(--brand-primary);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .font-pill-group {
            display: inline-flex;
            align-items: center;
            background-color: var(--bg-subtle);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            padding: 2px;
            gap: 2px;
            flex-shrink: 0;
        }

        .font-pill-btn {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 5px 7px;
            border-radius: 8px;
            white-space: nowrap;
            transition: background-color 0.15s, color 0.15s;
        }

        .font-pill-btn.active {
            background-color: var(--brand-primary);
            color: #ffffff;
            font-weight: 700;
        }

        .icon-btn {
            position: relative;
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            color: var(--text-primary);
            flex-shrink: 0;
            overflow: hidden;
            transition: background-color 0.15s, border-color 0.15s;
        }

        .icon-btn:hover {
            background-color: var(--bg-subtle);
            border-color: #94a3b8;
        }

        .icon-btn.primary {
            background-color: var(--brand-primary);
            border-color: var(--brand-primary);
            color: #ffffff;
        }

        .icon-btn.primary:hover {
            background-color: var(--brand-hover);
        }

        .icon-btn.brand-outline {
            color: var(--brand-primary);
            border-color: var(--brand-border);
            background-color: var(--brand-soft);
        }

        .icon-btn.danger-outline {
            color: var(--danger-color);
            border-color: var(--danger-border);
            background-color: var(--danger-soft);
        }

        .icon-btn.success-solid {
            background-color: var(--success-color);
            border-color: var(--success-color);
            color: #ffffff;
        }

        .icon-btn.star-nav-btn {
            color: #b45309;
            border-color: var(--amber-border);
            background-color: var(--amber-soft);
            font-size: 17px;
            font-weight: 700;
        }

        .icon-btn.star-nav-btn.active {
            background-color: var(--amber-star);
            border-color: var(--amber-star);
            color: #ffffff;
        }

        .native-file-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 5;
            font-size: 0;
        }

        /* =========================================================
           3. 主容器（底部預留安全空間避開懸浮球與系統列）
           ========================================================= */
        .main-container {
            max-width: 920px;
            margin: 0 auto;
            padding: 12px 12px 160px 12px;
        }

        .progress-panel {
            background-color: var(--brand-soft);
            border: 1px solid var(--brand-border);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: var(--shadow-sm);
        }

        .progress-text {
            font-size: 13px;
            font-weight: 700;
            color: var(--brand-primary);
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background-color: #dbeafe;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: var(--brand-primary);
            transition: width 0.2s ease;
        }

        /* =========================================================
           4. 封面資料夾總覽 & 重要法條收藏入口卡
           ========================================================= */
        .section-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .cover-actions-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .star-collection-banner {
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
            border: 1px solid #fcd34d;
            border-radius: var(--radius-lg);
            padding: 13px 14px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
            transition: border-color 0.15s, transform 0.1s;
        }

        .star-collection-banner:active {
            transform: scale(0.99);
        }

        .star-banner-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .star-banner-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background-color: var(--amber-star);
            color: #ffffff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .star-banner-title {
            font-size: var(--list-title-size);
            font-weight: 800;
            color: #92400e;
        }

        .star-banner-sub {
            font-size: 12px;
            color: #b45309;
            margin-top: 1px;
        }

        .star-banner-count {
            background-color: #ffffff;
            border: 1px solid #fcd34d;
            color: #b45309;
            font-size: 13px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .batch-upload-label {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 36px;
            padding: 0 12px;
            background-color: var(--brand-primary);
            color: #ffffff;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
            overflow: hidden;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        .batch-upload-label:hover {
            background-color: var(--brand-hover);
        }

        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 8px;
        }

        .folder-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 12px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .folder-card:hover {
            border-color: #93c5fd;
        }

        .folder-card-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .folder-icon-badge {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background-color: var(--amber-soft);
            border: 1px solid var(--amber-border);
            color: var(--folder-color);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .folder-icon-badge.official {
            background-color: var(--brand-soft);
            border-color: var(--brand-border);
            color: var(--brand-primary);
        }

        .folder-icon-badge.default-cat {
            background-color: var(--bg-subtle);
            border-color: var(--border-color);
            color: var(--text-secondary);
        }

        .folder-info {
            min-width: 0;
            flex: 1;
        }

        .folder-name {
            font-size: var(--list-title-size);
            font-weight: 700;
            color: var(--text-primary);
            word-break: break-word;
            line-height: 1.35;
        }

        .folder-count {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .folder-del-btn {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            color: #94a3b8;
            background-color: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .folder-del-btn:hover {
            background-color: var(--danger-soft);
            color: var(--danger-color);
        }

        /* =========================================================
           5. 資料夾內清單、跨資料夾搜尋結果 & 重要法條收藏分頁
           ========================================================= */
        .folder-toolbar-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 10px 12px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .folder-toolbar-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex: 1;
        }

        .folder-heading-wrap {
            min-width: 0;
            flex: 1;
        }

        .folder-heading {
            font-size: calc(var(--list-title-size) + 1px);
            font-weight: 800;
            color: var(--text-primary);
            word-break: break-word;
            line-height: 1.3;
        }

        .folder-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .clear-filter-pill {
            font-size: 12px;
            font-weight: 700;
            color: var(--brand-primary);
            background-color: var(--brand-soft);
            border: 1px solid var(--brand-border);
            padding: 5px 10px;
            border-radius: 8px;
            white-space: nowrap;
        }

        .doc-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .doc-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 12px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .doc-card:hover {
            border-color: #93c5fd;
        }

        .doc-card-body {
            flex: 1;
            min-width: 0;
        }

        .doc-card-title {
            font-size: var(--list-title-size);
            font-weight: 700;
            color: var(--text-primary);
            word-break: break-word;
            line-height: 1.4;
        }

        .doc-card-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        .folder-move-select {
            height: 26px;
            max-width: 165px;
            padding: 0 6px;
            border-radius: 6px;
            border: 1px solid var(--amber-border);
            background-color: var(--amber-soft);
            color: var(--folder-color);
            font-size: 12px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        .folder-move-select.reader-select {
            height: 34px;
            max-width: 150px;
            font-size: 12px;
            border-radius: var(--radius-sm);
        }

        .badge-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 6px;
        }

        .badge-ocr {
            background-color: var(--brand-soft);
            color: var(--brand-primary);
            border: 1px solid var(--brand-border);
        }

        .badge-updated {
            background-color: var(--success-soft);
            color: var(--success-color);
            border: 1px solid var(--success-border);
        }

        .badge-star-count {
            background-color: var(--amber-soft);
            color: #b45309;
            border: 1px solid var(--amber-border);
        }

        .doc-card-snippet {
            margin-top: 8px;
            padding: 8px 10px;
            background-color: #f8fafc;
            border-left: 3px solid var(--brand-primary);
            border-radius: 0 8px 8px 0;
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            word-break: break-word;
        }

        /* 重要法條收藏分頁內的單條卡片 */
        .starred-clause-card {
            background-color: var(--bg-card);
            border: 1px solid #fde68a;
            border-radius: var(--radius-lg);
            padding: 13px;
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .starred-clause-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 6px;
        }

        .starred-clause-source {
            font-size: 13px;
            font-weight: 700;
            color: var(--brand-primary);
            cursor: pointer;
            word-break: break-word;
            line-height: 1.35;
        }

        .starred-clause-source:hover {
            text-decoration: underline;
        }

        .starred-clause-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .starred-clause-text {
            font-size: var(--reader-font-size);
            line-height: var(--reader-line-height);
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
            cursor: pointer;
        }

        .empty-state {
            background-color: var(--bg-card);
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-lg);
            padding: 32px 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
        }

        /* =========================================================
           6. 閱讀模式（純圖示工具列 + 單條星號與複製）
           ========================================================= */
        .reader-header-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 10px 12px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .reader-toolbar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            width: 100%;
            flex-wrap: wrap;
        }

        .reader-toolbar-right {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        .reader-title-block {
            width: 100%;
            border-top: 1px solid var(--border-light);
            padding-top: 10px;
        }

        .reader-doc-title {
            font-size: calc(var(--list-title-size) + 2px);
            font-weight: 800;
            color: var(--text-primary);
            word-break: break-word;
            line-height: 1.4;
        }

        .reader-doc-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .page-section {
            margin-bottom: 14px;
        }

        .page-divider {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin: 0 0 6px 4px;
        }

        .article-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: var(--shadow-sm);
            position: relative;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .article-card.clause-starred {
            border-color: #fcd34d;
            background-color: #fffdf5;
        }

        .article-card.clause-jump-highlight {
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.35);
            border-color: var(--brand-primary);
        }

        .article-card-actions {
            float: right;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin: 0 0 4px 10px;
        }

        .article-mini-btn {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            border: 1px solid var(--border-light);
            background-color: var(--bg-subtle);
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            line-height: 1;
        }

        .article-mini-btn:hover {
            color: var(--brand-primary);
            border-color: var(--brand-border);
            background-color: var(--brand-soft);
        }

        .article-mini-btn.star-btn.starred {
            color: var(--amber-star);
            background-color: var(--amber-soft);
            border-color: #fcd34d;
        }

        .article-mini-btn.copied {
            color: var(--success-color);
            border-color: var(--success-border);
            background-color: var(--success-soft);
        }

        .article-text {
            font-size: var(--reader-font-size);
            line-height: var(--reader-line-height);
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .inline-edit-textarea {
            width: 100%;
            min-height: 200px;
            padding: 10px;
            border: 1.5px solid var(--brand-primary);
            border-radius: var(--radius-sm);
            font-size: var(--reader-font-size);
            line-height: var(--reader-line-height);
            color: var(--text-primary);
            background-color: #ffffff;
            resize: vertical;
            outline: none;
        }

        .inline-edit-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 8px;
        }

        mark.hl-match {
            background-color: #fef08a;
            color: #0f172a;
            padding: 0 2px;
            border-radius: 3px;
        }

        mark.hl-match.active-match {
            background-color: #ea580c;
            color: #ffffff;
            font-weight: 700;
            box-shadow: 0 0 0 2px rgba(234, 88, 12, 0.35);
        }

        /* =========================================================
           7. 全站通用可自由拖曳懸浮球與懸浮搜尋窗（FAB & Popover）
           ========================================================= */
        .fab-circle-btn {
            position: fixed;
            right: 16px;
            bottom: 105px;
            z-index: 999;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--brand-primary);
            color: #ffffff;
            box-shadow: var(--shadow-float);
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
        }

        .fab-circle-btn:active {
            transform: scale(0.95);
        }

        .fab-badge {
            position: absolute;
            top: -4px;
            left: -4px;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border-radius: 10px;

        .modal-backdrop {

    <script>
        /* =========================================================
           1. 動態背景載入外部解析引擎（非阻塞，離線亦不影響任何按鈕運作）
           ========================================================= */
        let pdfLibReadyPromise = null;
        let tesseractReadyPromise = null;

        function loadExternalScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.async = true;
                s.onload = () => resolve(true);
                s.onerror = () => reject(new Error('無法載入外部腳本：' + src));
                document.head.appendChild(s);
            });
        }

        function ensurePdfJsLoaded() {
            if (window.pdfjsLib) return Promise.resolve(true);
            if (!pdfLibReadyPromise) {

        const DB_NAME = 'RegDocDB_v1';

        const STORE_FOLDERS = 'folders';
        const STORE_PREFS = 'preferences';
        let idbAvailable = true;

        function openDB() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) {
                    idbAvailable = false;
                    return reject(new Error('IndexedDB unavailable'));
                }
                try {
                    const req = indexedDB.open(DB_NAME, DB_VERSION);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(STORE_DOCS)) {
                            db.createObjectStore(STORE_DOCS, { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains(STORE_FOLDERS)) {
                            db.createObjectStore(STORE_FOLDERS, { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains(STORE_PREFS)) {
                            db.createObjectStore(STORE_PREFS, { keyPath: 'key' });
                        }
                    };
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => {
                        idbAvailable = false;
                        reject(req.error);
                    };
                } catch (err) {
                    idbAvailable = false;
                    reject(err);
                }
            });
        }

        function syncFallbackStorage() {
            if (idbAvailable) return;
            try {
                localStorage.setItem('regdocdb_v1_folders', JSON.stringify(folders));
                localStorage.setItem('regdocdb_v1_documents', JSON.stringify(documents));
            } catch (e) {

        async function dbGetAll(storeName) {
            try {
                const db = await openDB();
                return await new Promise((resolve) => {
                    const tx = db.transaction(storeName, 'readonly');
                    const req = tx.objectStore(storeName).getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => resolve([]);
                });
            } catch (e) {
                try {
                    const key = storeName === STORE_FOLDERS ? 'regdocdb_v1_folders' : 'regdocdb_v1_documents';
                    const raw = localStorage.getItem(key);
                    return raw ? JSON.parse(raw) : [];
                } catch (err) {
                    return [];
                }
            }
        }

        async function dbPut(storeName, item) {
            if (!idbAvailable) {
                syncFallbackStorage();
                return;
            }
            try {
                const db = await openDB();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, 'readwrite');
                    tx.objectStore(storeName).put(item);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            } catch (e) {
                idbAvailable = false;
                syncFallbackStorage();
            }
        }

            if (!idbAvailable) {
                syncFallbackStorage();
                return;
            }
            try {
                const db = await openDB();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, 'readwrite');
                    tx.objectStore(storeName).delete(key);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            } catch (e) {
                idbAvailable = false;

            }

            try {
                const db = await openDB();
                await new Promise((resolve) => {

                    tx.objectStore(STORE_PREFS).put({ key, value });
                    tx.oncomplete = () => resolve();

        async function loadPreference(key, fallback) {
            try {
                const db = await openDB();
                const val = await new Promise((resolve) => {
                    const tx = db.transaction(STORE_PREFS, 'readonly');
                    const req = tx.objectStore(STORE_PREFS).get(key);
                    req.onsuccess = () => resolve(req.result ? req.result.value : null);
                    req.onerror = () => resolve(null);

            try {

        /* =========================================================
           5. 文字排版清理（消除 PDF 強制硬折行與頁首頁尾干擾）
           ========================================================= */
        function reflowRegulationText(rawText) {
            if (!rawText) return '';
            const rawLines = rawText.replace(/\r\n/g, '\n').split('\n');
            const cleanedLines = [];

            // 過濾常見 PDF 頁碼與頁眉雜訊（如「- 7 -」或單獨出現的規章章節頁眉）
            for (const line of rawLines) {
                const trimmed = line.trim();
                if (!trimmed) continue;
                if (/^[-－—]\s*\d+\s*[-－—]$/.test(trimmed)) continue;
                if (/^第\s*\d+\s*頁(\s*\/\s*共\s*\d+\s*頁)?$/.test(trimmed)) continue;
                cleanedLines.push(trimmed);
            }

            if (cleanedLines.length === 0) return '';

            // 判斷是否為「必須強制換行」的新段落或條款開頭
            const newParagraphRegex = /^(第\s*[一二三四五六七八九十百千0-9]+\s*[條章節款目](?:之[一二三四五六七八九十0-9]+)?|[一二三四五六七八九十]+、|（[一二三四五六七八九十0-9]+）|\([一二三四五六七八九十0-9]+\)|[0-9]+[、.．]|[①②③④⑤⑥⑦⑧⑨⑩]|附則|說明|主旨|依據|公告事項|辦法)：?/;

            let result = '';
            for (let i = 0; i < cleanedLines.length; i++) {
                const curr = cleanedLines[i];
                if (i === 0) {
                    result = curr;
                    continue;
                }

                const prev = cleanedLines[i - 1];
                const isNewPara = newParagraphRegex.test(curr);
                const prevEndedSentence = /[。；：！？]$/.test(prev);

                if (isNewPara || prevEndedSentence) {
                    result += '\n' + curr;
                } else {
                    // 接續上一行被 PDF 切斷的句子（中文字之間不加空白，英數字之間保留一格）
                    const needSpace = /[A-Za-z0-9]$/.test(prev) && /^[A-Za-z0-9]/.test(curr);
                    result += (needSpace ? ' ' : '') + curr;
                }
            }

            return result.trim();
        }

        function splitIntoArticles(pageText) {
            const reflowed = reflowRegulationText(pageText);
            const lines = reflowed.split('\n');
            const blocks = [];
            let current = [];
            const headerRegex = /^\s*第\s*[一二三四五六七八九十百千0-9]+\s*條(?:之[一二三四五六七八九十0-9]+)?/;

            for (const line of lines) {
                if (headerRegex.test(line) && current.length > 0) {
                    const joined = current.join('\n').trim();
                    if (joined) blocks.push(joined);
                    current = [line];
                } else {
                    current.push(line);
                }
            }
            if (current.length > 0) {
                const joined = current.join('\n').trim();
                if (joined) blocks.push(joined);
            }
            return blocks.length > 0 ? blocks : [reflowed];
        }

        function extractClauseKey(blockText, pageNum, blockIdx) {
            const firstLine = (blockText || '').split('\n')[0].trim();
            const m = firstLine.match(/^(第\s*[一二三四五六七八九十百千0-9]+\s*條(?:之[一二三四五六七八九十0-9]+)?)/);
            if (m) {
                return m[1].replace(/\s+/g, '');
            }
            return `P${pageNum}-B${blockIdx}`;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');

        function parseKeywords(q) {

            const safe = escapeHtml(text);

            const escaped = keywords.map(k => escapeHtml(k).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
            const regex = new RegExp(`(${escaped.join('|')})`, 'gi');
            return safe.replace(regex, '<mark class="hl-match">$1</mark>');

        async function copyToClipboard(text) {

            try {

                document.body.appendChild(ta);

        /* =========================================================
           7. 圖片純取文字與 PDF / TXT 解析引擎
           ========================================================= */
        async function runTesseractOCR(imageSource, labelPrefix) {
            setProgress(true, `${labelPrefix} 準備繁中 OCR 辨識引擎...`, 12);
            const loaded = await ensureTesseractLoaded();
            if (!loaded || !window.Tesseract) {
                return '（目前為離線或受限網路環境，無法下載 OCR 模型；您可點擊上方「編輯」圖示手動輸入文字）';
            }
            try {
                const result = await Tesseract.recognize(imageSource, 'chi_tra+eng', {
                    logger: (m) => {
                        if (m.status === 'recognizing text') {
                            const pct = Math.round((m.progress || 0) * 100);
                            setProgress(true, `${labelPrefix} 擷取文字中 (${pct}%)...`, pct);
                        } else if (m.status) {
                            setProgress(true, `${labelPrefix} 載入繁中辨識模型中...`, 25);
                        }
                    }
                });
                const raw = (result && result.data && result.data.text) ? result.data.text : '';
                const cleaned = raw
                    .replace(/([\u4e00-\u9fa5])\s+([\u4e00-\u9fa5])/g, '$1$2')
                    .replace(/\n{3,}/g, '\n\n')
                    .trim();
                return cleaned || '（未辨識到清晰文字，可點擊閱讀頁上方的「編輯」圖示手動補充）';
            } catch (err) {
                console.error('OCR 錯誤:', err);
                return '（圖片文字辨識失敗，請確認網路連線或點擊上方「編輯」手動補充）';
            }
        }

        async function parseAnyFile(file, index, total) {
            const lower = file.name.toLowerCase();
            const prefix = `[${index + 1}/${total}] ${file.name}`;

            if (file.type.startsWith('image/') || /\.(jpg|jpeg|png|webp)$/i.test(lower)) {
                const objectUrl = URL.createObjectURL(file);
                try {
                    const extractedText = await runTesseractOCR(objectUrl, prefix);
                    return {
                        isOcr: true,
                        pages: [{
                            pageNumber: 1,
                            text: extractedText
                        }]
                    };
                } finally {
                    URL.revokeObjectURL(objectUrl);
                }
            }

            if (lower.endsWith('.pdf')) {
                setProgress(true, `${prefix} 載入 PDF 解析引擎...`, 10);
                const pdfReady = await ensurePdfJsLoaded();
                if (!pdfReady || !window.pdfjsLib) {
                    return {
                        isOcr: false,
                        pages: [{
                            pageNumber: 1,
                            text: '（目前為離線或受限網路環境，無法載入 PDF 解析元件；建議連網後重新匯入或改傳 .txt 純文字檔）'
                        }]
                    };
                }

                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const pages = [];
                let usedOcr = false;

                for (let p = 1; p <= pdf.numPages; p++) {
                    setProgress(true, `${prefix} 讀取第 ${p}/${pdf.numPages} 頁...`, Math.round((p / pdf.numPages) * 85));
                    const page = await pdf.getPage(p);
                    const content = await page.getTextContent();

                    let lastY = null;
                    let lineText = '';
                    const lines = [];
                    for (const item of content.items) {
                        const y = item.transform ? item.transform[5] : null;
                        if (lastY !== null && y !== null && Math.abs(y - lastY) > 6) {
                            lines.push(lineText.trim());
                            lineText = item.str;
                        } else {
                            lineText += item.str;
                        }
                        lastY = y;
                    }
                    if (lineText.trim()) lines.push(lineText.trim());
                    let extracted = lines.join('\n').trim();

                    if (extracted.length < 15) {
                        const ocrReady = await ensureTesseractLoaded();
                        if (ocrReady && window.Tesseract) {
                            usedOcr = true;
                            const viewport = page.getViewport({ scale: 1.7 });
                            const canvas = document.createElement('canvas');
                            canvas.width = viewport.width;
                            canvas.height = viewport.height;
                            const ctx = canvas.getContext('2d');
                            await page.render({ canvasContext: ctx, viewport }).promise;
                            extracted = await runTesseractOCR(canvas, `${prefix} 第${p}頁(掃描)`);
                            canvas.width = 0;
                            canvas.height = 0;
                        }
                    }

                    pages.push({
                        pageNumber: p,
                        text: extracted || '（此頁無文字內容）'
                    });
                }
                return { isOcr: usedOcr, pages };
            }

            setProgress(true, `${prefix} 讀取純文字內容...`, 60);
            const rawText = await file.text();
            return {
                isOcr: false,
                pages: [{
                    pageNumber: 1,
                    text: rawText.replace(/\r\n/g, '\n').trim() || '（無文字內容）'
                }]
            };
        }

        async function processBatchFiles(fileList, targetFolderId, forceOverwriteDocId = null) {
            const files = Array.from(fileList || []);
            if (files.length === 0) return;

            const folderId = targetFolderId || UNCATEGORIZED_FOLDER_ID;
            const todayStr = new Date().toLocaleDateString('zh-TW');
            let added = 0;
            let updated = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                try {
                    const parsed = await parseAnyFile(file, i, files.length);
                    const core = extractCoreName(file.name);

                    let existing = null;
                    if (forceOverwriteDocId) {
                        existing = documents.find(d => d.id === forceOverwriteDocId) || null;
                    } else {
                        existing = documents.find(d => extractCoreName(d.title) === core) || null;
                    }

                    if (existing) {
                        existing.title = file.name;
                        existing.coreName = core;
                        existing.isOcr = parsed.isOcr;
                        existing.pages = parsed.pages;
                        existing.updatedAt = todayStr;
                        existing.isRecentlyUpdated = true;
                        await dbPut(STORE_DOCS, existing);
                        updated++;
                    } else {
                        const newDoc = {
                            id: 'doc-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
                            folderId,
                            title: file.name,
                            coreName: core,
                            isOcr: parsed.isOcr,
                            starredClauses: [],
                            updatedAt: todayStr,
                            isRecentlyUpdated: false,
                            pages: parsed.pages
                        };
                        documents.push(newDoc);
                        await dbPut(STORE_DOCS, newDoc);
                        added++;
                    }
                } catch (err) {
                    console.error('匯入錯誤:', file.name, err);
                    showToast(`匯入失敗：${file.name}`, 'error');
                }
            }

            setProgress(false);
            sortDocuments();
            renderCurrentView();

            if (forceOverwriteDocId && activeDocId === forceOverwriteDocId) {
                renderReaderPage(forceOverwriteDocId, readerQuery);
            }

            if (updated > 0 && added > 0) {
                showToast(`新增 ${added} 份、覆蓋更新 ${updated} 份（已保留法條星號）`, 'success');
            } else if (updated > 0) {
                showToast(`已覆蓋更新 ${updated} 份文件（法條星號已保留）`, 'success');
            } else if (added > 0) {
                showToast(`成功匯入 ${added} 份文件`, 'success');
            }
        }

        /* 永遠維持法規原本編號與名稱順序，不因打星號改變排列 */
        function sortDocuments() {
            documents.sort((a, b) => a.title.localeCompare(b.title, 'zh-Hant', { numeric: true }));
        }

        function applyFontScale(scale) {
            const valid = ['normal', 'large', 'xlarge'].includes(scale) ? scale : 'large';
            document.documentElement.setAttribute('data-font-scale', valid);
            savePreference('font_scale', valid);
            document.querySelectorAll('.font-pill-btn').forEach(btn => {

        /* =========================================================
           9. 蒐集所有已打星號的「單條法條」清單
           ========================================================= */
        function getAllStarredClauseItems() {
            const items = [];
            for (const doc of documents) {
                const starredSet = new Set(Array.isArray(doc.starredClauses) ? doc.starredClauses : []);
                if (starredSet.size === 0) continue;

                for (const page of doc.pages) {
                    const blocks = splitIntoArticles(page.text);
                    blocks.forEach((blockText, bIdx) => {
                        const clauseKey = extractClauseKey(blockText, page.pageNumber, bIdx);
                        if (starredSet.has(clauseKey)) {
                            items.push({
                                docId: doc.id,
                                docTitle: doc.title,
                                folderName: getFolderNameById(doc.folderId),
                                pageNumber: page.pageNumber,
                                clauseKey,
                                text: blockText
                            });
                        }
                    });
                }
            }
            return items;
        }

        function buildMatchSnippet(doc, keywords) {
            if (!keywords || keywords.length === 0) return '';
            const blocks = doc.pages.flatMap(p => splitIntoArticles(p.text));
            let bestText = '';
            let maxHits = 0;

            for (const block of blocks) {
                const lower = block.toLowerCase();
                let hits = 0;
                for (const kw of keywords) {
                    if (lower.includes(kw.toLowerCase())) hits++;
                }
                if (hits > maxHits) {
                    maxHits = hits;
                    bestText = block;
                }
            }

            const targetText = bestText || doc.pages.map(p => reflowRegulationText(p.text)).join('\n');
            const lowerTarget = targetText.toLowerCase();
            let firstIdx = -1;
            for (const kw of keywords) {
                const idx = lowerTarget.indexOf(kw.toLowerCase());
                if (idx !== -1 && (firstIdx === -1 || idx < firstIdx)) firstIdx = idx;
            }
            if (firstIdx === -1) return '';

            const start = Math.max(0, firstIdx - 28);
            const end = Math.min(targetText.length, firstIdx + 95);
            const slice = (start > 0 ? '...' : '') + targetText.slice(start, end) + (end < targetText.length ? '...' : '');
            return highlightKeywords(slice, keywords);
        }

        function getFilteredDocuments(folderIdOrNull) {
            const keywords = parseKeywords(globalQuery);
            return documents.filter(doc => {
                if (folderIdOrNull && doc.folderId !== folderIdOrNull) return false;
                if (keywords.length === 0) return true;
                const folderName = getFolderNameById(doc.folderId);
                const haystack = (folderName + '\n' + doc.title + '\n' + doc.pages.map(p => reflowRegulationText(p.text)).join('\n')).toLowerCase();
                return keywords.every(kw => haystack.includes(kw.toLowerCase()));
            });
        }

        function renderReaderContent(doc, searchStr, targetClauseKey = null) {
            const container = document.getElementById('readerContentContainer');

            const keywords = parseKeywords(searchStr);
            if (!Array.isArray(doc.starredClauses)) doc.starredClauses = [];

            const copySvg = `<svg width="16" height="16" style="width:16px;height:16px;flex-shrink:0;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>`;

                        const div = document.createElement('div');

                    card.className = 'article-card';
                    const ta = document.createElement('textarea');
                    ta.className = 'inline-edit-textarea';
                    ta.value = reflowRegulationText(page.text);
                    card.appendChild(ta);
                    textareas.push({ page, ta });
                    pageSec.appendChild(card);
                    container.appendChild(pageSec);
                }

                const actionBar = document.createElement('div');
                actionBar.className = 'inline-edit-actions';
                actionBar.innerHTML = `
                    <button type="button" id="cancelEditDocBtn" class="modal-btn cancel">取消</button>

                `;

                document.getElementById('cancelEditDocBtn').addEventListener('click', () => {
                    isEditingDocText = false;
                    renderReaderContent(doc, readerQuery);
                });

                document.getElementById('saveEditDocBtn').addEventListener('click', async () => {
                    for (const item of textareas) {
                        item.page.text = item.ta.value;
                    }
                    doc.updatedAt = new Date().toLocaleDateString('zh-TW');
                    doc.isRecentlyUpdated = true;

                    document.getElementById('readerDocMetaText').textContent = `共 ${doc.pages.length} 頁・更新日期：${doc.updatedAt}`;
                    document.getElementById('readerUpdatedBadge').classList.remove('hidden');
                    renderReaderContent(doc, readerQuery);
                    showToast('已儲存校正後的內文', 'success');
                });
                return;
            }

            let targetElementToScroll = null;

            for (const page of doc.pages) {
                const pageSec = document.createElement('div');
                pageSec.className = 'page-section';

                if (doc.pages.length > 1) {
                    const div = document.createElement('div');
                    div.className = 'page-divider';
                    div.textContent = `第 ${page.pageNumber} 頁 / 共 ${doc.pages.length} 頁`;
                    pageSec.appendChild(div);
                }

                const articles = splitIntoArticles(page.text);
                articles.forEach((blockText, bIdx) => {
                    const clauseKey = extractClauseKey(blockText, page.pageNumber, bIdx);
                    const isClauseStarred = doc.starredClauses.includes(clauseKey);

                    const card = document.createElement('article');
                    card.className = 'article-card' + (isClauseStarred ? ' clause-starred' : '');
                    card.setAttribute('data-clause-key', clauseKey);

                    card.innerHTML = `
                        <div class="article-card-actions">
                            <button type="button" class="article-mini-btn star-btn ${isClauseStarred ? 'starred' : ''}" title="收藏此條至重要法條分頁" aria-label="收藏此條">${isClauseStarred ? '★' : '☆'}</button>
                            <button type="button" class="article-mini-btn copy-btn" title="複製此段" aria-label="複製此段">${copySvg}</button>
                        </div>
                        <div class="article-text">${highlightKeywords(blockText, keywords)}</div>
                    `;

                    if (targetClauseKey && clauseKey === targetClauseKey) {
                        targetElementToScroll = card;
                    }

                    const starBtn = card.querySelector('.star-btn');
                    starBtn.addEventListener('click', async () => {
                        const idx = doc.starredClauses.indexOf(clauseKey);
                        if (idx === -1) {
                            doc.starredClauses.push(clauseKey);
                            starBtn.textContent = '★';
                            starBtn.classList.add('starred');
                            card.classList.add('clause-starred');
                            showToast('已收錄至「重要法條收藏分頁」★', 'success');
                        } else {
                            doc.starredClauses.splice(idx, 1);
                            starBtn.textContent = '☆';
                            starBtn.classList.remove('starred');
                            card.classList.remove('clause-starred');
                            showToast('已取消此條收藏');
                        }
                        await dbPut(STORE_DOCS, doc);
                        updateStarredCollectionCountBadges();
                    });

                    const copyBtn = card.querySelector('.copy-btn');
                    copyBtn.addEventListener('click', async () => {
                        const ok = await copyToClipboard(blockText);
                        if (ok) {
                            copyBtn.innerHTML = checkSvg;
                            copyBtn.classList.add('copied');
                            showToast('已複製此段文字', 'success');
                            setTimeout(() => {
                                copyBtn.innerHTML = copySvg;
                                copyBtn.classList.remove('copied');
                            }, 1600);
                        }
                    });

                    pageSec.appendChild(card);
                });

                container.appendChild(pageSec);
            }

            readerMatches = Array.from(container.querySelectorAll('mark.hl-match'));
            if (keywords.length > 0) {
                if (readerMatches.length > 0) {
                    currentMatchIdx = 0;
                    highlightActiveMatch(0, false);
                } else {
                    currentMatchIdx = -1;
                    document.getElementById('fabMatchCounter').textContent = '第 0 / 0 筆';
                }
            } else {
                currentMatchIdx = -1;
            }
            syncFabUIWithMode();

            if (targetElementToScroll) {
                setTimeout(() => {
                    targetElementToScroll.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    targetElementToScroll.classList.add('clause-jump-highlight');
                    setTimeout(() => targetElementToScroll.classList.remove('clause-jump-highlight'), 2200);
                }, 60);
            }
        }

        function highlightActiveMatch(index, shouldScroll = true) {
            if (readerMatches.length === 0) return;
            const total = readerMatches.length;
            currentMatchIdx = ((index % total) + total) % total;

            readerMatches.forEach((el, idx) => {
                el.classList.toggle('active-match', idx === currentMatchIdx);
            });

            document.getElementById('fabMatchCounter').textContent = `第 ${currentMatchIdx + 1} / ${total} 筆`;

            if (shouldScroll) {
                readerMatches[currentMatchIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function renderReaderPage(docId, initialQuery = '', targetClauseKey = null) {
            const doc = documents.find(d => d.id === docId);
            if (!doc) return;

            activeDocId = docId;
            isEditingDocText = false;
            readerQuery = initialQuery || '';

            document.getElementById('readerDocTitle').textContent = doc.title;
            document.getElementById('readerDocMetaText').textContent = `共 ${doc.pages.length} 頁・更新日期：${doc.updatedAt}`;
            document.getElementById('readerOcrBadge').classList.toggle('hidden', !doc.isOcr);
            document.getElementById('readerUpdatedBadge').classList.toggle('hidden', !doc.isRecentlyUpdated);

            const folderSelect = document.getElementById('readerFolderSelect');
            folderSelect.innerHTML = buildFolderOptionsHtml(doc.folderId);

            renderCurrentView();
            renderReaderContent(doc, readerQuery, targetClauseKey);

            if (readerQuery.trim().length > 0) {
                toggleFabPopover(true);
            } else {
                toggleFabPopover(false);
            }

            if (!targetClauseKey) {
                if (readerMatches.length > 0) {
                    highlightActiveMatch(0, true);
                } else {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }
        }

        function openReaderView(docId, initialQuery = '', targetClauseKey = null) {
            activeDocId = docId;
            pushNavigationState();
            renderReaderPage(docId, initialQuery, targetClauseKey);
        }

        function closeReaderView() {
            if (window.history.state && window.history.state.activeDocId) {
                window.history.back();
            } else {
                activeDocId = null;
                isEditingDocText = false;
                renderCurrentView();
                if (!document.getElementById('fabPopover').classList.contains('hidden')) {
                    positionPopoverNearFab();
                }
            }
        }

        /* =========================================================
           12. 全站通用可自由拖曳懸浮球與懸浮搜尋窗（Pointer Events 統一相容）
           ========================================================= */
        function clampPosition(x, y, elWidth, elHeight) {
            const margin = 8;
            const maxX = Math.max(margin, window.innerWidth - elWidth - margin);
            const maxY = Math.max(margin, window.innerHeight - elHeight - margin);
            return {
                x: Math.min(Math.max(margin, x), maxX),
                y: Math.min(Math.max(margin, y), maxY)
            };
        }

        function positionPopoverNearFab() {
            const fab = document.getElementById('fabCircleBtn');
            const pop = document.getElementById('fabPopover');
            if (pop.classList.contains('hidden')) return;

            const fabRect = fab.getBoundingClientRect();
            const popRect = pop.getBoundingClientRect();
            const popW = popRect.width || 292;
            const popH = popRect.height || 110;

            let targetX = fabRect.right - popW;
            if (targetX < 12) targetX = fabRect.left;

            let targetY = fabRect.top - popH - 10;
            if (targetY < 56) {
                targetY = fabRect.bottom + 10;
            }

            const clamped = clampPosition(targetX, targetY, popW, popH);
            pop.style.left = `${clamped.x}px`;
            pop.style.top = `${clamped.y}px`;
        }

        function toggleFabPopover(open) {
            const pop = document.getElementById('fabPopover');
            if (open) {
                syncFabUIWithMode();
                pop.classList.remove('hidden');
                positionPopoverNearFab();
                setTimeout(() => document.getElementById('fabSearchInput').focus(), 40);
            } else {
                pop.classList.add('hidden');
            }
        }

        function initDraggableFloatingControls() {
            const fab = document.getElementById('fabCircleBtn');
            const pop = document.getElementById('fabPopover');
            const popHandle = document.getElementById('fabDragHandle');

            loadPreference('fab_pos', null).then((savedPos) => {
                if (savedPos && typeof savedPos.x === 'number' && typeof savedPos.y === 'number') {
                    const c = clampPosition(savedPos.x, savedPos.y, 50, 50);
                    fab.style.right = 'auto';
                    fab.style.bottom = 'auto';
                    fab.style.left = `${c.x}px`;
                    fab.style.top = `${c.y}px`;
                }
            });

            // 使用 Pointer Events 統一處理手機觸控與滑鼠，確保輕點與拖曳100%穩定
            let pointerId = null;
            let isDragging = false;
            let startX = 0;
            let startY = 0;
            let startLeft = 0;
            let startTop = 0;
            const DRAG_THRESHOLD = 8;

            fab.addEventListener('pointerdown', (e) => {
                if (e.button !== undefined && e.button !== 0) return;
                pointerId = e.pointerId;
                isDragging = false;
                const rect = fab.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                startLeft = rect.left;
                startTop = rect.top;
                try { fab.setPointerCapture(e.pointerId); } catch (err) {}
            });

            fab.addEventListener('pointermove', (e) => {
                if (pointerId !== e.pointerId) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                if (!isDragging && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)) {
                    isDragging = true;
                }

                if (isDragging) {
                    const c = clampPosition(startLeft + dx, startTop + dy, 50, 50);
                    fab.style.right = 'auto';
                    fab.style.bottom = 'auto';
                    fab.style.left = `${c.x}px`;
                    fab.style.top = `${c.y}px`;
                    if (!pop.classList.contains('hidden')) {
                        positionPopoverNearFab();
                    }
                }
            });

            const finishFabPointer = (e) => {
                if (pointerId !== e.pointerId) return;
                try { fab.releasePointerCapture(e.pointerId); } catch (err) {}
                pointerId = null;

                if (isDragging) {
                    isDragging = false;
                    const rect = fab.getBoundingClientRect();
                    savePreference('fab_pos', { x: rect.left, y: rect.top });
                } else {
                    const isHidden = pop.classList.contains('hidden');
                    toggleFabPopover(isHidden);
                }
            };

            fab.addEventListener('pointerup', finishFabPointer);
            fab.addEventListener('pointercancel', () => {
                pointerId = null;
                isDragging = false;
            });

            // 展開後的搜尋視窗拖曳手把
            let popPointerId = null;
            let popDragging = false;
            let popStartX = 0;
            let popStartY = 0;
            let popOrigLeft = 0;
            let popOrigTop = 0;

            popHandle.addEventListener('pointerdown', (e) => {
                if (e.target.closest('#fabCloseBtn')) return;
                popPointerId = e.pointerId;
                popDragging = false;
                const rect = pop.getBoundingClientRect();
                popStartX = e.clientX;
                popStartY = e.clientY;
                popOrigLeft = rect.left;
                popOrigTop = rect.top;
                try { popHandle.setPointerCapture(e.pointerId); } catch (err) {}
            });

            popHandle.addEventListener('pointermove', (e) => {
                if (popPointerId !== e.pointerId) return;
                const dx = e.clientX - popStartX;
                const dy = e.clientY - popStartY;
                if (!popDragging && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)) {
                    popDragging = true;
                }
                if (popDragging) {
                    const rect = pop.getBoundingClientRect();
                    const c = clampPosition(popOrigLeft + dx, popOrigTop + dy, rect.width, rect.height);
                    pop.style.left = `${c.x}px`;
                    pop.style.top = `${c.y}px`;
                }
            });

            const finishPopPointer = (e) => {
                if (popPointerId !== e.pointerId) return;
                try { popHandle.releasePointerCapture(e.pointerId); } catch (err) {}
                popPointerId = null;
                popDragging = false;
            };

            popHandle.addEventListener('pointerup', finishPopPointer);
            popHandle.addEventListener('pointercancel', finishPopPointer);

            window.addEventListener('resize', () => {
                const rect = fab.getBoundingClientRect();
                const c = clampPosition(rect.left, rect.top, 50, 50);
                fab.style.right = 'auto';
                fab.style.bottom = 'auto';
                fab.style.left = `${c.x}px`;
                fab.style.top = `${c.y}px`;
                if (!pop.classList.contains('hidden')) {
                    positionPopoverNearFab();
                }
            });
        }

        /* =========================================================
           13. JSON 備份匯出與還原匯入
           ========================================================= */
        function exportJsonBackup() {
            const payload = {
                exportedAt: new Date().toISOString(),
                folders,
                documents
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const dateTag = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            a.href = url;
            a.download = `法規公文備份_${dateTag}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('已匯出純文字備份檔', 'success');
        }

        async function importJsonBackup(file) {
            if (!file) return;
            try {
                const text = await file.text();
                const parsed = JSON.parse(text);

                if (Array.isArray(parsed.folders)) {
                    for (const f of parsed.folders) {
                        if (f && f.id && f.name) {
                            if (!folders.some(existing => existing.id === f.id)) {
                                folders.push(f);
                            }
                            await dbPut(STORE_FOLDERS, f);
                        }
                    }
                }

                const docList = Array.isArray(parsed.documents)
                    ? parsed.documents
                    : (Array.isArray(parsed.regulations) ? parsed.regulations : []);

                let count = 0;
                for (const item of docList) {
                    if (item && item.title && Array.isArray(item.pages)) {
                        const targetFid = (item.folderId && folders.some(f => f.id === item.folderId))
                            ? item.folderId
                            : UNCATEGORIZED_FOLDER_ID;

                        const cleanPages = item.pages.map((p, idx) => ({
                            pageNumber: p.pageNumber || (idx + 1),
                            text: p.text || ''
                        }));

                        const doc = {
                            id: item.id || ('doc-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7)),
                            folderId: targetFid,
                            title: String(item.title),
                            coreName: item.coreName || extractCoreName(String(item.title)),
                            isOcr: Boolean(item.isOcr || item.docType === 'image'),
                            starredClauses: Array.isArray(item.starredClauses) ? item.starredClauses : [],
                            updatedAt: item.updatedAt || item.uploadedAt || new Date().toLocaleDateString('zh-TW'),
                            isRecentlyUpdated: Boolean(item.isRecentlyUpdated),
                            pages: cleanPages
                        };

                        const idx = documents.findIndex(d => d.id === doc.id);
                        if (idx !== -1) documents[idx] = doc;
                        else documents.push(doc);
                        await dbPut(STORE_DOCS, doc);
                        count++;
                    }
                }
                sortDocuments();
                renderCurrentView();
                showToast(`已成功還原 ${count} 份文件`, 'success');
            } catch (e) {
                showToast('備份檔案格式不正確', 'error');
            }
        }

        /* =========================================================
           14. 應用程式初始化與所有事件綁定
           ========================================================= */
        async function initApp() {
            const savedFont = await loadPreference('font_scale', 'large');
            applyFontScale(savedFont);

            const storedFolders = await dbGetAll(STORE_FOLDERS);
            if (storedFolders.length > 0) {
                folders = storedFolders;
                if (!folders.some(f => f.id === UNCATEGORIZED_FOLDER_ID)) {
                    const uncat = DEFAULT_FOLDERS[0];
                    folders.unshift(uncat);
                    await dbPut(STORE_FOLDERS, uncat);
                }
            } else {
                folders = [...DEFAULT_FOLDERS];
                for (const f of folders) {
                    await dbPut(STORE_FOLDERS, f);
                }
            }

            const storedDocs = await dbGetAll(STORE_DOCS);
            if (storedDocs.length > 0) {
                documents = storedDocs.map(d => ({
                    ...d,
                    starredClauses: Array.isArray(d.starredClauses) ? d.starredClauses : [],
                    folderId: (d.folderId && folders.some(f => f.id === d.folderId)) ? d.folderId : UNCATEGORIZED_FOLDER_ID
                }));
            } else {
                documents = [...SAMPLE_DOCS];
                for (const d of documents) {
                    await dbPut(STORE_DOCS, d);
                }
            }

            sortDocuments();
            initHistoryNavigation();
            renderCurrentView();
            initDraggableFloatingControls();

            // 頂部標題點擊回到封面
            document.getElementById('brandHomeBtn').addEventListener('click', () => {
                activeDocId = null;
                activeFolderId = null;
                isStarredPageActive = false;
                globalQuery = '';
                pushNavigationState();
                renderCurrentView();
            });

            // 重要法條收藏分頁入口（封面卡片 + 頂部 ★ 圖示）
            const openStarredCollectionPage = () => {
                activeDocId = null;
                activeFolderId = null;
                isStarredPageActive = true;
                globalQuery = '';
                pushNavigationState();
                renderCurrentView();
            };

            document.getElementById('openStarredPageCard').addEventListener('click', openStarredCollectionPage);
            document.getElementById('headerStarPageBtn').addEventListener('click', () => {
                if (isStarredPageActive && !activeDocId) {
                    isStarredPageActive = false;
                    pushNavigationState();
                    renderCurrentView();
                } else {
                    openStarredCollectionPage();
                }
            });

            document.getElementById('backFromStarredBtn').addEventListener('click', () => {
                if (window.history.state && window.history.state.isStarredPageActive) {
                    window.history.back();
                } else {
                    isStarredPageActive = false;
                    renderCurrentView();
                }
            });

            // 搜尋結果列一鍵清除篩選
            document.getElementById('resetGlobalFilterBtn').addEventListener('click', () => {
                globalQuery = '';
                renderCurrentView();
                toggleFabPopover(false);
            });

            // 字級切換
            document.querySelectorAll('.font-pill-btn').forEach(btn => {
                btn.addEventListener('click', () => applyFontScale(btn.getAttribute('data-font-btn')));
            });

            // 匯出與匯入備份
            document.getElementById('exportBackupBtn').addEventListener('click', exportJsonBackup);
            document.getElementById('importBackupInput').addEventListener('change', async (e) => {
                if (e.target.files && e.target.files[0]) {
                    await importJsonBackup(e.target.files[0]);
                }
                e.target.value = '';
            });

            // 封面「新增資料夾」圖示按鈕
            document.getElementById('openNewFolderModalBtn').addEventListener('click', async () => {
                const name = await openFolderInputModal('新增資料夾', '請輸入新的分類資料夾名稱：');
                if (name) {
                    const newFolder = {
                        id: 'folder-' + Date.now(),
                        name,
                        kind: name.includes('公文') ? 'official' : 'normal'
                    };
                    folders.push(newFolder);
                    await dbPut(STORE_FOLDERS, newFolder);
                    renderCurrentView();
                    showToast(`已建立資料夾「${name}」`, 'success');
                }
            });

            // 封面單一精簡批次上傳小圖示（自動歸入「未分類 / 一般法規」）
            document.getElementById('coverBatchFileInput').addEventListener('change', async (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    await processBatchFiles(e.target.files, UNCATEGORIZED_FOLDER_ID);
                    activeFolderId = UNCATEGORIZED_FOLDER_ID;
                    pushNavigationState();
                    renderCurrentView();
                }
                e.target.value = '';
            });

            // 資料夾內返回封面與批次上傳
            document.getElementById('backToFoldersBtn').addEventListener('click', () => {
                if (window.history.state && window.history.state.activeFolderId) {
                    window.history.back();
                } else {
                    activeFolderId = null;
                    renderCurrentView();
                }
            });

            document.getElementById('batchFileInput').addEventListener('change', async (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    await processBatchFiles(e.target.files, activeFolderId || UNCATEGORIZED_FOLDER_ID);
                }
                e.target.value = '';
            });

            // 閱讀模式工具列事件
            document.getElementById('backFromReaderBtn').addEventListener('click', closeReaderView);

            document.getElementById('readerFolderSelect').addEventListener('change', async (e) => {
                const doc = documents.find(d => d.id === activeDocId);
                if (!doc) return;
                doc.folderId = e.target.value;
                activeFolderId = doc.folderId;
                await dbPut(STORE_DOCS, doc);
                showToast(`已移動至「${getFolderNameById(doc.folderId)}」`, 'success');
            });

            document.getElementById('copyFullDocBtn').addEventListener('click', async () => {
                const doc = documents.find(d => d.id === activeDocId);
                if (!doc) return;
                const fullText = `${doc.title}\n\n` + doc.pages.map(p => reflowRegulationText(p.text)).join('\n\n');
                const ok = await copyToClipboard(fullText);
                if (ok) {
                    const btn = document.getElementById('copyFullDocBtn');
                    const icon = document.getElementById('copyFullDocIcon');
                    btn.classList.remove('primary');
                    btn.classList.add('success-solid');
                    icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>';
                    showToast('已複製全文', 'success');
                    setTimeout(() => {
                        btn.classList.remove('success-solid');
                        btn.classList.add('primary');
                        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>';
                    }, 1800);
                }
            });

            document.getElementById('toggleEditDocBtn').addEventListener('click', () => {
                const doc = documents.find(d => d.id === activeDocId);
                if (!doc) return;
                isEditingDocText = !isEditingDocText;
                renderReaderContent(doc, readerQuery);
            });

            document.getElementById('singleUpdateInput').addEventListener('change', async (e) => {
                const doc = documents.find(d => d.id === activeDocId);
                if (doc && e.target.files && e.target.files[0]) {
                    await processBatchFiles([e.target.files[0]], doc.folderId, doc.id);
                }
                e.target.value = '';
            });

            document.getElementById('readerDeleteBtn').addEventListener('click', async () => {
                const doc = documents.find(d => d.id === activeDocId);
                if (!doc) return;
                const ok = await showConfirmModal(
                    '整份刪除此法規',
                    `確定要刪除《${doc.title}》嗎？刪除後無法復原。`,
                    '確定刪除',
                    true
                );
                if (ok) {
                    await dbDelete(STORE_DOCS, doc.id);
                    documents = documents.filter(d => d.id !== doc.id);
                    showToast('已整份刪除此文件');
                    closeReaderView();
                }
            });

            // 全站懸浮搜尋視窗事件
            document.getElementById('fabCloseBtn').addEventListener('click', () => {
                toggleFabPopover(false);
            });

            const fabInput = document.getElementById('fabSearchInput');
            fabInput.addEventListener('input', () => {
                if (activeDocId) {
                    readerQuery = fabInput.value;
                    const doc = documents.find(d => d.id === activeDocId);
                    if (doc) {
                        renderReaderContent(doc, readerQuery);
                        if (readerMatches.length > 0) highlightActiveMatch(0, true);
                    }
                } else {
                    globalQuery = fabInput.value;
                    renderCurrentView();
                    positionPopoverNearFab();
                }
            });

            document.getElementById('fabClearBtn').addEventListener('click', () => {
                fabInput.value = '';
                if (activeDocId) {
                    readerQuery = '';
                    const doc = documents.find(d => d.id === activeDocId);
                    if (doc) renderReaderContent(doc, '');
                } else {
                    globalQuery = '';
                    renderCurrentView();
                    positionPopoverNearFab();
                }
                fabInput.focus();
            });

            document.getElementById('fabPrevBtn').addEventListener('click', () => {
                highlightActiveMatch(currentMatchIdx - 1, true);
            });

            document.getElementById('fabNextBtn').addEventListener('click', () => {
                highlightActiveMatch(currentMatchIdx + 1, true);
            });

            ensurePdfJsLoaded();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
