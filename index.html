<!DOCTYPE html>
<html lang="zh-Hant" data-font-scale="large">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法規與公文檢索系統</title>
    <style>
        :root {
            --bg-page: #f6f5f2;
            --bg-card: #ffffff;
            --bg-subtle: #efede8;
            --text-primary: #1c1c1a;
            --text-secondary: #57564f;
            --text-muted: #87857d;
            --border-color: #d9d6ce;
            --border-light: #e8e6df;
            --brand-primary: #1d5a9a;
            --brand-hover: #174a80;
            --brand-soft: #e9f1f9;
            --brand-border: #b9d3ec;
            --danger-color: #b42318;
            --danger-soft: #fdeceb;
            --danger-border: #f3c3bf;
            --success-color: #2b7a4b;
            --success-soft: #e9f5ee;
            --success-border: #b8dfc7;
            --amber-star: #c98a10;
            --amber-soft: #fbf2de;
            --amber-border: #efd9a3;
            --folder-color: #a8741a;
            --radius-lg: 14px;
            --radius-md: 10px;
            --radius-sm: 8px;
            --shadow-bar: 0 -2px 12px rgba(28, 28, 26, 0.06);

            --reader-font-size: 20px;
            --reader-line-height: 1.75;
            --list-title-size: 17px;
        }

        html[data-font-scale="normal"] {
            --reader-font-size: 16px;
            --reader-line-height: 1.7;
            --list-title-size: 15px;
        }

        html[data-font-scale="large"] {
            --reader-font-size: 20px;
            --reader-line-height: 1.75;
            --list-title-size: 17px;
        }

        html[data-font-scale="xlarge"] {
            --reader-font-size: 24px;
            --reader-line-height: 1.8;
            --list-title-size: 19px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
            overflow-x: hidden;
        }

        button, input, textarea, select {
            font-family: inherit;
            color: inherit;
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
        }

        .hidden {
            display: none !important;
        }

        /* ---------- 頂部列 ---------- */
        .app-header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 0;
            z-index: 60;
        }

        .header-inner {
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 12px;
        }

        .brand-btn {
            font-size: 17px;
            font-weight: 800;
            white-space: nowrap;
            padding: 4px 2px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .font-pill-group {
            display: inline-flex;
            background-color: var(--bg-subtle);
            border-radius: 10px;
            padding: 2px;
            gap: 2px;
        }

        .font-pill-btn {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 5px 7px;
            border-radius: 8px;
            white-space: nowrap;
        }

        .font-pill-btn.active {
            background-color: var(--bg-card);
            color: var(--text-primary);
            font-weight: 800;
            box-shadow: 0 0 0 1px var(--border-color);
        }

        .icon-btn {
            position: relative;
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            color: var(--text-primary);
            flex-shrink: 0;
        }

        .icon-btn:active {
            background-color: var(--bg-subtle);
        }

        .icon-btn.active,
        .icon-btn.star-toggle.on {
            background-color: var(--amber-soft);
            border-color: var(--amber-border);
            color: var(--amber-star);
        }

        .icon-btn.danger {
            color: var(--danger-color);
            border-color: var(--danger-border);
            background-color: var(--danger-soft);
        }

        .count-dot {
            position: absolute;
            top: -6px;
            right: -6px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 999px;
            background-color: var(--amber-star);
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ---------- 選單 ---------- */
        .menu-wrap {
            position: relative;
        }

        .menu-panel {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            z-index: 90;
            min-width: 250px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 28px rgba(28, 28, 26, 0.16);
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .menu-item {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            padding: 12px 10px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
        }

        .menu-item:active {
            background-color: var(--bg-subtle);
        }

        .menu-item.danger {
            color: var(--danger-color);
        }

        .menu-note {
            font-size: 12px;
            color: var(--text-muted);
            padding: 2px 10px 8px;
            line-height: 1.5;
        }

        .menu-sep {
            height: 1px;
            background-color: var(--border-light);
            margin: 4px 2px;
        }

        .menu-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 10px;
        }

        .menu-label {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .menu-select {
            height: 34px;
            max-width: 160px;
            padding: 0 6px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            font-size: 13px;
            font-weight: 600;
        }

        .menu-file {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* ---------- 主容器 ---------- */
        .main-container {
            max-width: 760px;
            margin: 0 auto;
            padding: 14px 12px 96px 12px;
        }

        .progress-panel {
            background-color: var(--brand-soft);
            border: 1px solid var(--brand-border);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .progress-text {
            font-size: 13px;
            font-weight: 700;
            color: var(--brand-primary);
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background-color: #d6e5f4;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: var(--brand-primary);
            transition: width 0.2s ease;
        }

        /* ---------- 儲匯／郵務頁籤 ---------- */
        .seg {
            display: flex;
            gap: 4px;
            background-color: var(--bg-subtle);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 14px;
        }

        .seg button {
            flex: 1;
            height: 42px;
            border-radius: 9px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .seg button.on {
            background-color: var(--bg-card);
            color: var(--text-primary);
            font-weight: 800;
            box-shadow: 0 0 0 1px var(--border-color);
        }

        .seg-count {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* ---------- 區塊標題與清單 ---------- */
        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin: 20px 2px 8px;
        }

        .section-head:first-of-type {
            margin-top: 4px;
        }

        .section-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.02em;
        }

        .text-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            font-weight: 700;
            color: var(--brand-primary);
            padding: 6px 8px;
            border-radius: 8px;
            cursor: pointer;
        }

        .text-btn:active {
            background-color: var(--brand-soft);
        }

        .list {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border-top: 1px solid var(--border-light);
            cursor: pointer;
        }

        .row:first-child {
            border-top: none;
        }

        .row:active {
            background-color: var(--bg-subtle);
        }

        .row-icon {
            display: flex;
            color: var(--text-muted);
        }

        .row.folder .row-icon {
            color: var(--folder-color);
        }

        .row-main {
            flex: 1;
            min-width: 0;
        }

        .row-title {
            font-size: var(--list-title-size);
            font-weight: 600;
            line-height: 1.4;
            word-break: break-word;
        }

        .row-sub {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .row-chevron {
            color: var(--text-muted);
            display: flex;
        }

        .row-snippet {
            margin-top: 8px;
            padding: 8px 10px;
            background-color: var(--bg-page);
            border-left: 3px solid var(--brand-primary);
            border-radius: 0 8px 8px 0;
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            word-break: break-word;
        }

        .empty-line {
            padding: 22px 16px;
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.7;
            white-space: pre-line;
            cursor: default;
        }

        .star-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .star-btn.on {
            background-color: var(--amber-soft);
            color: var(--amber-star);
            border-color: var(--amber-border);
        }

        .badge-tag {
            font-size: 11px;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 6px;
        }

        .badge-ocr {
            background-color: var(--brand-soft);
            color: var(--brand-primary);
            border: 1px solid var(--brand-border);
        }

        .badge-updated {
            background-color: var(--success-soft);
            color: var(--success-color);
            border: 1px solid var(--success-border);
        }

        .badge-folder {
            background-color: var(--amber-soft);
            color: var(--folder-color);
            border: 1px solid var(--amber-border);
        }

        /* ---------- 子頁工具列 ---------- */
        .toolbar-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 10px 12px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .heading-wrap {
            min-width: 0;
            flex: 1;
        }

        .heading {
            font-size: calc(var(--list-title-size) + 1px);
            font-weight: 800;
            line-height: 1.3;
            word-break: break-word;
        }

        .heading-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .result-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin: 2px 2px 10px;
        }

        .upload-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 36px;
            padding: 0 12px;
            background-color: var(--brand-primary);
            color: #ffffff;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
        }

        /* ---------- 閱讀頁 ---------- */
        .reader-header-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 10px 12px;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .reader-toolbar-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .reader-toolbar-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .reader-title-block {
            border-top: 1px solid var(--border-light);
            padding-top: 10px;
        }

        .reader-crumb {
            font-size: 12px;
            font-weight: 700;
            color: var(--folder-color);
            margin-bottom: 4px;
        }

        .reader-doc-title {
            font-size: calc(var(--list-title-size) + 2px);
            font-weight: 800;
            line-height: 1.4;
            word-break: break-word;
        }

        .reader-doc-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .page-section {
            margin-bottom: 14px;
        }

        .page-divider {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin: 0 0 6px 4px;
        }

        .chapter-banner {
            background-color: var(--brand-soft);
            border-left: 4px solid var(--brand-primary);
            color: var(--brand-hover);
            padding: 10px 14px;
            margin: 16px 0 8px 0;
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            font-size: calc(var(--reader-font-size) + 1px);
            font-weight: 800;
            line-height: 1.45;
            word-break: break-word;
        }

        .chapter-banner.sub-section {
            background-color: var(--bg-subtle);
            border-left-color: var(--text-muted);
            color: var(--text-primary);
            font-size: var(--reader-font-size);
            padding: 8px 12px;
            margin: 12px 0 8px 0;
        }

        .article-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 15px;
            margin-bottom: 10px;
            position: relative;
        }

        .article-card-actions {
            float: right;
            margin: 0 0 4px 10px;
        }

        .article-mini-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            background-color: var(--bg-page);
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .article-mini-btn.copied {
            color: var(--success-color);
            border-color: var(--success-border);
            background-color: var(--success-soft);
        }

        .clause-structured-body {
            font-size: var(--reader-font-size);
            line-height: var(--reader-line-height);
            word-break: break-word;
        }

        .clause-article-heading {
            display: inline-block;
            font-weight: 800;
            color: var(--brand-primary);
            background-color: var(--brand-soft);
            border: 1px solid var(--brand-border);
            padding: 1px 8px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: calc(var(--reader-font-size) - 1px);
        }

        .clause-line-main {
            margin-bottom: 10px;
        }

        .clause-line-lvl1 {
            padding-left: 2em;
            text-indent: -2em;
            margin: 12px 0 8px 0;
        }

        .clause-line-lvl2 {
            margin-left: 1em;
            padding-left: 3em;
            text-indent: -3em;
            margin-bottom: 8px;
            color: #2a2a27;
        }

        .clause-line-lvl3 {
            margin-left: 2em;
            padding-left: 2em;
            text-indent: -2em;
            margin-bottom: 7px;
            color: #3d3d39;
        }

        .clause-line-lvl4 {
            margin-left: 3em;
            padding-left: 2.6em;
            text-indent: -2.6em;
            margin-bottom: 6px;
            color: #55544e;
        }

        .toc-line {
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-light);
            font-size: calc(var(--reader-font-size) - 2px);
            line-height: 1.5;
        }

        .toc-line.toc-chapter {
            font-weight: 800;
            color: var(--brand-primary);
            padding-top: 14px;
        }

        .toc-title {
            flex: 1;
            min-width: 0;
            word-break: break-word;
        }

        .toc-page {
            flex-shrink: 0;
            min-width: 2em;
            text-align: center;
            font-size: 0.82em;
            color: var(--text-muted);
            background-color: var(--bg-subtle);
            border-radius: 6px;
            padding: 0 7px;
        }

        .inline-edit-textarea {
            width: 100%;
            min-height: 200px;
            padding: 10px;
            border: 1.5px solid var(--brand-primary);
            border-radius: var(--radius-sm);
            font-size: var(--reader-font-size);
            line-height: var(--reader-line-height);
            background-color: #ffffff;
            resize: vertical;
            outline: none;
        }

        .inline-edit-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 8px;
        }

        mark.hl-match {
            background-color: #fde68a;
            color: inherit;
            padding: 0 2px;
            border-radius: 3px;
        }

        mark.hl-match.active-match {
            background-color: #d9480f;
            color: #ffffff;
            font-weight: 700;
        }

        /* ---------- 底部搜尋列 ---------- */
        .bottom-search-dock {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 80;
            background-color: rgba(255, 255, 255, 0.98);
            border-top: 1px solid var(--border-color);
            box-shadow: var(--shadow-bar);
            padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)) 12px;
        }

        .bottom-search-inner {
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dock-input-wrap {
            position: relative;
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
        }

        .dock-search-icon {
            position: absolute;
            left: 11px;
            color: var(--text-muted);
            pointer-events: none;
            display: flex;
        }

        .dock-search-input {
            width: 100%;
            height: 42px;
            padding: 0 34px 0 36px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 15px;
            background-color: var(--bg-page);
            outline: none;
        }

        .dock-search-input:focus {
            background-color: #ffffff;
            border-color: var(--brand-primary);
        }

        .dock-clear-btn {
            position: absolute;
            right: 7px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: var(--border-light);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dock-reader-nav {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .dock-counter {
            font-size: 12px;
            font-weight: 800;
            color: #9a3412;
            background-color: #fff4ea;
            border: 1px solid #f6d3b5;
            padding: 0 8px;
            height: 38px;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
        }

        .dock-step-btn {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            background-color: var(--bg-subtle);
            border: 1px solid var(--border-color);
            font-size: 13px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* ---------- Toast 與對話框 ---------- */
        .toast-box {
            position: fixed;
            top: 62px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1100;
            background-color: #1c1c1a;
            color: #ffffff;
            padding: 9px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            max-width: calc(100vw - 24px);
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .toast-box.show {
            opacity: 1;
        }

    <script>
        /* =========================================================
           1. 動態背景載入外部解析引擎（非阻塞）
           ========================================================= */
        let pdfLibReadyPromise = null;
        let tesseractReadyPromise = null;

        function loadExternalScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.async = true;
                s.onload = () => resolve(true);
                s.onerror = () => reject(new Error('無法載入外部腳本：' + src));
                document.head.appendChild(s);
            });
        }

        function ensurePdfJsLoaded() {
            if (window.pdfjsLib) return Promise.resolve(true);
            if (!pdfLibReadyPromise) {
                pdfLibReadyPromise = loadExternalScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js')
                    .then(() => {
                        if (window.pdfjsLib) {
                            pdfjsLib.GlobalWorkerOptions.workerSrc =
                                'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                            return true;
                        }
                        return false;
                    })
                    .catch(() => {
                        pdfLibReadyPromise = null;
                        return false;
                    });
            }
            return pdfLibReadyPromise;
        }

        function ensureTesseractLoaded() {
            if (window.Tesseract) return Promise.resolve(true);
            if (!tesseractReadyPromise) {
                tesseractReadyPromise = loadExternalScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js')
                    .then(() => Boolean(window.Tesseract))
                    .catch(() => {
                        tesseractReadyPromise = null;
                        return false;
                    });
            }
            return tesseractReadyPromise;
        }

        /* =========================================================
           2. 分類、預設資料夾與狀態
           資料結構：
             folder  { id, name, kind, domain: 's'(儲匯) | 'm'(郵務) }
             doc     { id, domain, folderId(null=單一規章), title, starred(整份收藏), pages... }
           ========================================================= */
        const UNCATEGORIZED_FOLDER_ID = 'folder-uncategorized'; // 舊版「未分類」，只用於資料遷移
        const DOMAIN_LABEL = { s: '儲匯', m: '郵務' };

        const DEFAULT_FOLDERS = [
            { id: 'folder-01', name: '01儲金業務作業規章', kind: 'normal', domain: 's' },
            { id: 'folder-02', name: '02劃撥業務作業規章', kind: 'normal', domain: 's' },
            { id: 'folder-03', name: '03匯兌業務作業規章', kind: 'normal', domain: 's' },
            { id: 'folder-04', name: '04代辦業務作業規章', kind: 'normal', domain: 's' },
            { id: 'folder-05', name: '05自動化業務作業規章', kind: 'normal', domain: 's' },
            { id: 'folder-official', name: '重要公文', kind: 'official', domain: 's' },
            { id: 'folder-official-postal', name: '重要公文', kind: 'official', domain: 'm' }
        ];

        const SAMPLE_DOCS = [
            {
                id: 'sample-doc-1',
                domain: 's',
                folderId: 'folder-01',
                title: '1-01郵政儲金匯兌法（範例）',
                coreName: '郵政儲金匯兌法',
                isOcr: false,
                starred: false,
                updatedAt: new Date().toLocaleDateString('zh-TW'),
                isRecentlyUpdated: false,
                pages: [
                    {
                        pageNumber: 1,
                        text: '第一章 總則\n第一條\n為鼓勵國民儲蓄，促進資本形成，配合國家政策，並增進民眾生活便利，保障郵政儲金匯兌安全，特制定本法；本法未規定者，依其他法律之規定。\n\n第二條\n郵政儲金匯兌事務，由中華郵政股份有限公司（以下簡稱中華郵政公司）辦理，屬交通部主管，業務並受金融監督管理委員會監督；其涉及外匯業務經營者，應經中央銀行許可。'
                    },
                    {
                        pageNumber: 2,
                        text: '第三條\n郵政儲金之種類如下：\n一、存簿儲金：指憑郵政儲金簿或依約定方式，隨時存入或提取之儲金。\n二、定期儲金：指有一定時期之限制，憑存單或依約定方式提取之儲金。\n三、劃撥儲金：指照郵政劃撥方式，憑郵政劃撥儲金帳戶辦理存款、提款、匯款、撥款及接受轉帳等業務之儲金。'
                    }
                ]
            }
        ];

        let folders = [];
        let documents = [];
        let activeDomain = 's';
        let activeFolderId = null;
        let activeDocId = null;
        let isFavPageActive = false;
        let globalQuery = '';
        let readerQuery = '';
        let readerMatches = [];
        let currentMatchIdx = -1;
        let isEditingDocText = false;
        let toastTimer = null;
        let quotaWarned = false;
        let isHandlingPopState = false;

        /* =========================================================
           3. IndexedDB 永久持久化儲存（鎖定版本直到手動更新或刪除）
           ========================================================= */
        const DB_NAME = 'RegDocDB_v1';
        const DB_VERSION = 1;
        const STORE_DOCS = 'documents';
        const STORE_FOLDERS = 'folders';
        const STORE_PREFS = 'preferences';
        let idbAvailable = true;

        async function requestPersistentStorage() {
            try {
                if (navigator.storage && navigator.storage.persist) {
                    const already = await navigator.storage.persisted();
                    if (!already) {
                        await navigator.storage.persist();
                    }
                }
            } catch (e) {}
        }

        function openDB() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) {
                    idbAvailable = false;
                    return reject(new Error('IndexedDB unavailable'));
                }
                try {
                    const req = indexedDB.open(DB_NAME, DB_VERSION);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(STORE_DOCS)) {
                            db.createObjectStore(STORE_DOCS, { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains(STORE_FOLDERS)) {
                            db.createObjectStore(STORE_FOLDERS, { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains(STORE_PREFS)) {
                            db.createObjectStore(STORE_PREFS, { keyPath: 'key' });
                        }
                    };
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => {
                        idbAvailable = false;
                        reject(req.error);
                    };
                } catch (err) {
                    idbAvailable = false;
                    reject(err);
                }
            });
        }

        function syncFallbackStorage() {
            if (idbAvailable) return;
            try {
                localStorage.setItem('regdocdb_v1_folders', JSON.stringify(folders));
                localStorage.setItem('regdocdb_v1_documents', JSON.stringify(documents));
            } catch (e) {
                if (!quotaWarned) {
                    quotaWarned = true;
                    showToast('本機暫存空間已滿，請立即匯出 JSON 備份以防遺失', 'error');
                }
            }
        }

        async function dbGetAll(storeName) {
            try {
                const db = await openDB();
                return await new Promise((resolve) => {
                    const tx = db.transaction(storeName, 'readonly');
                    const req = tx.objectStore(storeName).getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => resolve([]);
                });
            } catch (e) {
                try {
                    const key = storeName === STORE_FOLDERS ? 'regdocdb_v1_folders' : 'regdocdb_v1_documents';
                    const raw = localStorage.getItem(key);
                    return raw ? JSON.parse(raw) : [];
                } catch (err) {
                    return [];
                }
            }
        }

        async function dbPut(storeName, item) {
            if (!idbAvailable) {
                syncFallbackStorage();
                return;
            }
            try {
                const db = await openDB();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, 'readwrite');
                    tx.objectStore(storeName).put(item);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            } catch (e) {
                idbAvailable = false;
                syncFallbackStorage();
            }
        }

        async function dbDelete(storeName, key) {
            if (!idbAvailable) {
                syncFallbackStorage();
                return;
            }
            try {
                const db = await openDB();
                await new Promise((resolve, reject) => {
                    const tx = db.transaction(storeName, 'readwrite');
                    tx.objectStore(storeName).delete(key);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            } catch (e) {
                idbAvailable = false;
                syncFallbackStorage();
            }
        }

        async function savePreference(key, value) {
            try {
                localStorage.setItem('regdocdb_pref_' + key, JSON.stringify(value));
            } catch (e) {}
            if (!idbAvailable) return;
            try {
                const db = await openDB();
                await new Promise((resolve) => {
                    const tx = db.transaction(STORE_PREFS, 'readwrite');
                    tx.objectStore(STORE_PREFS).put({ key, value });
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => resolve();
                });
            } catch (e) {}
        }

        async function loadPreference(key, fallback) {
            try {
                const db = await openDB();
                const val = await new Promise((resolve) => {
                    const tx = db.transaction(STORE_PREFS, 'readonly');
                    const req = tx.objectStore(STORE_PREFS).get(key);
                    req.onsuccess = () => resolve(req.result ? req.result.value : null);
                    req.onerror = () => resolve(null);
                });
                if (val !== null && val !== undefined) return val;
            } catch (e) {}
            try {
                const raw = localStorage.getItem('regdocdb_pref_' + key);
                return raw !== null ? JSON.parse(raw) : fallback;
            } catch (e) {
                return fallback;
            }
        }

        /* =========================================================
           4. 瀏覽器歷史紀錄同步（按手機返回鍵逐層返回，不跳出網頁）
           ========================================================= */
        function pushNavigationState() {
            if (isHandlingPopState) return;
            try {
                window.history.pushState({
                    activeDomain,
                    activeFolderId,
                    activeDocId,
                    isFavPageActive,
                    globalQuery
                }, '');
            } catch (e) {}
        }

        function initHistoryNavigation() {
            try {
                window.history.replaceState({
                    activeDomain,
                    activeFolderId: null,
                    activeDocId: null,
                    isFavPageActive: false,
                    globalQuery: ''
                }, '');
            } catch (e) {}

            window.addEventListener('popstate', (e) => {
                isHandlingPopState = true;
                try {
                    if (e.state) {
                        activeDomain = e.state.activeDomain === 'm' ? 'm' : 's';
                        activeDocId = e.state.activeDocId || null;
                        activeFolderId = e.state.activeFolderId || null;
                        isFavPageActive = Boolean(e.state.isFavPageActive);
                        globalQuery = e.state.globalQuery || '';
                    } else {
                        activeDocId = null;
                        activeFolderId = null;
                        isFavPageActive = false;
                        globalQuery = '';
                    }

                    isEditingDocText = false;
                    if (activeDocId) {
                        renderReaderPage(activeDocId, readerQuery);
                    } else {
                        renderCurrentView();
                    }
                } finally {
                    isHandlingPopState = false;
                }
            });
        }

        /* =========================================================
           5. 標題名稱清理（自動刪除「上傳內部資訊網」與副檔名）
           ========================================================= */
        function cleanDisplayTitle(rawFilename) {
            let name = String(rawFilename || '').trim();
            // 去除常見副檔名
            name = name.replace(/\.(pdf|txt|md|jpg|jpeg|png|webp)$/i, '');
            // 去除後方「上傳內部資訊網」各種括號或連字號寫法
            name = name.replace(/[\s\-_（(【\[]*上傳內部資訊網[\s\-_）)】\]]*$/g, '');
            name = name.replace(/上傳內部資訊網/g, '');
            return name.trim() || String(rawFilename || '');
        }

        function extractCoreName(filename) {
            let name = cleanDisplayTitle(filename);
            name = name.replace(/^[\d]+[-_.\s]+[\d]*[-_.\s]*/, '');
            name = name.replace(/[-_（(](範例|修正|最新|\d{6,8}).*$/g, '');
            return name.trim() || cleanDisplayTitle(filename);
        }

        /* =========================================================
           6. 文字排版與多層級大標拆解引擎（大標橫幅 / 條號 / 款 / 目縮排）
           ========================================================= */
        const CHAPTER_MAJOR_REGEX = /^第\s*[一二三四五六七八九十百千0-9]+\s*[編章]\s*.*$/;
        const SECTION_MINOR_REGEX = /^(第\s*[一二三四五六七八九十百千0-9]+\s*[節款目]\s*.*|附\s*則|總\s*則)$/;
        const ARTICLE_HEADER_REGEX = /^第\s*[一二三四五六七八九十百千0-9]+\s*條(?:之[一二三四五六七八九十0-9]+)?/;

        /* ---------- 匯入文字清理：字距空格、目錄引導點 ---------- */
        const SINGLE_TOK = '[\\u3400-\\u9fff\\uf900-\\ufaff0-9\\-－—（）()「」『』，。、；：！？]';
        const SPACED_RUN_RE = new RegExp('(^|[ \\t])(' + SINGLE_TOK + '(?:[ \\t]+' + SINGLE_TOK + '){3,})(?=[ \\t]|$)', 'gm');
        const TOC_MARK_RE = /⋯ p\.\d+/g;
        const TOC_ENTRY_START_RE = /^(第\s*[一二三四五六七八九十百千0-9]+\s*[編章節款目條]|[一二三四五六七八九十]+、|附\s*則|附\s*錄|總\s*則)/;
        const ARTICLE_ONLY_REGEX = /^第\s*[一二三四五六七八九十百千0-9]+\s*條(?:之[一二三四五六七八九十0-9]+)?$/;

        function isTocText(t) {
            return ((t || '').match(TOC_MARK_RE) || []).length >= 3;
        }

        function normalizeExtractedText(raw) {
            let s = String(raw || '').replace(/ |　/g, ' ');

            // 1. 目錄引導點（……、．．．、.....，可跨行）→ 單一標記
            s = s.replace(/[ \t]*(?:[.．‧·…][ \t\n]*){4,}/g, ' ⋯ ');
            // 2. 引導點後接的頁碼（- 7 - 或 7）→ p.7 並強制換行
            s = s.replace(/⋯[ \t]*[-－—–][ \t]*(\d{1,4})[ \t]*[-－—–]/g, '⋯ p.$1\n');
            s = s.replace(/⋯[ \t]*(\d{1,4})[ \t]*(?=\n|$)/gm, '⋯ p.$1');
            // 3. 沒有頁碼的殘留標記直接拿掉
            s = s.replace(/[ \t]*⋯(?! p\.\d)[ \t]*/g, ' ');

            // 4. 字距排版造成的「字 與 字 之 間 都 有 空 格」：連續 4 個以上單字元才處理
            s = s.replace(SPACED_RUN_RE, (m, pre, run) => pre + run.replace(/[ \t]+/g, ''));

            // 5. 全形標點前後多餘空格、「1 、」→「1、」
            s = s.replace(/[ \t]+([、，。；：！？）」』〕])/g, '$1');
            s = s.replace(/([（「『〔])[ \t]+/g, '$1');
            s = s.replace(/^(\d{1,3})[ \t]+([、.．])/gm, '$1$2');

            // 6. 年月日、頁、條 與數字之間多餘的空格（115 年 9 月 → 115年9月）
            s = s.replace(/(\d)[ \t]+(?=[年月日頁條項款目號元％%])/g, '$1');
            s = s.replace(/([第共年月日])[ \t]+(?=\d)/g, '$1');

            // 7. 長句中文字之間零散的空格（標題行不動）
            s = s.split('\n').map(line => {
                if (line.length < 20) return line;
                if (/^\s*(第\s*[一二三四五六七八九十百千0-9]+\s*[編章節款目條]|附\s*則|總\s*則)/.test(line)) return line;
                return line.replace(/([\u3400-\u9fff）〕」』，。；：、])[ \t]+(?=[\u3400-\u9fff（〔「『])/g, '$1');
            }).join('\n');

            return s;
        }

        const reflowCache = new Map();

        function reflowRegulationText(rawText) {
            if (!rawText) return '';
            if (reflowCache.has(rawText)) return reflowCache.get(rawText);
            const out = reflowRegulationTextCore(rawText);
            if (reflowCache.size > 4000) reflowCache.clear();
            reflowCache.set(rawText, out);
            return out;
        }

        function bracketDepth(s) {
            let d = 0;
            for (const ch of s.slice(-150)) {
                if ('（(「『〔['.includes(ch)) d++;
                else if ('）)」』〕]'.includes(ch)) d = Math.max(0, d - 1);
            }
            return d;
        }

        function endsSentence(line) {
            return /[。；：！？][」』）)〕\]]*$/.test(line) && bracketDepth(line) === 0;
        }

        const ITEM_FIRST_RE = /^(一、|（一）|\(一\)|1[、.．]|（1）|\(1\)|①)/;
        const ITEM_ANY_RE = /^([一二三四五六七八九十]+、|（[一二三四五六七八九十0-9]+）|\([一二三四五六七八九十0-9]+\)|[0-9]+[、.．]|[①②③④⑤⑥⑦⑧⑨⑩])/;
        const KEYWORD_PARA_RE = /^(附\s*則|總\s*則|說\s*明|主\s*旨|依\s*據|公告事項|辦\s*法)：?/;

        function isParaStart(curr, prevEnded, prevLen) {
            if (KEYWORD_PARA_RE.test(curr)) return true;
            let m = curr.match(/^第\s*[一二三四五六七八九十百千0-9]+\s*條(?:之[一二三四五六七八九十0-9]+)?(.?)/);
            if (m) return ARTICLE_ONLY_REGEX.test(curr) || /[\s　：:]/.test(m[1] || '') || prevEnded;
            if (/^第\s*[一二三四五六七八九十百千0-9]+\s*[編章節]/.test(curr)) {
                return (curr.length <= 36 && !/[。，；]/.test(curr)) || prevEnded;
            }
            if (/^第\s*[一二三四五六七八九十百千0-9]+\s*[款目]/.test(curr)) return prevEnded;
            if (ITEM_FIRST_RE.test(curr)) return true;
            if (ITEM_ANY_RE.test(curr)) return prevEnded || prevLen < 20;
            return false;
        }

        function reflowRegulationTextCore(rawText) {
            const norm = normalizeExtractedText(rawText);
            const tocMode = isTocText(norm);
            const rawLines = norm.replace(/\r\n/g, '\n').split('\n');
            const cleanedLines = [];

            for (const line of rawLines) {
                const trimmed = line.trim();
                if (!trimmed) continue;
                // 濾除頁碼雜訊（如 - 7 - 或 第 11 頁 / 共 331 頁）
                if (/^[-－—–]\s*\d+\s*[-－—–]$/.test(trimmed)) continue;
                if (/^第\s*\d+\s*頁(\s*\/\s*共\s*\d+\s*頁)?$/.test(trimmed)) continue;
                cleanedLines.push(trimmed);
            }

            if (cleanedLines.length === 0) return '';

            const newParagraphRegex = /^(第\s*[一二三四五六七八九十百千0-9]+\s*[編章節款目條](?:之[一二三四五六七八九十0-9]+)?|[一二三四五六七八九十]+、|（[一二三四五六七八九十0-9]+）|\([一二三四五六七八九十0-9]+\)|[0-9]+[、.．]|[①②③④⑤⑥⑦⑧⑨⑩]|附\s*則|總\s*則|說\s*明|主\s*旨|依\s*據|公告事項|辦\s*法)：?/;

            let result = '';
            for (let i = 0; i < cleanedLines.length; i++) {
                const curr = cleanedLines[i];
                if (i === 0) {
                    result = curr;
                    continue;
                }

                const prev = cleanedLines[i - 1];
                const needSpace = /[A-Za-z0-9]$/.test(prev) && /^[A-Za-z0-9]/.test(curr);

                // 目錄頁：每個條目以「⋯ p.N」結尾；換行折斷的條目要接回同一行
                if (tocMode) {
                    if (/⋯ p\.\d+$/.test(prev) || TOC_ENTRY_START_RE.test(curr)) {
                        result += '\n' + curr;
                    } else {
                        result += (needSpace ? ' ' : '') + curr;
                    }
                    continue;
                }

                const lastLogical = result.slice(result.lastIndexOf('\n') + 1);
                const prevEndedSentenceX = endsSentence(lastLogical);
                const isNewPara = isParaStart(curr, prevEndedSentenceX, prev.length);
                const prevIsHeading = prev.length <= 36 && !/[。，；]/.test(prev) && (
                    CHAPTER_MAJOR_REGEX.test(prev) ||
                    SECTION_MINOR_REGEX.test(prev) ||
                    ARTICLE_ONLY_REGEX.test(prev)
                );
                const prevEndedSentence = prevEndedSentenceX;

                if (isNewPara || prevIsHeading || prevEndedSentence) {
                    result += '\n' + curr;
                } else {
                    result += (needSpace ? ' ' : '') + curr;
                }
            }

            return result.trim();
        }

        /* 將一頁純文字拆解為「章節大標橫幅」與「條文卡片」兩種結構化單元 */
        function parsePageUnits(pageText) {
            const reflowed = reflowRegulationText(pageText);
            // 目錄頁整頁當成一張卡片，不要被拆成一條一條
            if (isTocText(reflowed)) {
                return [{ type: 'clause', text: reflowed, isToc: true }];
            }

            const lines = reflowed.split('\n');
            const units = [];
            let currentLines = [];

            const flushClause = () => {
                if (currentLines.length > 0) {
                    const joined = currentLines.join('\n').trim();
                    if (joined) {
                        units.push({ type: 'clause', text: joined });
                    }
                    currentLines = [];
                }
            };

            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed) continue;

                // 遇到「第X編／第X章」大標：獨立切出大標橫幅
                if (CHAPTER_MAJOR_REGEX.test(trimmed) && trimmed.length <= 36 && !/[。，；：]/.test(trimmed)) {
                    flushClause();
                    units.push({ type: 'chapter', level: 'major', text: trimmed });
                    continue;
                }

                // 遇到「第X節／附則／總則」中標：獨立切出次標橫幅
                if (SECTION_MINOR_REGEX.test(trimmed) && trimmed.length <= 36 && !/[。，；：]/.test(trimmed)) {
                    flushClause();
                    units.push({ type: 'chapter', level: 'minor', text: trimmed });
                    continue;
                }

                // 遇到「第X條」：結束上一條並開啟新條文卡片
                if (ARTICLE_HEADER_REGEX.test(trimmed) && currentLines.length > 0) {
                    flushClause();
                }

                currentLines.push(trimmed);
            }

            flushClause();
            return units.length > 0 ? units : [{ type: 'clause', text: reflowed }];
        }

        /* 將單條法規的每一行套用對應的層級樣式（目錄列、條號徽章、一、（一）1、（1）縮排） */
        function renderStructuredClauseHtml(blockText, keywords) {
            const lines = blockText.split('\n');
            const hl = (t) => highlightKeywords(t, keywords);
            return lines.map((line, idx) => {
                const trimmed = line.trim();
                if (!trimmed) return '';

                // 目錄條目：條目靠左、頁碼靠右
                const tocM = trimmed.match(/^(.*?)\s*⋯\s*p\.(\d+)$/);
                if (tocM) {
                    const isChapter = /^第\s*[一二三四五六七八九十百千0-9]+\s*[編章]/.test(tocM[1]);
                    return `<div class="toc-line${isChapter ? ' toc-chapter' : ''}" data-toc-title="${escapeHtml(tocM[1])}" data-toc-page="${tocM[2]}"><span class="toc-title">${hl(tocM[1])}</span><span class="toc-page">${tocM[2]}</span></div>`;
                }

                // 第X條（若條號獨立成行或緊接內文，自動分離條號徽章）
                if (idx === 0 && ARTICLE_HEADER_REGEX.test(trimmed)) {
                    const m = trimmed.match(/^(第\s*[一二三四五六七八九十百千0-9]+\s*條(?:之[一二三四五六七八九十0-9]+)?)\s*(.*)$/);
                    if (m) {
                        const artTitleHtml = `<div class="clause-article-heading">${hl(m[1])}</div>`;
                        const restHtml = m[2] ? `<div class="clause-line-main">${hl(m[2])}</div>` : '';
                        return artTitleHtml + restHtml;
                    }
                }

                // 第一層：一、二、三、
                if (/^[一二三四五六七八九十百]+、/.test(trimmed)) {
                    return `<div class="clause-line-lvl1">${hl(trimmed)}</div>`;
                }

                // 第二層：（一）（二）
                if (/^[（(][一二三四五六七八九十百]+[）)]/.test(trimmed)) {
                    return `<div class="clause-line-lvl2">${hl(trimmed)}</div>`;
                }

                // 第三層：1、 2. 或 ① ②
                if (/^([0-9]+[、.．]|[①②③④⑤⑥⑦⑧⑨⑩])/.test(trimmed)) {
                    return `<div class="clause-line-lvl3">${hl(trimmed)}</div>`;
                }

                // 第四層：（1）（2）
                if (/^[（(][0-9]+[）)]/.test(trimmed)) {
                    return `<div class="clause-line-lvl4">${hl(trimmed)}</div>`;
                }

                return `<div class="clause-line-main">${hl(trimmed)}</div>`;
            }).join('');
        }

        function extractClauseKey(blockText, pageNum, blockIdx) {
            const firstLine = (blockText || '').split('\n')[0].trim();
            const m = firstLine.match(/^(第\s*[一二三四五六七八九十百千0-9]+\s*條(?:之[一二三四五六七八九十0-9]+)?)/);
            if (m) {
                return m[1].replace(/\s+/g, '');
            }
            return `P${pageNum}-B${blockIdx}`;
        }

        /* =========================================================
           7. 通用輔助函式
           ========================================================= */
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function parseKeywords(q) {
            return Array.from(new Set(q.trim().split(/\s+/).filter(Boolean)));
        }

        function highlightKeywords(text, keywords) {
            const safe = escapeHtml(text);
            if (!keywords || keywords.length === 0) return safe;
            const escaped = keywords.map(k => escapeHtml(k).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
            const regex = new RegExp(`(${escaped.join('|')})`, 'gi');
            return safe.replace(regex, '<mark class="hl-match">$1</mark>');
        }

        function showToast(msg, type = 'normal') {
            const box = document.getElementById('toastBox');
            box.textContent = msg;
            box.className = 'toast-box show' + (type !== 'normal' ? ' ' + type : '');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => box.classList.remove('show'), 2500);
        }

        function setProgress(visible, text = '', percent = 0) {
            const panel = document.getElementById('progressPanel');
            if (!visible) {
                panel.classList.add('hidden');
                return;
            }
            panel.classList.remove('hidden');
            document.getElementById('progressText').textContent = text;
            document.getElementById('progressFill').style.width = `${Math.min(100, Math.max(0, percent))}%`;
        }

        function showConfirmModal(title, desc, confirmLabel = '確定', isDanger = true) {
            return new Promise((resolve) => {
                const modal = document.getElementById('confirmModal');
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalDesc').textContent = desc;
                const confirmBtn = document.getElementById('modalConfirmBtn');
                confirmBtn.textContent = confirmLabel;
                confirmBtn.className = 'modal-btn ' + (isDanger ? 'confirm-danger' : 'confirm-primary');
                modal.classList.remove('hidden');

                const cancelBtn = document.getElementById('modalCancelBtn');

                const cleanup = (res) => {
                    modal.classList.add('hidden');
                    cancelBtn.removeEventListener('click', onCancel);
                    confirmBtn.removeEventListener('click', onConfirm);
                    resolve(res);
                };
                const onCancel = () => cleanup(false);
                const onConfirm = () => cleanup(true);

                cancelBtn.addEventListener('click', onCancel);
                confirmBtn.addEventListener('click', onConfirm);
            });
        }

        function openFolderInputModal(title, desc, defaultVal = '') {
            return new Promise((resolve) => {
                const modal = document.getElementById('folderInputModal');
                const input = document.getElementById('folderNameInput');
                const cancelBtn = document.getElementById('cancelFolderModalBtn');
                const confirmBtn = document.getElementById('confirmFolderModalBtn');

                document.getElementById('folderModalTitle').textContent = title;
                document.getElementById('folderModalDesc').textContent = desc;
                input.value = defaultVal;
                modal.classList.remove('hidden');
                setTimeout(() => input.focus(), 40);

                const cleanup = (val) => {
                    modal.classList.add('hidden');
                    cancelBtn.removeEventListener('click', onCancel);
                    confirmBtn.removeEventListener('click', onConfirm);
                    input.removeEventListener('keydown', onKey);
                    resolve(val);
                };

                const onCancel = () => cleanup(null);
                const onConfirm = () => {
                    const trimmed = input.value.trim();
                    if (!trimmed) {
                        showToast('請輸入資料夾名稱', 'error');
                        return;
                    }
                    cleanup(trimmed);
                };
                const onKey = (e) => {
                    if (e.key === 'Enter') onConfirm();
                };

                cancelBtn.addEventListener('click', onCancel);
                confirmBtn.addEventListener('click', onConfirm);
                input.addEventListener('keydown', onKey);
            });
        }

        async function copyToClipboard(text) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) {}
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch (e) {
                return false;
            }
        }

        /* =========================================================
           8. 圖片純取文字與 PDF / TXT 解析引擎
           ========================================================= */
        async function runTesseractOCR(imageSource, labelPrefix) {
            setProgress(true, `${labelPrefix} 準備繁中 OCR 辨識引擎...`, 12);
            const loaded = await ensureTesseractLoaded();
            if (!loaded || !window.Tesseract) {
                return '（目前為離線或受限網路環境，無法下載 OCR 模型；您可點擊上方「編輯」圖示手動輸入文字）';
            }
            try {
                const result = await Tesseract.recognize(imageSource, 'chi_tra+eng', {
                    logger: (m) => {
                        if (m.status === 'recognizing text') {
                            const pct = Math.round((m.progress || 0) * 100);
                            setProgress(true, `${labelPrefix} 擷取文字中 (${pct}%)...`, pct);
                        } else if (m.status) {
                            setProgress(true, `${labelPrefix} 載入繁中辨識模型中...`, 25);
                        }
                    }
                });
                const raw = (result && result.data && result.data.text) ? result.data.text : '';
                const cleaned = raw
                    .replace(/([\u4e00-\u9fa5])\s+([\u4e00-\u9fa5])/g, '$1$2')
                    .replace(/\n{3,}/g, '\n\n')
                    .trim();
                return cleaned || '（未辨識到清晰文字，可點擊閱讀頁上方的「編輯」圖示手動補充）';
            } catch (err) {
                console.error('OCR 錯誤:', err);
                return '（圖片文字辨識失敗，請確認網路連線或點擊上方「編輯」手動補充）';
            }
        }

        async function parseAnyFile(file, index, total) {
            const lower = file.name.toLowerCase();
            const prefix = `[${index + 1}/${total}] ${cleanDisplayTitle(file.name)}`;

            if (file.type.startsWith('image/') || /\.(jpg|jpeg|png|webp)$/i.test(lower)) {
                const objectUrl = URL.createObjectURL(file);
                try {
                    const extractedText = await runTesseractOCR(objectUrl, prefix);
                    return {
                        isOcr: true,
                        pages: [{
                            pageNumber: 1,
                            text: extractedText
                        }]
                    };
                } finally {
                    URL.revokeObjectURL(objectUrl);
                }
            }

            if (lower.endsWith('.pdf')) {
                setProgress(true, `${prefix} 載入 PDF 解析引擎...`, 10);
                const pdfReady = await ensurePdfJsLoaded();
                if (!pdfReady || !window.pdfjsLib) {
                    return {
                        isOcr: false,
                        pages: [{
                            pageNumber: 1,
                            text: '（目前為離線或受限網路環境，無法載入 PDF 解析元件；建議連網後重新匯入或改傳 .txt 純文字檔）'
                        }]
                    };
                }

                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const pages = [];
                let usedOcr = false;

                for (let p = 1; p <= pdf.numPages; p++) {
                    setProgress(true, `${prefix} 讀取第 ${p}/${pdf.numPages} 頁...`, Math.round((p / pdf.numPages) * 85));
                    const page = await pdf.getPage(p);
                    const content = await page.getTextContent();

                    let lastY = null;
                    let lineText = '';
                    const lines = [];
                    for (const item of content.items) {
                        const y = item.transform ? item.transform[5] : null;
                        if (lastY !== null && y !== null && Math.abs(y - lastY) > 6) {
                            lines.push(lineText.trim());
                            lineText = item.str;
                        } else {
                            lineText += item.str;
                        }
                        lastY = y;
                    }
                    if (lineText.trim()) lines.push(lineText.trim());
                    let extracted = lines.join('\n').trim();

                    if (extracted.length < 15) {
                        const ocrReady = await ensureTesseractLoaded();
                        if (ocrReady && window.Tesseract) {
                            usedOcr = true;
                            const viewport = page.getViewport({ scale: 1.7 });
                            const canvas = document.createElement('canvas');
                            canvas.width = viewport.width;
                            canvas.height = viewport.height;
                            const ctx = canvas.getContext('2d');
                            await page.render({ canvasContext: ctx, viewport }).promise;
                            extracted = await runTesseractOCR(canvas, `${prefix} 第${p}頁(掃描)`);
                            canvas.width = 0;
                            canvas.height = 0;
                        }
                    }

                    pages.push({
                        pageNumber: p,
                        text: extracted || '（此頁無文字內容）'
                    });
                }
                return { isOcr: usedOcr, pages };
            }

            setProgress(true, `${prefix} 讀取純文字內容...`, 60);
            const rawText = await file.text();
            return {
                isOcr: false,
                pages: [{
                    pageNumber: 1,
                    text: rawText.replace(/\r\n/g, '\n').trim() || '（無文字內容）'
                }]
            };
        }

        async function processBatchFiles(fileList, targetFolderId, domain, forceOverwriteDocId = null) {
            const files = Array.from(fileList || []);
            if (files.length === 0) return;

            const folderId = targetFolderId || null;
            const dm = domain === 'm' ? 'm' : 's';
            const todayStr = new Date().toLocaleDateString('zh-TW');
            let added = 0;
            let updated = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                try {
                    const parsed = await parseAnyFile(file, i, files.length);
                    const cleanedTitle = cleanDisplayTitle(file.name);
                    const core = extractCoreName(file.name);

                    let existing = null;
                    if (forceOverwriteDocId) {
                        existing = documents.find(d => d.id === forceOverwriteDocId) || null;
                    } else {
                        existing = documents.find(d => d.domain === dm && extractCoreName(d.title) === core) || null;
                    }

                    if (existing) {
                        existing.title = cleanedTitle;
                        existing.coreName = core;
                        existing.isOcr = parsed.isOcr;
                        existing.pages = parsed.pages; delete existing.pageCount;
                        existing.updatedAt = todayStr;
                        existing.isRecentlyUpdated = true;
                        await dbPut(STORE_DOCS, existing);
                        updated++;
                    } else {
                        const newDoc = {
                            id: 'doc-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
                            domain: dm,
                            folderId,
                            title: cleanedTitle,
                            coreName: core,
                            isOcr: parsed.isOcr,
                            starred: false,
                            updatedAt: todayStr,
                            isRecentlyUpdated: false,
                            pages: parsed.pages
                        };
                        documents.push(newDoc);
                        await dbPut(STORE_DOCS, newDoc);
                        added++;
                    }
                } catch (err) {
                    console.error('匯入錯誤:', file.name, err);
                    showToast(`匯入失敗：${file.name}`, 'error');
                }
            }

            setProgress(false);
            sortDocuments();
            renderCurrentView();

            if (forceOverwriteDocId && activeDocId === forceOverwriteDocId) {
                renderReaderPage(forceOverwriteDocId, readerQuery);
            }

            if (updated > 0 && added > 0) {
                showToast(`新增 ${added} 份、覆蓋更新 ${updated} 份`, 'success');
            } else if (updated > 0) {
                showToast(`已覆蓋更新 ${updated} 份文件`, 'success');
            } else if (added > 0) {
                showToast(`成功匯入 ${added} 份文件`, 'success');
            }
        }

            documents.sort((a, b) => a.title.localeCompare(b.title, 'zh-Hant', { numeric: true }));
        }

        function buildMatchSnippet(doc, keywords) {
            if (!keywords || keywords.length === 0) return '';
            const units = buildDocUnits(doc);
            let bestText = '';
            let maxHits = 0;

            for (const u of units) {
                const lower = u.text.toLowerCase();
                let hits = 0;
                for (const kw of keywords) {
                    if (lower.includes(kw.toLowerCase())) hits++;
                }
                if (hits > maxHits) {
                    maxHits = hits;
                    bestText = u.text;
                }
            }

            const targetText = bestText || doc.pages.map(p => reflowRegulationText(p.text)).join('\n');
            const lowerTarget = targetText.toLowerCase();
            let firstIdx = -1;
            for (const kw of keywords) {
                const idx = lowerTarget.indexOf(kw.toLowerCase());
                if (idx !== -1 && (firstIdx === -1 || idx < firstIdx)) firstIdx = idx;
            }
            if (firstIdx === -1) return '';

            const start = Math.max(0, firstIdx - 28);
            const end = Math.min(targetText.length, firstIdx + 95);
            const slice = (start > 0 ? '...' : '') + targetText.slice(start, end) + (end < targetText.length ? '...' : '');
            return highlightKeywords(slice, keywords);
        }

        function getFilteredDocuments({ domain, folderId, onlyStarred, query }) {
            const keywords = parseKeywords(query || '');
            return documents.filter(doc => {
                if (domain && doc.domain !== domain) return false;
                if (folderId && doc.folderId !== folderId) return false;
                if (onlyStarred && !doc.starred) return false;
                if (keywords.length === 0) return true;
                const hay = (getFolderNameById(doc.folderId) + '\n' + cleanDisplayTitle(doc.title) + '\n' +
                    doc.pages.map(p => reflowRegulationText(p.text)).join('\n')).toLowerCase();
                return keywords.every(kw => hay.includes(kw.toLowerCase()));
            });
        }

        function enableFavDrag(list, handleRowMap) {
            list.querySelectorAll('.drag-handle').forEach(handle => {
                const row = handle.closest('.row');
                handle.addEventListener('click', e => e.stopPropagation());
                handle.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    row.classList.add('dragging');
                    let scrollTimer = null;
                    let lastY = e.clientY;

                    const reposition = () => {
                        const rows = Array.from(list.querySelectorAll('.row')).filter(r => r !== row);
                        for (const r of rows) {
                            const rect = r.getBoundingClientRect();
                            if (lastY >= rect.top && lastY <= rect.bottom) {
                                const before = lastY < rect.top + rect.height / 2;
                                if (before) list.insertBefore(row, r);
                                else list.insertBefore(row, r.nextSibling);
                                break;
                            }
                        }
                    };

                    const onMove = (ev) => {
                        lastY = ev.clientY;
                        reposition();
                        const vh = window.innerHeight;
                        let dy = 0;
                        if (lastY < 110) dy = -12;
                        else if (lastY > vh - 140) dy = 12;
                        if (dy !== 0 && !scrollTimer) {
                            scrollTimer = setInterval(() => { window.scrollBy(0, dy); reposition(); }, 30);
                        } else if (dy === 0 && scrollTimer) {
                            clearInterval(scrollTimer);
                            scrollTimer = null;
                        }
                    };

                    const onEnd = async () => {
                        window.removeEventListener('pointermove', onMove);
                        window.removeEventListener('pointerup', onEnd);
                        window.removeEventListener('pointercancel', onEnd);
                        if (scrollTimer) clearInterval(scrollTimer);
                        row.classList.remove('dragging');
                        const ids = Array.from(list.querySelectorAll('.row')).map(r => handleRowMap.get(r)).filter(Boolean);
                        for (let i = 0; i < ids.length; i++) {
                            const d = documents.find(x => x.id === ids[i]);
                            if (d && d.favOrder !== i) {
                                d.favOrder = i;
                                await dbPut(STORE_DOCS, d);
                            }
                        }
                    };

                    window.addEventListener('pointermove', onMove);
                    window.addEventListener('pointerup', onEnd);
                    window.addEventListener('pointercancel', onEnd);
                });
            });
        }

        function buildCategoryOptionsHtml(doc) {
            const cur = doc.domain + '|' + (doc.folderId || '');
